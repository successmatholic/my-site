<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATHOLIC</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 85% 15%, rgba(124,92,255,.35) 0%, rgba(124,92,255,0) 55%),
      linear-gradient(150deg,#1a1442 0%,#241a5c 55%,#2d1f6e 100%);
    color:#fff;
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
    letter-spacing:-.011em; word-break:keep-all;
  }
  .wrap{text-align:center; padding:20px;}
  .brand{font-size:15px; font-weight:800; letter-spacing:.03em; color:rgba(255,255,255,.65); margin-bottom:14px;}
  .brand b{color:#ffcf4d;}
  h1{font-size:34px; font-weight:800; letter-spacing:-.02em; margin:0 0 12px;}
  p{font-size:16px; color:rgba(255,255,255,.82); margin:0; line-height:1.65;}
  @media (max-width:480px){ h1{font-size:26px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MATHOLIC <b>PREMIUM</b></div>
  <h1>매쓰홀릭</h1>
  <p>수학, 데이터로 증명합니다.</p>
</div>
</body>
</html>
