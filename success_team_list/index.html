<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MATHOLIC 내부 페이지 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg-1:#1a1442; --bg-2:#241a5c; --bg-3:#2d1f6e;
    --gold:#ffcf4d; --gold-ink:#1a1442;
    --text:#fff; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.48);
    --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    background:linear-gradient(150deg,var(--bg-1) 0%,var(--bg-2) 55%,var(--bg-3) 100%) fixed;
    color:var(--text);
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
    letter-spacing:-.011em; word-break:keep-all;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 20px;}
  .wrap.main{padding-bottom:72px;}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px;}

  /* header */
  header{padding:40px 0 20px;}
  .brand{font-size:13px; font-weight:800; letter-spacing:.03em; color:var(--text-3);}
  .brand b{color:var(--gold); font-weight:800;}
  .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:8px;}
  h1{font-size:24px; font-weight:800; letter-spacing:-.025em; margin:0;}
  .notice{font-size:12.5px; color:#ffd9a8;}

  /* toolbar (sticky) */
  .toolbar{
    position:sticky; top:0; z-index:5;
    padding:12px 0 10px;
    background:rgba(26,20,66,.82);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}

  .seg{display:inline-flex; padding:3px; border-radius:10px; background:rgba(255,255,255,.07);}
  .seg button{
    border:0; background:transparent; cursor:pointer;
    font-size:13.5px; font-weight:700; color:var(--text-2);
    padding:7px 13px; border-radius:8px;
  }
  .seg button:hover{color:var(--text);}
  .seg button[aria-pressed="true"]{background:var(--gold); color:var(--gold-ink);}
  .seg .n{font-weight:600; opacity:.6; margin-left:5px; font-variant-numeric:tabular-nums;}
  .seg.small button{font-size:12.5px; padding:6px 11px;}

  .people{display:flex; gap:4px; margin-top:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .people::-webkit-scrollbar{display:none;}
  .person{
    flex-shrink:0; cursor:pointer; border:0; background:transparent;
    font-size:13px; font-weight:600; color:var(--text-2);
    padding:5px 10px; border-radius:999px;
  }
  .person:hover{background:var(--hover); color:var(--text);}
  .person[aria-pressed="true"]{background:rgba(255,207,77,.16); color:var(--gold);}
  .person .n{font-size:11.5px; opacity:.6; margin-left:3px; font-variant-numeric:tabular-nums;}
  .person.zero{color:var(--text-3);}

  /* list */
  .group{margin-top:22px;}
  .group h2{
    font-size:12.5px; font-weight:700; color:var(--text-3);
    margin:0 0 4px; padding:0 10px;
  }
  ul{list-style:none; margin:0; padding:0;}
  li{border-bottom:1px solid var(--line);}
  li:last-child{border-bottom:0;}
  .row{
    display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:14px;
    padding:0 6px 0 10px; min-height:46px; border-radius:8px;
  }
  .row:hover{background:var(--hover);}
  .row a{
    color:var(--text); text-decoration:none; font-size:15px; font-weight:600;
    padding:12px 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row a:hover{text-decoration:underline; text-decoration-color:rgba(255,255,255,.35); text-underline-offset:3px;}
  .kind{
    font-size:11px; font-weight:700; color:var(--text-3);
    border:1px solid rgba(255,255,255,.14); border-radius:5px; padding:1px 0; margin-right:10px;
    display:inline-block; min-width:4.6em; text-align:center; vertical-align:2px;
  }
  .kind-m{display:none;}
  .short{display:none;}
  .who{font-size:13px; color:var(--text-2); white-space:nowrap;}
  .when{font-size:12.5px; color:var(--text-3); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:3.2em; text-align:right;}
  .copy{
    border:0; background:transparent; cursor:pointer;
    font-size:12px; font-weight:700; color:var(--text-3);
    padding:6px 8px; border-radius:6px; min-width:52px;
  }
  .copy:hover{background:rgba(255,255,255,.08); color:var(--text);}
  .copy.done{color:var(--gold);}

  .empty{padding:40px 10px; color:var(--text-3); font-size:14px;}

  footer{margin-top:48px; font-size:12px; color:var(--text-3); line-height:1.6;}

  @media (max-width:560px){
    header{padding-top:28px;}
    h1{font-size:21px;}
    .row{grid-template-columns:1fr auto; grid-template-rows:auto auto; column-gap:10px; row-gap:0; padding:8px 4px 8px 10px;}
    .row a{grid-column:1 / 2; padding:2px 0; white-space:normal;}
    .meta-m{grid-column:1 / 2; display:flex; gap:8px;}
    .copy{grid-column:2; grid-row:1 / 3;}
    .row a .kind{display:none;}
    .kind-m{display:inline; font-size:12px; color:var(--text-3);}
    .long{display:none;} .short{display:inline;}
    .bar{flex-wrap:nowrap; gap:8px;}
    .seg button{padding:7px 9px; font-size:13px;}
    .seg .n{margin-left:3px;}
    .seg.small button{padding:6px 8px;}
    .notice{font-size:12px;}
  }
  @media (min-width:561px){ .meta-m{display:contents;} }
  @media (prefers-reduced-motion:no-preference){
    .seg button,.person,.copy,.row{transition:background-color .12s,color .12s;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">MATHOLIC <b>PREMIUM</b></div>
    <div class="title-row">
      <h1>내부 페이지 목록</h1>
      <span class="notice">⚠️ 팀 내부용 주소예요. 고객에게 공유하지 마세요.</span>
    </div>
  </header>
</div>

<div class="toolbar">
  <div class="wrap">
    <div class="bar">
      <div class="seg" id="kind-seg" role="group" aria-label="종류"></div>
      <div class="seg small" id="sort-seg" role="group" aria-label="정렬"></div>
    </div>
    <div class="people" id="people" role="group" aria-label="만든 사람"></div>
  </div>
</div>

<div class="wrap main">
  <main id="list"></main>

  <footer>검색엔진에는 노출되지 않지만, 주소를 아는 사람은 누구나 열 수 있어요. 복사 버튼은 고객에게 보낼 실제 페이지 주소를 복사합니다.</footer>
</div>

<script>
  // ── 팀원 ─────────────────────────────────────────────────
  // 팀원이 바뀌면 이 배열만 고치세요. 올린 페이지가 없는 팀원도 버튼이 보입니다.
  const TEAM = ["김민경", "김우정", "김지은", "박지현", "손수정", "이지만", "임지영", "허인경"];

  // ── 일반 프로젝트 ──────────────────────────────────────────
  // 새 프로젝트를 추가할 때는 이 배열에 한 줄 추가하세요.
  // owner는 만든 사람 이름(TEAM 표기 그대로), date는 처음 올린 날(YYYY-MM-DD)입니다.
  // 배열 순서는 상관없습니다. 화면에서 최신순/가나다순으로 정렬됩니다.
  const PROJECTS = [
    { title: "다푸네 연간 커리큘럼", path: "/dapunee/", owner: "김민경", date: "2026-08-28" },
    { title: "모바일 보고서", path: "/g15report/", owner: "미확인", date: "2026-08-28" },
    { title: "고객성공팀 영상 아카이빙", path: "/videoarchivebuilder/", owner: "김지은", date: "2026-09-27" },
    { title: "고객성공팀 온보딩", path: "/onboarding/", owner: "김지은", date: "2026-09-27" },
    { title: "그린챌린지로 학원 이벤트 열기", path: "/green-challenge-event/", owner: "김민경", date: "2026-09-30" },
    { title: "학생 가이드 (매쓰홀릭 앱 프리미엄)", path: "/st-app-guide/", owner: "김민경", date: "2026-10-14" },
  ];

  // ── 튜토리얼 빌더로 생성된 페이지 ─────────────────────────────
  // path는 "/tutorials/폴더이름/" 형식이고, owner·date 규칙은 위와 같습니다.
  const TUTORIALS = [
    { title: "정규교재 - 다푸네", path: "/tutorials/dapunee-textbook/", owner: "김민경", date: "2026-09-11" },
    { title: "교사 계정 생성 및 관리", path: "/tutorials/teacher-account-management/", owner: "김민경", date: "2026-09-22" },
    { title: "교재 제본 및 주문하기", path: "/tutorials/textbook-binding-order/", owner: "김민경", date: "2026-09-11" },
    { title: "라이트 시작가이드 2분 따라하기 8편", path: "/lite/", owner: "이지만", date: "2026-10-22" },
    { title: "교재비를 청구하고, 매쓰홀릭을 0원으로 사용해요", path: "/tutorials/textbook-fee-billing/", owner: "김민경", date: "2026-09-11" },
    { title: "쌍둥이 교재 (단원, 난이도 조절)", path: "/tutorials/twin-textbook-unit-difficulty/", owner: "김민경", date: "2026-09-11" },
    { title: "쌍둥이 교재 (원본문제 11 매칭)", path: "/tutorials/twin-textbook-matching/", owner: "김민경", date: "2026-09-11" },
    { title: "정규교재 - 소단원 교재", path: "/tutorials/regular-textbook-subunit/", owner: "김민경", date: "2026-09-11" },
    { title: "채점하기 (선생님 ver.)", path: "/tutorials/grading-teacher/", owner: "김민경", date: "2026-09-22" },
    { title: "학생 계정 생성 및 관리", path: "/tutorials/student-account-management/", owner: "김민경", date: "2026-09-22" },
    { title: "진단평가 생성하기", path: "/tutorials/jindan-test/", owner: "김민경", date: "2026-09-22" },
    { title: "채점하기 (학생 ver.)", path: "/tutorials/grading-student/", owner: "김민경", date: "2026-09-22" },
    { title: "진단지 생성하기", path: "/tutorials/jindan-test-paper/", owner: "김민경", date: "2026-09-22" },
    { title: "오답 관리하기(데일리 오답)", path: "/tutorials/wrong-answer-daily-weekly/", owner: "김민경", date: "2026-09-22" },
    { title: "오답 관리하기 (자동 오답유사)", path: "/tutorials/wrong-answer-auto/", owner: "김민경", date: "2026-09-22" },
    { title: "시중교재 오답 관리하기", path: "/tutorials/wrong-answer-commercial-textbook/", owner: "김민경", date: "2026-09-23" },
    { title: "TOMA 월간 전국 경시대회, 상장 수여로 학원 공신력 UP", path: "/tutorials/toma-test/", owner: "김민경", date: "2026-09-23" },
    { title: "지난주 배운 단원, 1초만에 복습 문제를 만들어요", path: "/tutorials/instant-quiz-last-week/", owner: "김민경", date: "2026-09-23" },
    { title: "오답 관리하기(특정 난이도)", path: "/tutorials/wrong-answer-difficulty/", owner: "김민경", date: "2026-09-23" },
    { title: "오답노트 만들기", path: "/tutorials/wrong-answer-note/", owner: "김민경", date: "2026-09-23" },
    { title: "구멍 난 유형만 콕! 1:1 맞춤 과제로 끝내요", path: "/tutorials/custom-assignment/", owner: "김민경", date: "2026-09-23" },
    { title: "시험 대비가 강한 학원을 만들어요(내신관)", path: "/tutorials/school-exam/", owner: "김민경", date: "2026-09-30" },
    { title: "시험 대비가 강한 학원을 만들어요(수능관)", path: "/tutorials/csat/", owner: "김민경", date: "2026-09-30" },
    { title: "시험 대비가 강한 학원을 만들어요(내신대비교재)", path: "/tutorials/school-exam-prep-books/", owner: "김민경", date: "2026-09-30" },
    { title: "시험 대비가 강한 학원을 만들어요(시험대장)", path: "/tutorials/exam-manager/", owner: "김민경", date: "2026-09-30" },
    { title: "통합 보고서", path: "/tutorials/integrated-report/", owner: "김민경", date: "2026-09-30" },
    { title: "그린챌린지 학원 이벤트 운영하기", path: "/tutorials/green-challenge/", owner: "김민경", date: "2026-09-30" },
    { title: "방학 특강 운영하기", path: "/tutorials/vacation-class/", owner: "김민경", date: "2026-09-30" },
    { title: "진단평가·진단지 생성하기", path: "/tutorials/jindan-test-all/", owner: "김민경", date: "2026-10-01" },
    { title: "시험 대비가 강한 학원을 만들어요(내신관·수능관)", path: "/tutorials/school-exam-csat/", owner: "김민경", date: "2026-10-01" },
    { title: "선생님께 1:1 질문하기", path: "/tutorials/st-app-teacher-question/", owner: "김민경", date: "2026-10-14" },
    { title: "학원 교재에 푼 문제를 채점하고 복습해요", path: "/tutorials/st-app-textbook-grading/", owner: "김민경", date: "2026-10-14" },
    { title: "매쓰홀릭 앱에서 바로 학습하기", path: "/tutorials/st-app-direct-learning/", owner: "김민경", date: "2026-10-14" },
  ];

  const SITE = "https://matholicpremium.netlify.app";
  const ALL = "전체";
  const KINDS = [
    { id: "all", label: "전체" },
    { id: "project", label: "제작 페이지", short: "제작" },
    { id: "tutorial", label: "튜토리얼" },
  ];
  const SORTS = [
    { id: "new", label: "최신순", short: "최신" },
    { id: "abc", label: "가나다순", short: "가나다" },
  ];

  const ITEMS = [
    ...PROJECTS.map(it => ({ ...it, kind: "project" })),
    ...TUTORIALS.map(it => ({ ...it, kind: "tutorial" })),
  ].map(it => ({ ...it, owner: it.owner || "미확인" }));

  const dataOwners = [...new Set(ITEMS.map(it => it.owner))];
  const extra = dataOwners.filter(o => !TEAM.includes(o) && o !== "미확인").sort((a, b) => a.localeCompare(b, "ko"));
  const OWNERS = [...TEAM, ...extra, ...(dataOwners.includes("미확인") ? ["미확인"] : [])];

  const store = {
    get(k, d) { try { return localStorage.getItem("stl:" + k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("stl:" + k, v); } catch (e) {} },
  };
  function ownerFromHash() {
    let h = "";
    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    return OWNERS.includes(h) ? h : ALL;
  }

  const state = {
    kind: KINDS.some(k => k.id === store.get("kind")) ? store.get("kind") : "all",
    sort: SORTS.some(s => s.id === store.get("sort")) ? store.get("sort") : "new",
    owner: ownerFromHash(),
  };

  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ofKind = it => state.kind === "all" || it.kind === state.kind;
  const ofOwner = it => state.owner === ALL || it.owner === state.owner;

  function monthLabel(d) {
    if (!d) return "날짜 없음";
    const [y, m] = d.split("-");
    return `${y}년 ${Number(m)}월`;
  }
  function shortDate(d, full) {
    if (!d) return "";
    const [y, m, dd] = d.split("-");
    return full ? `${y}.${m}.${dd}` : `${Number(m)}.${dd}`;
  }

  const lbl = o => o.short ? `<span class="long">${o.label}</span><span class="short">${o.short}</span>` : o.label;

  function renderControls() {
    document.getElementById("kind-seg").innerHTML = KINDS.map(k => {
      const n = ITEMS.filter(it => (k.id === "all" || it.kind === k.id) && ofOwner(it)).length;
      return `<button type="button" data-kind="${k.id}" aria-pressed="${k.id === state.kind}">${lbl(k)}<span class="n">${n}</span></button>`;
    }).join("");

    document.getElementById("sort-seg").innerHTML = SORTS.map(s =>
      `<button type="button" data-sort="${s.id}" aria-pressed="${s.id === state.sort}">${lbl(s)}</button>`
    ).join("");

    const inKind = ITEMS.filter(ofKind);
    document.getElementById("people").innerHTML = [ALL, ...OWNERS].map(o => {
      const n = o === ALL ? inKind.length : inKind.filter(it => it.owner === o).length;
      return `<button type="button" class="person${o !== ALL && !n ? " zero" : ""}" data-owner="${esc(o)}" aria-pressed="${o === state.owner}">${esc(o)}<span class="n">${n}</span></button>`;
    }).join("");
  }

  function rowHTML(it, fullDate) {
    const tag = state.kind === "all" ? `<span class="kind">${it.kind === "tutorial" ? "튜토리얼" : "제작"}</span>` : "";
    return `<li><div class="row">
      <a href="${esc(it.path)}">${tag}${esc(it.title)}</a>
      <div class="meta-m">
        <span class="kind-m">${state.kind !== "all" ? "" : it.kind === "tutorial" ? "튜토리얼" : "제작"}</span>
        <span class="who">${esc(it.owner)}</span>
        <span class="when">${shortDate(it.date, fullDate)}</span>
      </div>
      <button type="button" class="copy" data-path="${esc(it.path)}" aria-label="${esc(it.title)} 주소 복사">복사</button>
    </div></li>`;
  }

  function renderList() {
    const items = ITEMS.filter(it => ofKind(it) && ofOwner(it));
    const el = document.getElementById("list");

    if (!items.length) {
      const who = state.owner === ALL ? "" : `${state.owner} 님이 올린 `;
      const what = state.kind === "tutorial" ? "튜토리얼이" : state.kind === "project" ? "제작 페이지가" : "페이지가";
      el.innerHTML = `<p class="empty">아직 ${esc(who)}${what} 없어요.</p>`;
      return;
    }

    if (state.sort === "abc") {
      items.sort((a, b) => a.title.localeCompare(b.title, "ko"));
      el.innerHTML = `<section class="group"><ul>${items.map(it => rowHTML(it, true)).join("")}</ul></section>`;
      return;
    }

    items.sort((a, b) => (b.date || "").localeCompare(a.date || "") || a.title.localeCompare(b.title, "ko"));
    const groups = [];
    for (const it of items) {
      const label = monthLabel(it.date);
      if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
      groups[groups.length - 1].items.push(it);
    }
    el.innerHTML = groups.map(g =>
      `<section class="group"><h2>${g.label}</h2><ul>${g.items.map(it => rowHTML(it, false)).join("")}</ul></section>`
    ).join("");
  }

  function render() { renderControls(); renderList(); }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove(); return ok;
    } catch (e) { return false; }
  }

  document.addEventListener("click", async e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.kind) { state.kind = b.dataset.kind; store.set("kind", state.kind); render(); }
    else if (b.dataset.sort) { state.sort = b.dataset.sort; store.set("sort", state.sort); render(); }
    else if (b.dataset.owner) {
      state.owner = b.dataset.owner; render();
      // 주소 갱신은 부가 기능이라, 막힌 환경(미리보기 등)에서 실패해도 필터는 동작합니다.
      try {
        history.replaceState(null, "", location.pathname + location.search + (state.owner === ALL ? "" : "#" + encodeURIComponent(state.owner)));
      } catch (err) {}
    }
    else if (b.dataset.path) {
      const ok = await copyText(SITE + b.dataset.path);
      b.textContent = ok ? "복사됨" : "복사 실패";
      b.classList.toggle("done", ok);
      setTimeout(() => { b.textContent = "복사"; b.classList.remove("done"); }, 1500);
    }
  });
  window.addEventListener("hashchange", () => { state.owner = ownerFromHash(); render(); });

  render();
</script>
</body>
</html>
