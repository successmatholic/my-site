<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Style: framed sheet. The chrome is tinted from the paper form's green; the work sits on a white sheet.
   Grid: canvas = 100vw - 232 sidebar - 8 sheet inset - 2 border - 2 x 28 padding; 12 columns, one 16px gutter. */
:root {
  --ground: #ebebee; --surface: #ffffff; --raised: #f5f5f7; --active: #e8e8ed;
  --border: #e5e5ea; --rule: #efeff2; --control: #d1d1d6;
  --text: #1d1d1f; --muted: #6e6e73; --faint: #77777c;
  --accent: #5a9a2c;      /* the paper form's green, on data: a written log */
  --accent-ink: #3a6b17;  /* the same green as text, 4.5:1 on white */
  --tint: #d6e8c6;        /* half a log written */
  --primary: #007aff; --primary-ink: #ffffff;
  --positive: #3a6b17; --negative: #b8262b;
  --pill-positive-bg: #e2f1d6; --pill-positive-ink: #1f3d0b;
  --pill-negative-bg: #ffecea; --pill-negative-ink: #831c1e;
  --pill-neutral-bg: #f0f0f3; --pill-neutral-ink: #3a3a3c;
  --pill-mid-bg: #f6efd9; --pill-mid-ink: #5c4708;
  --paper: #7ab648;       /* print only: the form as the academy prints it */
  --font: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
  --fs-title: 26px; --fs-section: 16px; --fs-kpi: 24px; --fs-body: 14px; --fs-small: 12px;
  --sidebar: 236px; --gap: 16px; --pad: 32px; --card-pad: 20px;
  --r-sheet: 12px; --r-card: 10px; --r-control: 7px; --control-h: 30px;
  --blue: #007aff; --blue-hover: #0068dc;
  --ring: 0 0 0 3.5px rgba(0, 122, 255, .3);
  --shadow-ctl: 0 0 0 .5px rgba(0, 0, 0, .1), 0 .5px 1.5px rgba(0, 0, 0, .1);
  --shadow-card: 0 0 0 .5px rgba(0, 0, 0, .08), 0 1px 3px rgba(0, 0, 0, .04);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: var(--fs-body)/20px var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px; }
.mark { width: 28px; height: 28px; flex: none; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.scope { margin: 4px 8px 14px 46px; color: var(--muted); font-size: var(--fs-small); line-height: 16px; }
.group-label { margin: 18px 8px 6px; font-size: var(--fs-small); color: var(--faint); }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); transition: background-color .15s ease, color .15s ease; }
.nav-item svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--raised); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--active); color: var(--text); }
.nav-item .count { margin-left: auto; font-size: var(--fs-small); color: var(--muted); }
.sidebar .bottom { margin-top: auto; padding: 12px 10px 4px; color: var(--faint); font-size: var(--fs-small); line-height: 17px; }
.sheet { margin: 8px 8px 8px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sheet); min-width: 0; padding: 24px var(--pad) 40px; min-height: calc(100vh - 16px); }
.topbar { display: none; }

/* ---------- title row ---------- */
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.title-row h1 { font-size: var(--fs-title); line-height: 30px; font-weight: 700; letter-spacing: -0.02em; }
.title-row .sub { margin-top: 4px; color: var(--muted); font-size: 15px; }
.title-row .sub strong { color: var(--text); font-weight: 600; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.back { display: inline-block; margin-bottom: 6px; color: var(--muted); }
.back:hover { color: var(--text); }
.stamp { color: var(--faint); font-size: var(--fs-small); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-h); padding: 0 14px; border-radius: var(--r-control); border: 1px solid var(--control); background: var(--surface); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color .15s ease, transform .12s var(--ease-out); }
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn.primary:hover { background: #33362f; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--raised); }
.btn.sm { height: 30px; padding: 0 10px; }
.btn.danger { color: var(--negative); }
.btn[disabled] { color: var(--faint); cursor: not-allowed; }
.icon-btn { width: var(--control-h); padding: 0; }
.input, select.input { height: var(--control-h); padding: 0 10px; border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); min-width: 0; }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; line-height: 22px; resize: vertical; width: 100%; }
.input::placeholder, textarea::placeholder { color: var(--faint); }
.segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--raised); }
.segmented button { height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: background-color .15s ease, color .15s ease; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper .label { min-width: 150px; text-align: center; font-weight: 600; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: var(--gap); }
.filters .spacer { flex: 1; }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tabs button { position: relative; padding: 10px 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); }

/* ---------- panels ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
.stack { display: grid; gap: var(--gap); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--card-pad); min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel h2 { font-size: var(--fs-section); line-height: 22px; font-weight: 600; }
.panel .meta { color: var(--faint); font-size: var(--fs-small); }
.panel .lede { color: var(--muted); margin: -6px 0 12px; }
.card-link { color: var(--text); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; }
.card-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* KPIs: one divided strip */
.kpis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--gap); }
.kpi { padding: 14px var(--card-pad); }
.kpi + .kpi { border-left: 1px solid var(--border); }
.kpi-label { color: var(--muted); }
.kpi-value { margin-top: 4px; font-size: var(--fs-kpi); line-height: 30px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 2px; }
.kpi .note { margin-top: 2px; font-size: var(--fs-small); color: var(--muted); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { height: 36px; padding: 0 10px; text-align: left; font-weight: 400; font-size: var(--fs-small); color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th.n, td.n { text-align: right; }
th.c, td.c { text-align: center; }
td .sub { display: block; font-size: var(--fs-small); color: var(--muted); line-height: 17px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raised); }
tr.group td { padding: 18px 0 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
tr.group td .sub { display: inline; margin-left: 8px; font-weight: 400; }
tr.group:first-child td { padding-top: 6px; }
.truncate { display: block; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash { color: var(--faint); }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.who b { font-weight: 600; }
.who b, .who .sub { white-space: nowrap; }
.who .sub { margin-top: 1px; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-small); font-weight: 500; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); white-space: nowrap; flex: none; }
.pill.pos { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.pill.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }

/* a written half of the log: filled green dot; unwritten: dashed ring */
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1.5px dashed var(--control); }
.dot.on { background: var(--accent); border: 0; }
.st.on { color: var(--text); }
.m-only { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 720px) { .m-only { display: inline; } }

.ox { display: inline-flex; gap: 2px; padding: 2px; background: var(--raised); border-radius: 8px; }
.ox button { width: 32px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
.ox button[aria-pressed="true"][data-v="o"] { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.ox button[aria-pressed="true"][data-v="x"] { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.oxsum { white-space: nowrap; }
.oxsum .o { color: var(--positive); font-weight: 600; }
.oxsum .x { color: var(--negative); font-weight: 600; }

/* lists */
.rows { display: grid; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--rule); }
.row .grow { flex: 1; min-width: 0; }
.row .fig { text-align: right; white-space: nowrap; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); }
.empty { padding: 14px 16px; border: 1px dashed var(--control); border-radius: var(--r-control); color: var(--muted); }

/* ---------- editor: one screen, three short items ---------- */
.log-form { display: grid; gap: 0; }
.fsec { padding: 18px 0 20px; }
.fsec + .fsec { border-top: 1px solid var(--rule); }
.fsec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.fsec h2 { font-size: var(--fs-section); font-weight: 600; line-height: 22px; }
.fsec .hint { color: var(--faint); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lbl { display: grid; gap: 6px; }
.lbl > span { font-weight: 500; font-size: 13px; color: var(--muted); }
.lbl .input { width: 100%; }
textarea.memo { min-height: 64px; }
/* last lesson's plan, read-only, at the top */
.carry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 14px 16px; margin-bottom: 4px; background: var(--raised); border-radius: var(--r-card); font-size: 14px; }
.carry .when { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
.carry dt { color: var(--muted); white-space: nowrap; }
.carry dd { margin: 0; }
.hw-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hw-row .input { flex: 1 1 260px; }
.hwseg button[aria-pressed="true"][data-v="완료"] { background: var(--pill-positive-bg); color: var(--pill-positive-ink); box-shadow: none; }
.hwseg button[aria-pressed="true"][data-v="일부 완료"] { background: var(--pill-mid-bg); color: var(--pill-mid-ink); box-shadow: none; }
.hwseg button[aria-pressed="true"][data-v="미완료"] { background: var(--pill-negative-bg); color: var(--pill-negative-ink); box-shadow: none; }
.pill.mid { background: var(--pill-mid-bg); color: var(--pill-mid-ink); }
/* the Matholic result: extracted, so it reads apart from what the teacher wrote */
.mh { border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 16px; background: var(--surface); }
.mh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.mh-head b { font-weight: 600; }
.mh-head .src { color: var(--faint); font-size: 12px; margin-left: 8px; font-weight: 400; }
.mh-sum { display: grid; gap: 6px; font-size: 14px; }
.mh-sum .big { font-size: 18px; font-weight: 600; }
.mh-sum .k { color: var(--muted); margin-right: 6px; }
.mh-sum .quote { margin-top: 4px; padding: 10px 12px; background: var(--raised); border-radius: var(--r-control); color: var(--muted); font-size: 13px; line-height: 20px; }
.mh-edit { display: grid; gap: 10px; margin-top: 12px; }
.mh-edit .nums { display: grid; grid-template-columns: 120px 120px; gap: 10px; }
.paste textarea { min-height: 52px; height: 52px; border-style: dashed; background: var(--raised); resize: none; }
.paste textarea:focus { background: var(--surface); border-style: solid; }
.paste-msg { margin-top: 6px; font-size: 13px; color: var(--muted); }
.paste-msg:empty { display: none; }
.paste-msg.warn { color: var(--negative); }
/* 매쓰홀릭 결과 카드: 점수 → 학습 단계 → 미해결/해결 단원 → 출처 순으로 읽힌다 */
.mh-sum { gap: 14px; }
.mh-score { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.mh-score .big { font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em; }
.mh-score .big small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.mh-score .rate { color: var(--muted); }
.mh-score .rate b { color: var(--text); font-size: 18px; font-weight: 600; margin-left: 4px; }
.mh-bar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; margin-top: -6px; }
.mh-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.mh-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.mh-steps div { background: var(--raised); border-radius: var(--r-control); padding: 8px 12px; display: grid; gap: 2px; }
.mh-steps span { font-size: 12px; color: var(--muted); }
.mh-steps b { font-size: 16px; font-weight: 600; }
.mh-dl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 12px; margin: 0; align-items: start; }
.mh-dl dt { color: var(--muted); font-size: 13px; padding-top: 3px; display: flex; align-items: center; gap: 6px; }
.mh-dl dt .cnt { font-size: 12px; color: var(--text); font-weight: 600; }
.mh-dl dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 13px; line-height: 19px; }
.tag.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); font-weight: 600; }
.tag.pos { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
/* 엑셀 올리기 옆 도움말, 처음 안내 화면 */
.imp-wrap { display: inline-flex; align-items: center; gap: 2px; }
.btn.help { color: var(--muted); width: 30px; padding: 0; }
.btn.help:hover { color: var(--text); }
.help-dlg { max-width: 640px; }
dialog:has(.help-dlg) { width: min(640px, calc(100vw - 32px)); }
.guide { display: grid; gap: 14px; }
.mock { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); padding: 10px 12px; display: grid; gap: 10px; font-size: 12px; color: var(--muted); }
.mock .m-top { display: flex; gap: 14px; justify-content: center; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.mock .m-bar { display: flex; align-items: center; gap: 10px; }
.mock .m-sp { flex: 1; }
.mock .m-range { color: var(--text); font-weight: 600; }
.mock .m-date { padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; }
.mock .m-btn { padding: 4px 10px; border: 1px solid var(--control); border-radius: 4px; color: var(--text); }
.mock .m-grid { display: grid; grid-template-columns: 1.4fr repeat(5, 1fr); gap: 6px; }
.mock .m-cell { padding: 4px 6px; background: var(--raised); border-radius: 4px; white-space: nowrap; }
.mock .hit { position: relative; color: var(--text); font-weight: 600; outline: 2px solid #2f6fe0; outline-offset: 2px; border-radius: 4px; }
.mock .hit i { position: absolute; top: -10px; right: -10px; width: 18px; height: 18px; border-radius: 50%; background: #2f6fe0; color: #fff; font: 600 11px/18px var(--font); text-align: center; font-style: normal; }
.steps { list-style: decimal; padding-left: 22px; display: grid; gap: 6px; line-height: 21px; }
.steps li::marker { color: #2f6fe0; font-weight: 700; }
/* 처음 안내 화면: 무엇을 해 주는지(큰 문장 + 실제 일지 한 장) → 쓰는 방법 → 엑셀 받는 곳 */
.wel { display: grid; gap: 28px; }
.wel-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 40px; align-items: center; padding: 40px; background: var(--raised); border-radius: var(--r-sheet); }
.wel-copy h1 { font-size: 30px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; }
.wel-lede { margin-top: 14px; font-size: 16px; line-height: 27px; color: var(--muted); max-width: 34em; }
.wel-lede strong { color: var(--text); font-weight: 650; }.wel-cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.wel-cta .btn { height: 40px; padding: 0 18px; font-size: 15px; }
.wel-note { margin-top: 14px; color: var(--faint); font-size: 13px; }
.wel-note .card-link { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.wel-shot { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; display: grid; gap: 12px; font-size: 14px; }
.ws-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.ws-head b { font-size: 17px; font-weight: 700; }
.ws-head span { color: var(--muted); font-size: 13px; }
.ws-carry { position: relative; background: var(--raised); border-radius: var(--r-card); padding: 18px 14px 10px; display: grid; gap: 3px; }
.ws-flag { position: absolute; top: -9px; left: 12px; background: var(--accent-ink); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 8px; border-radius: 999px; }
.ws-flag.alt { background: #2f6fe0; }
.wel-shot .k { display: inline-block; width: 74px; color: var(--muted); font-size: 13px; flex: none; }
.ws-row { display: flex; align-items: center; gap: 6px; }
.ws-text { min-width: 0; }
.ws-seg { display: inline-flex; padding: 2px; background: var(--raised); border-radius: 8px; }
.ws-seg i { font-style: normal; padding: 3px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.ws-seg i.on { background: var(--pill-positive-bg); color: var(--pill-positive-ink); font-weight: 600; }
.ws-mh { position: relative; border: 1px solid var(--border); border-radius: var(--r-card); padding: 18px 14px 12px; display: grid; gap: 8px; margin-top: 6px; }
.ws-score { display: flex; align-items: baseline; gap: 4px; }
.ws-score > b { font-size: 24px; font-weight: 700; }
.ws-score small { color: var(--muted); }
.ws-score span { margin-left: auto; color: var(--muted); }
.ws-score span b { color: var(--text); font-size: 16px; }
.ws-bar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.ws-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.ws-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.wel-flow h2, .wel-guide h2 { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em; }
.wel-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); margin-top: 14px; }
.wel-steps article { border: 1px solid var(--border); border-radius: var(--r-card); padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.wel-steps h3 { font-size: 17px; line-height: 24px; font-weight: 700; }
.wel-steps p { color: var(--muted); line-height: 22px; flex: 1; }
.wf { margin-top: 8px; padding: 12px; background: var(--raised); border-radius: var(--r-control); font-size: 13px; }
.wf-fields { display: grid; gap: 6px; }
.wf-fields span { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; color: var(--muted); }
.wf-fields i { font-style: normal; }
.wf-file { display: flex; align-items: center; gap: 10px; color: var(--muted); line-height: 18px; }
.wf-file .file { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-file .arrow { color: var(--faint); }
.wf-file b { color: var(--text); }
.wf-meter { display: grid; gap: 8px; }
.wf-meter div { display: grid; grid-template-columns: 48px minmax(0, 1fr) 36px; align-items: center; gap: 8px; color: var(--muted); }
.wf-meter i { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; }
.wf-meter b { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.wf-meter em { font-style: normal; color: var(--text); font-weight: 600; text-align: right; }
.wel-guide { display: grid; gap: 16px; padding: 28px; border: 1px solid var(--border); border-radius: var(--r-sheet); }
.wel-guide .guide { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: center; gap: 28px; }
.wel-guide .wel-cta { margin-top: 0; }
.wel-foot { color: var(--faint); font-size: 13px; }
@media (max-width: 1100px) { .wel-hero { grid-template-columns: 1fr; padding: 28px; } .wel-steps { grid-template-columns: 1fr; } .wel-guide .guide { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .wel-hero { padding: 20px 16px; gap: 24px; } .wel-copy h1 { font-size: 24px; line-height: 32px; } .wel-shot { padding: 16px; } .wel-shot .k { width: 64px; } .wel-guide { padding: 18px 16px; } .ws-seg i { padding: 3px 7px; } }
.feat h2 { margin-bottom: 6px; }
.feat p { color: var(--muted); line-height: 22px; }
.feat p b { color: var(--text); font-weight: 600; }
.preview { margin-top: 12px; padding: 12px 14px; background: var(--raised); border-radius: var(--r-card); display: grid; gap: 8px; font-size: 13px; }
.pv-carry { color: var(--muted); }
.pv-carry span { display: block; font-size: 12px; margin-bottom: 2px; }
.pv-carry b { color: var(--text); font-weight: 600; }
.pv-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 10px; }
.pv-row .pv-k { color: var(--muted); font-size: 12px; }
.pv-row > :last-child { justify-self: start; }
.start h2 { margin-bottom: 4px; }
.start .muted { margin-bottom: 14px; }
.start-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
/* 주간·월간 기록: 기간 직접 설정, 정답률·재학습 막대 */
.range { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.range .presets { display: inline-flex; gap: 2px; }
.meter { display: grid; grid-template-columns: minmax(60px, 120px) auto auto; align-items: center; gap: 8px; }
.meter .mbar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.meter .mbar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.meter b { font-size: 14px; font-weight: 600; color: var(--text); min-width: 38px; text-align: right; }
.meter .dash { font-size: 12px; }
.meter.low .mbar i { background: var(--negative); }
.meter.low b { color: var(--negative); }
.tag.sm { font-size: 12px; padding: 1px 7px; line-height: 18px; }
.rate-table td { vertical-align: middle; }
#rep-body > .kpis { margin-bottom: var(--gap); }
.mh-score .basis { font-size: 12px; color: var(--faint); font-weight: 400; margin-left: 8px; }
.mh-others { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--rule); }
.mh-sub { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
.mh-sub .cnt { color: var(--text); font-weight: 600; font-size: 12px; }
.mh-sub .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
.mh-o { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; background: var(--raised); border-radius: var(--r-control); }
.mh-o .tag { background: var(--surface); color: var(--text); font-size: 12px; padding: 1px 8px; box-shadow: 0 0 0 1px var(--border); white-space: nowrap; }
.mh-o .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.mh-o .v { white-space: nowrap; color: var(--muted); font-size: 13px; }
.mh-o .v b { color: var(--text); font-weight: 600; font-size: 14px; }
.mh-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
@media (max-width: 720px) { .mh-dl { grid-template-columns: 1fr; gap: 4px; } .mh-dl dd { margin-bottom: 8px; } }
.muted { color: var(--muted); }
.imp { display: grid; gap: 6px; padding: 12px 14px; background: var(--raised); border-radius: var(--r-card); }
.check { display: flex; align-items: center; gap: 8px; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); }
.add-mh { display: flex; align-items: center; gap: 10px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--faint); font-size: 13px; }
.legacy { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
.legacy summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.legacy dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 14px; margin-top: 12px; font-size: 13px; }
.legacy dt { color: var(--muted); }
.legacy dd { margin: 0; white-space: pre-wrap; }
.rail .row { min-height: 56px; }
.rail a.row:hover b { text-decoration: underline; text-underline-offset: 3px; }
.rail .row.cur { background: var(--active); margin: 0 -10px; padding: 8px 10px; border-radius: 8px; }
.rail .row.cur + .row, .rail .row + .row.cur { border-top-color: transparent; }
.clip { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }

/* ---------- record matrix ---------- */
.matrix { width: auto; min-width: 100%; }
.matrix th, .matrix td { padding: 0; border-bottom: 0; text-align: center; }
.matrix th { height: 34px; font-size: 11px; line-height: 13px; color: var(--muted); }
.matrix th.we { color: var(--negative); }
.matrix th.today { color: var(--text); font-weight: 700; }
.matrix td.name, .matrix th.name { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding-right: 12px; white-space: nowrap; width: 150px; }
.matrix td.name { height: 26px; font-size: 13px; }
.matrix td.name .sub { display: inline; margin-left: 6px; font-size: 12px; }
.matrix .sel { width: 15px; height: 15px; margin: 0 8px 0 0; vertical-align: -3px; accent-color: var(--green, #5a9a2c); cursor: pointer; }
.sel-chip { display: inline-flex; align-items: center; gap: 6px; margin-left: 6px; color: var(--ink, #1b1b1b); font-weight: 600; }
.matrix tr.cls td { padding: 12px 0 4px; text-align: left; font-weight: 600; font-size: 13px; }
.matrix tr.cls:first-child td { padding-top: 2px; }
.mk { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: middle; }
.mk.full { background: var(--accent); }
.mk.half { background: var(--tint); }
.mk.miss { border: 1.5px dashed #b0b5a8; }
.mk.plan { width: 4px; height: 4px; border-radius: 50%; background: var(--control); }
.matrix td.cellwrap { width: 26px; min-width: 22px; height: 26px; }
.matrix a.cell { display: grid; place-items: center; width: 100%; height: 26px; border-radius: 4px; }
.matrix a.cell:hover { background: var(--raised); }
.matrix .todaycol { background: var(--raised); }
/* 체크한 학생: 이름부터 마지막 날짜까지 한 줄 전체에 배경색 */
.matrix tr.on td { background: #e9f5df; }
.matrix tr.on td.name { font-weight: 600; }
.matrix.fixed { table-layout: fixed; width: 100%; min-width: 720px; }
.matrix td.wk { width: auto; padding: 0 3px; }
.matrix td.wk a.cell { display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding: 0 8px; }
.matrix td.wk .mk.plan { margin-left: 13px; }
.matrix .ct { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.matrix th.wkh { text-align: left; padding-left: 11px; }
@media (max-width: 720px) { .matrix.fixed { min-width: 0; } .matrix .ct { display: none; } .matrix td.wk a.cell { justify-content: center; padding: 0; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: var(--fs-small); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .mk { width: 12px; height: 12px; border-radius: 3px; }
.legend .mk.plan { width: 4px; height: 4px; }

/* settings */
.set-row { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; padding: 28px 0; }
.set-row + .set-row { border-top: 1px solid var(--rule); }
.set-row h2 { font-size: var(--fs-section); font-weight: 600; }
.set-row .desc { margin-top: 6px; color: var(--muted); }
.set-panel { background: var(--raised); border-radius: 12px; padding: 18px; display: grid; gap: 14px; align-content: start; }
.set-panel table td { background: none; }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days label { position: relative; }
.days input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.days span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-control); border: 1px solid var(--control); background: var(--surface); color: var(--muted); }
.days input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
.days input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.logo-prev { width: 120px; height: 48px; border-radius: 6px; background: var(--surface); border: 1px dashed var(--control); display: grid; place-items: center; color: var(--faint); font-size: 12px; overflow: hidden; }
.logo-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }
.notice { padding: 10px 12px; border-radius: var(--r-control); background: #fbf8ec; border: 1px solid #ecdfa7; color: #6f4f0c; font-size: 13px; line-height: 19px; }

/* dialog: it floats, so it may carry a shadow */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.18); color: var(--text); }
dialog::backdrop { background: rgba(20, 22, 19, .35); }
dialog form { padding: 24px; display: grid; gap: 14px; }
dialog h2 { font-size: 18px; font-weight: 700; }
dialog .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
dialog .foot .left { margin-right: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); transition: opacity .2s ease, transform .25s var(--ease-out); pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- macOS layer: sidebar on the window ground, a floating sheet, system controls ---------- */
body { letter-spacing: -0.006em; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 7px; }
.sidebar { padding: 18px 10px; }
.brand { padding: 6px 10px 2px; }
.brand b { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.scope { margin: 2px 10px 20px 48px; color: var(--faint); }
.group-label { margin: 20px 10px 4px; font-size: 11px; font-weight: 600; color: var(--faint); }
.nav-item { height: 30px; padding: 0 10px; gap: 9px; border-radius: 7px; color: var(--text); }
.nav-item svg { color: var(--blue); stroke-width: 1.6; }
.nav-item:hover { background: rgba(0, 0, 0, .045); color: var(--text); }
.nav-item[aria-current="page"] { background: rgba(0, 0, 0, .085); font-weight: 600; }
.nav-item .count { color: var(--faint); }
.nav-sep { height: 1px; margin: 8px 10px; background: rgba(0, 0, 0, .07); }
.sheet { margin: 10px 10px 10px 0; border: 0; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .05); padding: 30px var(--pad) 48px; }
.title-row h1 { line-height: 32px; letter-spacing: -0.028em; }
.title-row .sub { font-size: 14px; }

.btn { border: 0; border-radius: 7px; background: #fff; box-shadow: var(--shadow-ctl); font-size: 13.5px; padding: 0 13px; transition: background-color .15s ease, box-shadow .15s ease, transform .12s var(--ease-out); }
.btn:hover { background: #fafafb; }
.btn:active { transform: scale(.97); background: #f0f0f2; }
.btn.primary { background: var(--blue); color: #fff; box-shadow: 0 .5px 1.5px rgba(0, 70, 180, .35); }
.btn.primary:hover { background: var(--blue-hover); }
.btn.ghost, .btn.help { background: transparent; box-shadow: none; }
.btn.ghost:hover, .btn.help:hover { background: rgba(0, 0, 0, .05); }
.btn.sm { height: 26px; font-size: 13px; }
.icon-btn, .btn.help { padding: 0; }
.btn[disabled] { opacity: .5; }
.input, select.input { border: 0; border-radius: 7px; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2), 0 .5px 1px rgba(0, 0, 0, .04); transition: box-shadow .15s ease; }
.input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--blue), var(--ring); }
.segmented, .ox, .ws-seg { background: rgba(0, 0, 0, .06); border-radius: 8px; }
.segmented button { height: 26px; color: var(--text); font-size: 13px; }
.segmented button[aria-pressed="true"] { box-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .14); font-weight: 600; }
.ox button { height: 26px; }
.ox button[aria-pressed="true"] { box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.tabs { border-bottom-color: var(--rule); }
.tabs button[aria-selected="true"]::after { background: var(--blue); border-radius: 2px; }
.days span { border: 0; box-shadow: var(--shadow-ctl); border-radius: 8px; }
.days input:checked + span { background: var(--blue); }
.check input { accent-color: var(--blue); }
:is(.btn, .input, .segmented button, .ox button, .nav-item, .days input + span):focus-visible { box-shadow: var(--ring); }

.panel, .mh, .mock, .wel-shot { border: 0; box-shadow: var(--shadow-card); }
.panel { border-radius: 12px; }
.kpis { border: 0; background: var(--raised); border-radius: 12px; }
.kpi + .kpi { border-left-color: rgba(0, 0, 0, .06); }
.kpi-label { font-size: 13px; }
.kpi-value { letter-spacing: -0.02em; }
th { color: var(--faint); font-weight: 500; }
.set-panel { border-radius: 14px; }
.notice { border: 0; border-radius: 10px; }
.empty { border: 0; background: var(--raised); border-radius: 10px; }

.wel { gap: 32px; }
.wel-hero { padding: 48px; border-radius: 20px; gap: 48px; }
.wel-copy h1 { font-size: 34px; line-height: 44px; letter-spacing: -0.032em; }
.wel-lede { font-size: 16.5px; }
.wel-cta .btn { height: 36px; padding: 0 18px; font-size: 14.5px; border-radius: 9px; }
.wel-shot { border-radius: 14px; padding: 0 22px 20px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 18px 44px rgba(0, 0, 0, .1); }
.ws-lights { display: flex; gap: 8px; margin: 0 -22px; padding: 12px 14px; }
.ws-lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .12); }
.ws-lights i:nth-child(2) { background: #febc2e; }
.ws-lights i:nth-child(3) { background: #28c840; }
.ws-flag.alt, .mock .hit i { background: var(--blue); }
.mock .hit { outline-color: var(--blue); }
.steps li::marker { color: var(--blue); }
.wel-steps article { border: 0; background: var(--raised); border-radius: 16px; padding: 22px; }
.wel-steps .wf { background: #fff; border-radius: 10px; }
.wf-fields span, .wf-file .file { border: 0; box-shadow: var(--shadow-ctl); }
.wel-guide { border: 0; background: var(--raised); border-radius: 20px; padding: 32px; }
@media (max-width: 1100px) { .wel-hero { padding: 28px; } }
@media (max-width: 720px) { .wel-hero { padding: 20px 16px; gap: 24px; } .wel-copy h1 { font-size: 25px; line-height: 33px; } .wel-shot { padding: 0 16px 16px; } .ws-lights { margin: 0 -16px; } .wel-guide { padding: 20px 16px; } }

dialog { border-radius: 14px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 24px 70px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(0, 0, 0, .2); }
dialog[open] { animation: pop .22s var(--ease-out); }
.toast { background: rgba(30, 30, 32, .88); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-radius: 12px; font-weight: 500; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
#view > * { animation: rise .32s var(--ease-out) both; }
@media (prefers-reduced-motion: reduce) { #view > *, dialog[open] { animation: none; } }
@media (max-width: 1100px) {
  .sheet { box-shadow: none; }
  .app .topbar { background: rgba(235, 235, 238, .82); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom-color: rgba(0, 0, 0, .08); }
}

/* ---------- tablet and phone ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; background: var(--surface); transform: translateX(-100%); transition: transform .22s var(--ease-out); padding: 16px; }
  .sidebar.open { transform: none; }
  .sidebar .close { display: inline-flex !important; position: absolute; top: 12px; right: 12px; }
  .topbar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; position: sticky; top: 0; z-index: 10; background: var(--ground); border-bottom: 1px solid var(--border); }
  .topbar b { font-weight: 700; }
  .topbar .grow { flex: 1; }
  .sheet { margin: 0; border: 0; border-radius: 0; min-height: calc(100vh - 52px); padding: 20px 24px 40px; }
  .span-8, .span-4, .span-7, .span-5 { grid-column: span 12; }
}
@media (max-width: 720px) {
  .sheet { padding: 16px 16px 40px; }
  .title-row h1 { font-size: 21px; line-height: 28px; }
  .kpis { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi + .kpi { border-left: 0; }
  .kpi:nth-child(n + 3) { border-top: 1px solid var(--border); }
  .kpi:nth-child(2n) { border-left: 1px solid var(--border); }
  .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .two, .three { grid-template-columns: 1fr; }
  .set-row { grid-template-columns: 1fr; gap: 14px; }
  .actions { width: 100%; }
  .stepper .label { min-width: 0; flex: 1; }
  /* tables become two-line rows */
  table.cards thead { display: none; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards tr:not(.group) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  table.cards tr:not(.group) td { padding: 0; border: 0; text-align: left; }
  table.cards td[data-l]::before { content: attr(data-l) " "; color: var(--muted); font-size: 12px; }
  table.cards td.first { grid-column: 1; }
  table.cards td.act { grid-column: 2; grid-row: 1; justify-self: end; }
  table.cards td.minor { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

}

/* ---------- print: one compact record per lesson, grouped by student ---------- */
/* 예시 데이터 안내 띠: 예시 학원이 남아 있는 동안 모든 화면 위에 */
.samplebar { display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 16px; margin-bottom: 22px; border-radius: 12px; background: #eaf3ff; box-shadow: inset 0 0 0 .5px rgba(0, 122, 255, .3); color: #0b3b75; line-height: 20px; }
.samplebar .sb-i { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font: italic 700 13px Georgia, serif; }
.samplebar .sb-t { flex: 1; min-width: 0; }
.samplebar b { font-weight: 700; }
.samplebar .btn { flex: none; }
@media (max-width: 720px) { .samplebar { flex-wrap: wrap; } .samplebar .btn { width: 100%; } }

#print-area { display: none; }
@media print {
  @page { size: A4 portrait; margin: 12mm; }

}
.pr { font-size: 10pt; line-height: 1.45; color: #1b1b1b; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.pr table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.pr th { text-align: left; font-weight: 600; font-size: 9pt; color: #fff; background: var(--paper); padding: 1.5mm 2mm; }
.pr td { border-bottom: 0.3mm solid #ddd; padding: 2mm; vertical-align: top; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.pr tr { break-inside: avoid; page-break-inside: avoid; }
.pr .d { width: 22mm; font-weight: 600; white-space: nowrap; }
.pr .s { color: #555; font-size: 9pt; }
.pr .none { color: #999; }
/* 기간 요약: 수업 횟수·평균 정답률·오답 재학습 정답률·과제 */
.pr-sum { display: flex; gap: 4mm; align-items: stretch; margin: 0 0 3mm; break-inside: avoid; }
.pr-sum .k { border: 0.3mm solid #ccc; border-radius: 1.5mm; padding: 1.5mm 2.5mm; min-width: 24mm; }
.pr-sum .k span { display: block; font-size: 8pt; color: #555; }
.pr-sum .k b { font-size: 14pt; font-weight: 700; }
.pr-sum .k small { display: block; font-size: 7.5pt; color: #777; }
/* 학습 결과 칸: 정답률 → 오답 재학습 정답률 → 미해결 개념 → 미완료 과제 → 그 밖의 채점 */
.pr td.mhc { white-space: normal; }
.pr .mhc > div + div { margin-top: 0.8mm; }
.pr .pc { font-weight: 700; font-size: 10.5pt; }
.pr .pc.hi { color: #2e7d32; }

.pr .mhc i { font-style: normal; font-weight: 600; color: #333; }

.pr .mhc .rp { font-weight: 700; color: #b26a00; }

/* 보완할 단원 / 다시 풀어 해결한 단원 */
.pr .pp-cols { display: flex; gap: 4mm; margin: 0 0 3mm; break-inside: avoid; }
.pr .pp-box { flex: 1; border: 0.3mm solid #ccc; border-radius: 1.5mm; padding: 2mm 3mm; }
.pr .pp-box h3 { font-size: 10pt; margin: 0 0 1.5mm; }

/* ---------- 매쓰홀릭 공책 톤: 도구 목록(../index.html)과 같은 모눈종이 바탕 + 로고 색 + 사칙연산 스티커 ---------- */
:root {
  --tool: #437f34; --tool-hover: #36692a; --tool-hl: #d9efc6;
  --text: #1d2740; --muted: #58617a; --faint: #8089a0;
  --border: #dfe5ef; --rule: #edf0f5; --raised: #f5f7fb; --active: #e9eef5; --control: #cfd6e2;
  --primary: var(--tool); --blue: var(--tool); --blue-hover: var(--tool-hover);
  --ring: 0 0 0 3.5px rgba(67, 127, 52, .28);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, "Malgun Gothic", sans-serif;
}
body { letter-spacing: -0.01em; }
@media screen {
  body { background-color: #fbfcfe; background-image: linear-gradient(#e6ecf6 1px, transparent 1px), linear-gradient(90deg, #e6ecf6 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
}
/* 왼쪽 위 표시: 책 아이콘 대신 = 스티커 */
.brand .mark, .topbar .mark { display: none; }
.brand::before, .topbar b::before { content: "="; display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tool); color: #fff; font-size: 19px; font-weight: 700; line-height: 1;
  box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--tool-hl); transform: rotate(-6deg); }
.topbar b { display: inline-flex; align-items: center; gap: 10px; }
.topbar b::before { width: 24px; height: 24px; font-size: 16px; }
.brand b { font-weight: 700; }
.nav-item { border-radius: 999px; }
.nav-item[aria-current="page"] { background: var(--tool-hl); }
@media (max-width: 1100px) { .app .topbar { background: rgba(251, 252, 254, .9); } }
.sheet { border-radius: 20px; box-shadow: 0 0 0 1.5px var(--border), 0 3px 0 1.5px var(--border); }
.title-row h1 { width: fit-content; padding: 0 3px; font-weight: 800; letter-spacing: -0.035em; background: linear-gradient(transparent 58%, var(--tool-hl) 58%); }
.btn { border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--border); }
.btn:active { transform: translateY(1px); }
.btn.primary { box-shadow: 0 2px 0 rgba(0, 0, 0, .14); font-weight: 600; }
.btn.primary:active { transform: translateY(2px); box-shadow: none; }
.btn.ghost, .btn.help { box-shadow: none; }
.segmented, .ox, .ws-seg { border-radius: 999px; }
.segmented button, .ox button { border-radius: 999px; }
.panel, .mh, .mock, .wel-shot { box-shadow: 0 0 0 1.5px var(--border); }
.panel { border-radius: 16px; }
.kpis { border-radius: 16px; }
.kpi-value { font-weight: 700; }
.wel-shot { box-shadow: 0 0 0 1.5px var(--border), 0 12px 30px rgba(29, 39, 64, .08); }
.ws-lights i { background: #c43d61; box-shadow: none; }
.ws-lights i:nth-child(2) { background: #2a7b89; }
.ws-lights i:nth-child(3) { background: #437f34; }
dialog { border-radius: 20px; }
.samplebar { background: #fff; box-shadow: inset 0 0 0 1.5px var(--tool-hl); color: var(--text); }
.samplebar .sb-i { background: var(--tool); font-family: inherit; font-style: normal; font-size: 14px; }
@media (max-width: 1100px) { .sheet { box-shadow: none; border-radius: 0; } }
@media print { .title-row h1 { background: none; } }

/* ---------- 학습 현황: 보고서 반별·학년별, 학생 화면 그래프, 확인 필요 표시 ---------- */
:root { --s1: #437f34; --s2: #3b6fd4; }   /* 차트 두 계열: 정답률(초록) · 오답 재학습 정답률(파랑). 색약 검사 통과 */
.kpi .delta { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0; }
.delta.up { color: var(--positive); } .delta.down { color: var(--negative); } .delta.flat { color: var(--faint); font-weight: 500; }
.kpi-value .nd { font-size: 15px; font-weight: 500; color: var(--faint); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--pill-mid-bg); color: var(--pill-mid-ink); }
.chip.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.chip.muted { background: var(--raised); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.who .chips, .row .chips { margin-top: 4px; }
.recent { display: grid; gap: 4px; padding: 10px 12px; margin-bottom: 12px; background: var(--raised); border-radius: 12px; font-size: 13px; }
.recent .delta { margin-left: 4px; font-size: 12px; font-weight: 600; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
/* 반별 가로 막대: 한 반에 두 막대(정답률·재학습), 막대 사이 2px, 끝만 둥글게 */
.hbars { display: grid; gap: 4px; }
.hb-row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; border: 0; background: none; text-align: left; width: calc(100% + 16px); }
.hb-row:hover { background: var(--raised); }
.hb-name { min-width: 0; }
.hb-name b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-name small { color: var(--muted); font-size: 12px; }
.hb-bars { display: grid; gap: 2px; }
.hb-bar { display: grid; grid-template-columns: minmax(0, 1fr) 40px; align-items: center; gap: 8px; height: 12px; }
.hb-track { height: 10px; background: linear-gradient(90deg, var(--rule) 0 1px, transparent 1px) 0 0 / 10% 100%; border-radius: 0; }
.hb-track i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-bar.re .hb-track i { background: var(--s2); }
.hb-row.low .hb-track i { opacity: .45; }
.hb-val { font-size: 12px; line-height: 12px; text-align: right; color: var(--text); font-weight: 600; }
.hb-val.nd { color: var(--faint); font-weight: 400; }
.axis-note { display: flex; justify-content: space-between; margin: 6px 0 0 144px; font-size: 11px; color: var(--faint); padding-right: 48px; }
/* 선 그래프 */
.lchart { width: 100%; height: auto; display: block; overflow: visible; }
.lchart text { font: 11px var(--font); fill: var(--faint); }
.lchart .gl { stroke: var(--rule); stroke-width: 1; }
.lchart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.lchart .hit { fill: transparent; }
.lchart .hit:hover { fill: rgba(29, 39, 64, .04); }
.tip { position: fixed; z-index: 60; pointer-events: none; background: #1d2740; color: #fff; font-size: 12px; line-height: 18px; padding: 7px 10px; border-radius: 8px; white-space: pre; opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.tip.show { opacity: 1; transform: none; }
.mini { font-size: 12px; color: var(--muted); }
.low-tag { display: inline-block; margin-left: 4px; font-size: 11px; color: var(--pill-mid-ink); background: var(--pill-mid-bg); border-radius: 4px; padding: 0 5px; line-height: 17px; vertical-align: 1px; font-weight: 500; }
.dash-tbl td { vertical-align: middle; }
.dash-tbl .meter { display: inline-grid; grid-template-columns: 90px 40px; }
.dash-tbl .meter .dash { display: none; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.toggle input { width: 15px; height: 15px; accent-color: var(--tool); }
/* 데이터 관리: 데이터가 들어온 날 달력, 저장 공간 막대 */
.cov { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; max-width: 360px; }
.cov span { height: 26px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; color: var(--faint); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.cov span.on { background: var(--tool-hl); color: var(--accent-ink); box-shadow: none; font-weight: 600; }
.cov span.fut { opacity: .35; }
.cov .h { background: none; box-shadow: none; height: 16px; }
.use-bar { height: 8px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; }
.use-bar i { display: block; height: 100%; background: var(--tool); }
.use-bar.warn i { background: var(--negative); }
.rule-grid { display: grid; gap: 8px; }
.rule { display: grid; grid-template-columns: 20px minmax(0, 1fr) 84px; align-items: center; gap: 10px; background: var(--surface); border-radius: 10px; padding: 8px 12px; }
.rule input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--tool); }
.rule .input { width: 100%; text-align: right; }
.imp-list { max-height: 230px; overflow: auto; display: grid; gap: 4px; padding: 8px; background: var(--raised); border-radius: 10px; }
.imp-p { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px; align-items: center; font-size: 13px; }
.imp-p .input { width: 100%; height: 28px; font-size: 13px; }
.ok-line { color: var(--accent-ink); font-weight: 600; }
.warn-line { color: #8a5a00; }
.res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.res div { background: var(--raised); border-radius: 10px; padding: 10px 12px; }
.res span { display: block; font-size: 12px; color: var(--muted); }
.res b { font-size: 20px; font-weight: 700; }
.pr-flag { margin: 0 0 3mm; padding: 1.5mm 2.5mm; border: 0.3mm solid #e0b45a; border-radius: 1.5mm; font-size: 9pt; background: #fff8e8; break-inside: avoid; }
.pr-flag b { margin-right: 2mm; }
@media (max-width: 720px) {
  .hb-row { grid-template-columns: 88px minmax(0, 1fr); }
  .axis-note { margin-left: 100px; }
  .imp-p { grid-template-columns: 1fr; }
  .res { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rule { grid-template-columns: 20px minmax(0, 1fr) 70px; }
}
</style>

<script>
'use strict';
/* ================= data model =================
   한 회차 일지 = 지난 과제 확인 + 오늘 지도 메모 + 다음 과제·지도 계획 (+ 선택: 매쓰홀릭 학습 결과).
   수업 후 한 번에 쓰고, '다음 과제·지도 계획'은 다음 수업 일지 맨 위로 이어진다. */
const KEY = 'hakseup-ilji-v1';

const level = (g) => g.startsWith('초') ? '초등' : g.startsWith('중') ? '중등' : '고등';
const WD = '일월화수목금토';
const HW_STATES = ['완료', '일부 완료', '미완료'];
const UNITS = {
  '초4-2': ['분수의 덧셈과 뺄셈','삼각형','소수의 덧셈과 뺄셈','사각형','꺾은선그래프','다각형'],
  '초5-2': ['수의 범위와 어림하기','분수의 곱셈','합동과 대칭','소수의 곱셈','직육면체','평균과 가능성'],
  '초6-2': ['분수의 나눗셈','소수의 나눗셈','공간과 입체','비례식과 비례배분','원의 넓이','원기둥, 원뿔, 구'],
  '중1-2': ['기본 도형','작도와 합동','다각형','원과 부채꼴','다면체와 회전체','입체도형의 겉넓이와 부피','자료의 정리와 해석'],
  '중2-2': ['삼각형의 성질','사각형의 성질','도형의 닮음','피타고라스 정리','경우의 수','확률'],
  '중3-2': ['삼각비','원과 직선','원주각','대푯값과 산포도','상관관계'],
  '공통수학1': ['다항식의 연산','나머지정리','인수분해','복소수','이차방정식','이차방정식과 이차함수','여러 가지 방정식','여러 가지 부등식','경우의 수','행렬'],
  '공통수학2': ['평면좌표','직선의 방정식','원의 방정식','도형의 이동','집합','명제','함수','유리함수와 무리함수'],
  '대수': ['지수','로그','지수함수와 로그함수','삼각함수','사인법칙과 코사인법칙','등차수열과 등비수열','수열의 합','수학적 귀납법'],

const hwPill = (s) => (s === '완료' ? '<span class="pill pos">완료</span>' : s === '일부 완료' ? '<span class="pill mid">일부</span>' : s === '미완료' ? '<span class="pill neg">미완료</span>' : '<span class="dash">—</span>');
function scoreSum(ls) { let t = 0, c = 0, n = 0; ls.forEach((l) => { if (rateOf(l.mh) !== null) { t += +l.mh.total; c += +l.mh.correct; n++; } }); return { t, c, n }; }
function studentOrder() {
  const order = (s) => [db.classes.findIndex((c) => c.id === s.classId), GRADES.indexOf(s.grade)];
  return [...db.students].sort((a, b) => { const x = order(a), y = order(b); return x[0] - y[0] || x[1] - y[1] || a.name.localeCompare(b.name, 'ko'); });
}
function tint(id) { const i = db.students.findIndex((s) => s.id === id); const h = (i * 67 + 95) % 360; return `background:hsl(${h} 42% 91%);color:hsl(${h} 38% 27%)`; }
const avatar = (st) => `<span class="avatar" style="${tint(st.id)}" aria-hidden="true">${esc(st.name.slice(-2, -1) || st.name[0])}</span>`;
function slipping(st) {
  const ls = logsOf(st.id).filter((l) => l.hw.status).slice(-3);
  const miss = ls.filter((l) => l.hw.status === '미완료');
  return { of: ls.length, miss: miss.length, last: miss[miss.length - 1] };
}

  if (name === 'students') return renderStudents();

// mode: week | month | custom(기간 직접 설정). tab: days(날짜별 기록) | summary(학생별 요약) | group(반별·학년별) | rate(학생별 정답률). by: 반별(cls) | 학년별(grade)

/* 정답률과 오답 재학습 정답률.

function exportCsv(scope = rep.scope) {
  const [s, e] = rangeOf(); const sh = sheets(scope === rep.scope ? targetList() : repList(scope), s, e);
  const cell = (v) => { const t = String(v ?? ''); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const body = Object.entries(sh).map(([name, rows]) => `[${name}]\r\n` + rows.map((r) => r.map(cell).join(',')).join('\r\n')).join('\r\n\r\n');

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* 오답 재학습 정답률 = 다시풀기·오답유사 학습의 정답률. 엑셀에서 불러온 결과의 학습별 점수('다시풀기 5/8 · 오답유사 4/6')로 센다 */
function fixOf(m) {
  if (!m) return null;
  let n = 0, c = 0;
  if (m.byType) RELEARN.forEach((t) => { const x = m.byType[t]; if (x) { n += x[1]; c += x[2]; } });
  else if (m.src === 'excel' && hasText(m.units)) for (const x of m.units.matchAll(/(?:다시풀기|오답유사)\s+(\d+)\/(\d+)/g)) { c += +x[1]; n += +x[2]; }
  return n ? { c, n, p: Math.round((c / n) * 100) } : null;
}
const weakOf = (m) => (!m ? [] : m.weakList || (hasText(m.weak) ? m.weak.split(/,\s*(?=\d+(?:\.\d+)+\s)/) : []));
/* 미해결은 두 종류: 매쓰홀릭 교재('3.2.1 선대칭도형'처럼 단원 번호)와 쌍둥이 문제('[디딤돌 …] 초등 5-2 (2022개정)P.58-81 오답유사 학습'처럼 시중 교재 쪽수) */
const isTwin = (u) => /^\[|P\.\s*\d/.test(u);
// '[디딤돌 초등수학 응용] 초등 5-2 (2022개정)P.58-81 오답유사 학습' → '디딤돌 초등수학 응용 5-2 P.58-81'
const shortTwin = (u) => u.replace(/[[\]]/g, ' ').replace(/\(\d{4}\s*개정\)/g, ' ').replace(/오답\s*유사\s*(학습)?\s*$/, '').replace(/\s(초등|중등|고등)\s+(?=\d-\d)/, ' ').replace(/\s*(P\.)/, ' $1').replace(/\s+/g, ' ').trim();
const rateCls = (p) => (p === null ? '' : p >= 80 ? 'hi' : p < 60 ? 'lo' : '');

/* ---------- 기간 비교·출석: 인쇄·학부모용·AI 총평이 같은 계산을 쓴다 ---------- */
// 바로 앞 같은 길이의 기간 (월간이면 지난달)
function prevRange() {
  const [s, e] = rangeOf();
  if (rep.mode === 'month') { const d = parse(s); return [ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)), addDays(s, -1), '지난달']; }
  const n = Math.round((parse(e) - parse(s)) / 864e5) + 1;
  return [addDays(s, -n), addDays(s, -1), rep.mode === 'week' ? '지난주' : '직전 기간'];
}
const delta = (a, b) => (a === null || b === null ? '' : a > b ? `▲${a - b}%p` : a < b ? `▼${b - a}%p` : '변화 없음');
// 학생 한 명의 기간 묶음. rg = { s, e, ps, pe, pl } (기간 인쇄일 때만; 하루 인쇄는 null)
function packOf(st, ls, rg) {
  ls = [...ls].sort((a, b) => (a.date < b.date ? -1 : 1));
  const seen = {};
  ls.forEach((l) => weakOf(l.mh).forEach((u) => (seen[u] = seen[u] || []).push(l.date)));
  const repeat = Object.entries(seen).filter(([, ds]) => ds.length >= 2).sort((a, b) => b[1].length - a[1].length);
  const p = { st, ls, seen, repeat, rs: rateStats(ls), hs: hwStats(ls), need: 0, prev: null, pl: '' };
  if (rg) {
    for (let d = rg.s; d <= rg.e && d <= TODAY; d = addDays(d, 1)) if (scheduled(st, d)) p.need++;
    const pls = logsOf(st.id).filter((l) => l.date >= rg.ps && l.date <= rg.pe);
    if (pls.length) { p.prev = rateStats(pls); p.pl = rg.pl; }
  }
  return p;
}
function groupLogs(logs) {
  const order = studentOrder().map((s) => s.id), bySt = {};
  logs.forEach((l) => (bySt[l.sid] = bySt[l.sid] || []).push(l));
  return Object.keys(bySt).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map((sid) => [stu(sid), bySt[sid]]);
}
// 요약 카드: 수업(예정 대비), 평균 정답률·오답 재학습 정답률(직전 기간 대비), 과제
function sumCards(p) {
  const { rs, hs, prev } = p, vs = (v, pv) => (prev && v !== null && pv !== null ? `<small class="dl">${p.pl} ${pv}% → ${delta(v, pv)}</small>` : '');
  return `<div class="pr-sum">
      <div class="k"><span>수업</span><b>${p.ls.length}회</b>${p.need ? `<small>예정 ${p.need}회</small>` : ''}</div>
      ${rs.rate !== null ? `<div class="k"><span>평균 정답률</span><b class="pc ${rateCls(rs.rate)}">${rs.rate}%</b><small>${nf.format(rs.c)}/${nf.format(rs.t)}문항</small>${vs(rs.rate, prev?.rate)}</div>` : ''}
      ${rs.fix !== null ? `<div class="k"><span>오답 재학습 정답률</span><b class="pc ${rateCls(rs.fix)}">${rs.fix}%</b><small>다시풀기·오답유사 ${nf.format(rs.fc)}/${nf.format(rs.fn)}</small>${vs(rs.fix, prev?.fix)}</div>` : ''}
      ${hs.n ? `<div class="k"><span>과제 완료</span><b>${hs.done}/${hs.n}</b><small>일부 ${hs.part} · 미완료 ${hs.miss}</small></div>` : ''}
    </div>`;
}
const prHead = (title, sub) => `<header class="pr-head"><div class="t">${esc(db.academy.name)} <em>${sub}</em></div><div class="r">${db.academy.logo ? `<img src="${db.academy.logo}" alt="">` : ''}${esc(title)}</div></header>`;
const RATE_NOTE = '정답률 = 맞힌 문항 ÷ 푼 문항(동영상 시청·개념 익히기 제외, 매쓰홀릭 사용현황과 같은 기준) · 오답 재학습 정답률 = 다시풀기·오답유사학습의 정답률';
function showPrint(body) {

/* ---------- print: 학생별로 기간 요약 → 반복 미해결 → 날짜순 기록 → 총평란. 빈 항목은 '—' 한 글자로만 ---------- */
function printLogs(logs, title, rg = null) {
  logs = logs.filter(hasContent);
  if (!logs.length) return toast('인쇄할 기록이 없습니다');
  const none = '<span class="none">—</span>';
  const body = groupLogs(logs).map(([st, sl]) => {
    const pk = packOf(st, sl, rg), { ls, seen } = pk;
    const withMh = ls.some((l) => l.mh);
    // 기록이 하나도 없는 칸은 접어서 남은 칸에 자리를 준다 (메모를 하나도 안 쓴 기간이면 메모 칸도 뺀다)
    const withHw = ls.some((l) => l.hw.status || hasText(l.hw.text));
    const withMemo = ls.some((l) => hasText(l.memo) || l.legacy) || !withMh;
    const withNext = ls.some((l) => hasText(l.next.hw) || hasText(l.next.check));
    const rows = ls.map((l) => {
      const hw = l.hw.status || hasText(l.hw.text) ? `${esc(l.hw.status || '확인 안 함')}${hasText(l.hw.text) ? `\n<span class="s">${esc(l.hw.text)}</span>` : ''}` : none;
      const next = [hasText(l.next.hw) ? `과제: ${esc(l.next.hw)}` : '', hasText(l.next.check) ? `확인: ${esc(l.next.check)}` : ''].filter(Boolean).join('\n') || none;
      const legacy = l.legacy && !hasText(l.memo) ? legacyRows(l).slice(0, 3).map(([k, v]) => `${k}: ${v}`).join('\n') : '';
      const m = l.mh, p = rateOf(m), fx = fixOf(m), wk = weakOf(m);
      const tag = (u) => (seen[u]?.length >= 2 ? `<span class="rp">${esc(u)}(반복)</span>` : esc(u));
      const label = m?.src === 'excel' ? '미해결' : '취약';
      const book = wk.filter((u) => !isTwin(u)), twin = wk.filter(isTwin);
      const mh = !withMh ? '' : `<td class="mhc">${m ? [
        p !== null ? `<div><b class="pc ${rateCls(p)}">정답률 ${p}%</b> <span class="s">정답 ${esc(m.correct)} / ${esc(m.total)}문항</span></div>` : '',
        fx ? `<div>오답 재학습 정답률 <b class="pc ${rateCls(fx.p)}">${fx.p}%</b> <span class="s">다시풀기·오답유사 ${fx.c}/${fx.n}</span></div>` : '',
        book.length ? `<div class="s"><i>${m.src === 'excel' ? '매쓰홀릭 교재 오답 미해결' : label}</i> ${book.map(tag).join(', ')}</div>` : '',
        twin.length ? `<div class="s"><i>쌍둥이 문제 미해결</i> ${twin.map((u) => (seen[u]?.length >= 2 ? `<span class="rp">${esc(shortTwin(u))}(반복)</span>` : esc(shortTwin(u)))).join(', ')}</div>` : '',
        // 학습지·교재채점은 이름까지 적어야 어떤 학습인지, 같은 학습이 두 번 들어갔는지 알 수 있다
        ...(m.others || []).map((o) => `<div class="s">${esc(o.type)}${hasText(o.title) && o.title !== o.type ? ` <span class="ot">${esc(o.title)}</span>` : ''} ${o.c}/${o.n}${o.n ? ` (${Math.round((o.c / o.n) * 100)}%)` : ''}</div>`),
      ].filter(Boolean).join('') || none : none}</td>`;
      return `<tr><td class="d">${esc(dot(l.date))} (${WD[dow(l.date)]})</td>${withHw ? `<td>${hw}</td>` : ''}${withMemo ? `<td>${hasText(l.memo) ? esc(l.memo) : legacy ? `<span class="s">${esc(legacy)}</span>` : ''}</td>` : ''}${withNext ? `<td>${next}</td>` : ''}${mh}</tr>`;
    }).join('');
    const cols = '<col style="width:19mm">' + (withHw ? '<col style="width:24mm">' : '') + (withMemo ? '<col>' : '') + (withNext ? '<col style="width:36mm">' : '') + (withMh ? (withMemo ? '<col style="width:64mm">' : '<col>') : '');
    // 기간 요약: 정답률은 문항 합계로, 오답 재학습 정답률은 다시풀기·오답유사 문항 합계로
    const sum = !withMh && !pk.hs.n ? '' : sumCards(pk);
    // 기간 인쇄: 보고서와 같은 기준의 '추가 지도 검토' 신호
    const jf = rg && withMh ? judge(Object.values(db.logs).filter((l) => l.sid === st.id), rg.s, rg.e, rg.ps, rg.pe, dataEnd()).flags : [];
    const flagBox = jf.length ? `<div class="pr-flag"><b>추가 지도 검토</b>${jf.map((f) => `${esc(f.t)} (${esc(f.d)})`).join(' · ')}</div>` : '';
    // 보완할 단원(매쓰홀릭 교재 / 쌍둥이 문제로 나눠서) / 다시 풀어 해결한 단원. 모든 항목에 몇 번·언제 미해결이었는지
    const byCount = (a, b) => b[1].length - a[1].length;

      </div>`;
    // 학생 1명 = 1장: 학생마다 새 쪽에서 시작하고 머리말을 다시 붙인다
    return `<section class="pr-st">${prHead(title, '학습노트')}
      <h2>${esc(st.name)}<span>${esc(st.grade)} · ${esc(cls(st.classId)?.name || '반 없음')} · ${esc(st.course)} · ${ls.length}회</span></h2>
      ${sum}${flagBox}${units}
      <table>${cols}<thead><tr><th>날짜</th>${withHw ? '<th>과제 수행</th>' : ''}${withMemo ? '<th>수업 특이사항</th>' : ''}${withNext ? '<th>다음 과제·지도사항</th>' : ''}${withMh ? '<th>학습 결과</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>
      ${withMh ? `<div class="pr-foot"><div class="note">${RATE_NOTE} · 교재 채점은 정답률에 넣지 않고 따로 표시</div></div>` : ''}</section>`;
  }).join('');
  showPrint(body);
}

function lineChart(bs, series, H = 200) {
  const W = 760, L = 36, R = 12, T = 12, B = 26, n = bs.length;

  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (n - 1)), y = (v) => T + (1 - (v * 100 - lo) / (100 - lo)) * (H - T - B);
  const grid = []; for (let g = lo; g <= 100; g += lo >= 50 ? 10 : 20) grid.push(`<line class="gl" x1="${L}" x2="${W - R}" y1="${y(g / 100)}" y2="${y(g / 100)}"/><text x="${L - 6}" y="${y(g / 100) + 4}" text-anchor="end">${g}%</text>`);

  const lines = series.map((sr) => {

    bs.forEach((b, i) => { const v = b.a[sr.key]; if (v === null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`; pen = true; dots.push(`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${sr.color}" stroke="#fff" stroke-width="2"/>`); });

  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="주별 정답률 변화">${grid.join('')}${xl}${lines}${hits}</svg>`;
}

// 날짜별 학습 데이터: 학생 × 날짜 한 줄 (매쓰홀릭 결과 + 선생님 기록)
function exportDaily() {
  const head = ['날짜', '학생', '학년', '반', '매쓰홀릭 아이디', '푼 문항', '맞힌 문항', '정답률', '재학습 푼 문항', '재학습 맞힌 문항', '오답 재학습 정답률', '동영상 시청', '학습유형별', '미해결', '지난 과제', '과제 수행', '수업 특이사항', '다음 과제', '다음 수업 지도사항', '모바일 보고서'];
  const order = studentOrder().map((s) => s.id);
  const ls = Object.values(db.logs).filter((l) => hasContent(l) && stu(l.sid)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : order.indexOf(a.sid) - order.indexOf(b.sid)));
  if (!ls.length) return toast('내보낼 기록이 없습니다');
  const rows = [head, ...ls.map((l) => { const st = stu(l.sid), m = l.mh || {}, x = statOf(l.mh), r = (a, b) => (b ? Math.round((a / b) * 1000) / 1000 : '');
    return [l.date, st.name, st.grade, cls(st.classId)?.name || '', st.mhId || '', x.n || '', x.n ? x.c : '', r(x.c, x.n), x.rn || '', x.rn ? x.rc : '', r(x.rc, x.rn), m.video || '', m.units || '', m.weak || '', l.hw.text, l.hw.status, l.memo, l.next.hw, l.next.check, m.link || (l.mh ? st.mhLink || '' : '')];
  })];
  const name = `학습노트_날짜별_${ls[0].date}_${ls[ls.length - 1].date}`;
  if (!window.XLSX) { download(new Blob(['﻿' + rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), name + '.csv'); return toast('CSV로 받았습니다'); }
  const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows);
  head.forEach((h, i) => { if (/율$/.test(h)) for (let k = 2; k <= rows.length; k++) { const c = ws[XLSX.utils.encode_col(i) + k]; if (c && c.t === 'n') c.z = '0%'; } });
  ws['!cols'] = head.map((h) => ({ wch: /특이|지도|과제|유형별|미해결/.test(h) ? 30 : Math.max(9, h.length * 2) }));
  XLSX.utils.book_append_sheet(wb, ws, '날짜별 기록');
  XLSX.writeFile(wb, name + '.xlsx', { compression: true });
  toast(`${nf.format(ls.length)}줄을 내려받았습니다`);
}

});
document.addEventListener('change', (ev) => {
  const k = ev.target.dataset.change; if (!k) return;
  if (k === 'today-date' && ev.target.value) location.hash = '#today/' + ev.target.value;
  else if (k === 'st-cls') { stFilter.cls = ev.target.value; drawStudentTable(); }
  else if (k === 'td-cls') { tdFilter.cls = ev.target.value; drawToday(); }
  else if (k === 'td-memo') { tdFilter.memo = ev.target.checked; drawToday(); }
  else if (k === 'alert-on') { db.settings.alert[ev.target.dataset.k].on = ev.target.checked; persist(); toast('기준을 저장했습니다'); }
  else if (k === 'alert-v') { const v = Math.max(0, Math.round(+ev.target.value || 0)); db.settings.alert[ev.target.dataset.k].v = v; ev.target.value = v; persist(); toast('기준을 저장했습니다'); }
  else if (k === 'alert-min') { db.settings.alert.minN = Math.max(1, Math.round(+ev.target.value || 1)); ev.target.value = db.settings.alert.minN; persist(); toast('기준을 저장했습니다'); }
  else if (k === 'scope') { rep.scope = ev.target.value; renderReports(); }
  else if (k === 'rep-sel') { const id = ev.target.dataset.id; if (ev.target.checked) rep.sel.add(id); else rep.sel.delete(id); drawReportsBody(); }
  else if (k === 'rep-sel-all') { const list = repList(); if (ev.target.checked) list.forEach((s) => rep.sel.add(s.id)); else list.forEach((s) => rep.sel.delete(s.id)); drawReportsBody(); }
  else if ((k === 'rep-from' || k === 'rep-to') && ev.target.value) { rep[k === 'rep-from' ? 'from' : 'to'] = ev.target.value; drawReportsBody(); }
  else if (k === 'academy-name') { db.academy.name = ev.target.value.trim() || '우리 학원'; persist(); renderNav('settings'); toast('저장했습니다'); }
  else if (k === 'logo') { const f = ev.target.files[0]; if (!f) return; if (f.size > 400000) return toast('로고는 400KB 이하 이미지로 올려 주세요'); const r = new FileReader(); r.onload = () => { db.academy.logo = r.result; persist(); renderSettings(); }; r.readAsDataURL(f); }
  else if (k === 'mh-import') { const f = ev.target.files[0]; ev.target.value = ''; if (f) importExcel(f); }
  else if (k === 'restore') { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.students || !d.logs) throw 0; if (confirm(`백업의 학생 ${d.students.length}명, 일지 ${Object.keys(d.logs).length}건으로 지금 기록을 바꿀까요?`)) { for (const key of Object.keys(d.logs)) d.logs[key] = migrate(d.logs[key]); d.v = 3; db = d; ensureDb(); persist(); route(); toast('복원했습니다'); } } catch (e) { toast('학습노트 백업 파일이 아닙니다'); } }; r.readAsText(f); }
});

/* ---------- 매쓰홀릭 엑셀 가져오기: 버튼으로 고르거나 화면에 끌어다 놓기 ---------- */
// 안내 창마다 실제로 읽은 파일을 적어, 다른 파일이 골라졌는지 바로 알 수 있게 한다
const fileInfo = (f) => `읽은 파일: ${f.name} (${Math.max(1, Math.round(f.size / 1024))}KB · ${new Date(f.lastModified).toLocaleString('ko-KR')})`;
function importExcel(f) {
  if (!window.XLSX) return toast('엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
  f.arrayBuffer().then((buf) => {
    // 엑셀 파일은 PK(.xlsx) 또는 D0 CF(.xls)로 시작한다. 아니면 보안 프로그램(DRM)이 잠근 파일이거나 다른 형식이다
    const b = new Uint8Array(buf.slice(0, 2));
    if (!((b[0] === 0x50 && b[1] === 0x4b) || (b[0] === 0xd0 && b[1] === 0xcf))) return alert(`엑셀 파일로 읽을 수 없습니다.\n\n회사·학원 보안 프로그램(DRM)이 파일을 잠갔거나, 엑셀이 아닌 파일일 수 있어요.\n매쓰홀릭에서 엑셀을 다시 받아 열지 않은 채로 바로 올려 보세요.\n\n${fileInfo(f)}`);
    const wb = XLSX.read(buf, { type: 'array' });
    const parsed = readMatholic(wb);
    // 학습노트에서 내려받은 엑셀(첫 시트 '학생별 요약')을 잘못 올린 경우
    if (!parsed.rows.length && !parsed.roster.length && wb.SheetNames.includes('학생별 요약')) return alert(`학습노트에서 내려받은 엑셀이 골라졌어요.\n\n여기에는 매쓰홀릭에서 받은 '매쓰홀릭_학습_이력' 엑셀을 올려 주세요.\n매쓰홀릭 [학습현황]에서 날짜 칸에 기간을 지정하고 학생을 고른 뒤 [학습 이력 n명]을 누르면 받아집니다.\n\n${fileInfo(f)}`);
    if (!parsed.rows.length && !parsed.roster.length) return alert(`매쓰홀릭 학습 이력 엑셀에서 학생을 찾지 못했습니다.\n\n매쓰홀릭 학습현황에서 받은 '학습 이력' 엑셀인지 확인해 주세요. (? 버튼: 엑셀 받는 곳 보기)\n\n${fileInfo(f)}\n읽은 시트와 첫 줄:\n${parsed.sheets.join('\n')}`);
    openImport(parsed, f.name);
  }).catch((e) => alert(`엑셀 파일을 읽지 못했습니다.\n암호가 걸려 있거나 보안 프로그램으로 잠긴 파일일 수 있어요.\n\n${fileInfo(f)}\n(${e && e.message ? e.message : e})`));
}
// 차트 말풍선: data-tip이 있는 막대·점 위에 마우스를 올리면 숫자를 보여 준다
const tipEl = document.getElementById('tip');
document.addEventListener('mouseover', (e) => { const t = e.target.closest?.('[data-tip]'); if (!t) { tipEl.classList.remove('show'); return; } tipEl.textContent = t.dataset.tip; tipEl.classList.add('show'); });
document.addEventListener('mousemove', (e) => { if (!tipEl.classList.contains('show')) return; const w = tipEl.offsetWidth, h = tipEl.offsetHeight; tipEl.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px'; tipEl.style.top = (e.clientY - h - 12 < 8 ? e.clientY + 18 : e.clientY - h - 12) + 'px'; });
const isFileDrag = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragover', (e) => { if (isFileDrag(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
window.addEventListener('drop', (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  const f = [...e.dataTransfer.files].find((x) => /\.xlsx?$/i.test(x.name));
  if (f) importExcel(f); else toast('매쓰홀릭 엑셀(.xlsx) 파일을 끌어다 놓아 주세요');
});

route();
</script>
</body>
</html>
