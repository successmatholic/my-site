<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습일지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Style: framed sheet. The chrome is tinted from the paper form's green; the work sits on a white sheet.
   Grid: canvas = 100vw - 232 sidebar - 8 sheet inset - 2 border - 2 x 28 padding; 12 columns, one 16px gutter. */
:root {
  --ground: #ebebee; --surface: #ffffff; --raised: #f5f5f7; --active: #e8e8ed;
  --border: #e5e5ea; --rule: #efeff2; --control: #d1d1d6;
  --text: #1d1d1f; --muted: #6e6e73; --faint: #77777c;
  --accent: #5a9a2c;      /* the paper form's green, on data: a written log */
  --accent-ink: #3a6b17;  /* the same green as text, 4.5:1 on white */
  --tint: #d6e8c6;        /* half a log written */
  --primary: #007aff; --primary-ink: #ffffff;
  --positive: #3a6b17; --negative: #b8262b;
  --pill-positive-bg: #e2f1d6; --pill-positive-ink: #1f3d0b;
  --pill-negative-bg: #ffecea; --pill-negative-ink: #831c1e;
  --pill-neutral-bg: #f0f0f3; --pill-neutral-ink: #3a3a3c;
  --pill-mid-bg: #f6efd9; --pill-mid-ink: #5c4708;
  --paper: #7ab648;       /* print only: the form as the academy prints it */
  --font: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
  --fs-title: 26px; --fs-section: 16px; --fs-kpi: 24px; --fs-body: 14px; --fs-small: 12px;
  --sidebar: 236px; --gap: 16px; --pad: 32px; --card-pad: 20px;
  --r-sheet: 12px; --r-card: 10px; --r-control: 7px; --control-h: 30px;
  --blue: #007aff; --blue-hover: #0068dc;
  --ring: 0 0 0 3.5px rgba(0, 122, 255, .3);
  --shadow-ctl: 0 0 0 .5px rgba(0, 0, 0, .1), 0 .5px 1.5px rgba(0, 0, 0, .1);
  --shadow-card: 0 0 0 .5px rgba(0, 0, 0, .08), 0 1px 3px rgba(0, 0, 0, .04);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: var(--fs-body)/20px var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px; }
.mark { width: 28px; height: 28px; flex: none; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.scope { margin: 4px 8px 14px 46px; color: var(--muted); font-size: var(--fs-small); line-height: 16px; }
.group-label { margin: 18px 8px 6px; font-size: var(--fs-small); color: var(--faint); }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); transition: background-color .15s ease, color .15s ease; }
.nav-item svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--raised); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--active); color: var(--text); }
.nav-item .count { margin-left: auto; font-size: var(--fs-small); color: var(--muted); }
.sidebar .bottom { margin-top: auto; padding: 12px 10px 4px; color: var(--faint); font-size: var(--fs-small); line-height: 17px; }
.sheet { margin: 8px 8px 8px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sheet); min-width: 0; padding: 24px var(--pad) 40px; min-height: calc(100vh - 16px); }
.topbar { display: none; }

/* ---------- title row ---------- */
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.title-row h1 { font-size: var(--fs-title); line-height: 30px; font-weight: 700; letter-spacing: -0.02em; }
.title-row .sub { margin-top: 4px; color: var(--muted); font-size: 15px; }
.title-row .sub strong { color: var(--text); font-weight: 600; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.back { display: inline-block; margin-bottom: 6px; color: var(--muted); }
.back:hover { color: var(--text); }
.stamp { color: var(--faint); font-size: var(--fs-small); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-h); padding: 0 14px; border-radius: var(--r-control); border: 1px solid var(--control); background: var(--surface); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color .15s ease, transform .12s var(--ease-out); }
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn.primary:hover { background: #33362f; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--raised); }
.btn.sm { height: 30px; padding: 0 10px; }
.btn.danger { color: var(--negative); }
.btn[disabled] { color: var(--faint); cursor: not-allowed; }
.icon-btn { width: var(--control-h); padding: 0; }
.input, select.input { height: var(--control-h); padding: 0 10px; border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); min-width: 0; }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; line-height: 22px; resize: vertical; width: 100%; }
.input::placeholder, textarea::placeholder { color: var(--faint); }
.segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--raised); }
.segmented button { height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: background-color .15s ease, color .15s ease; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper .label { min-width: 150px; text-align: center; font-weight: 600; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: var(--gap); }
.filters .spacer { flex: 1; }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tabs button { position: relative; padding: 10px 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); }

/* ---------- panels ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
.stack { display: grid; gap: var(--gap); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--card-pad); min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel h2 { font-size: var(--fs-section); line-height: 22px; font-weight: 600; }
.panel .meta { color: var(--faint); font-size: var(--fs-small); }
.panel .lede { color: var(--muted); margin: -6px 0 12px; }
.card-link { color: var(--text); font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; }
.card-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* KPIs: one divided strip */
.kpis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--gap); }
.kpi { padding: 14px var(--card-pad); }
.kpi + .kpi { border-left: 1px solid var(--border); }
.kpi-label { color: var(--muted); }
.kpi-value { margin-top: 4px; font-size: var(--fs-kpi); line-height: 30px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 2px; }
.kpi .note { margin-top: 2px; font-size: var(--fs-small); color: var(--muted); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { height: 36px; padding: 0 10px; text-align: left; font-weight: 400; font-size: var(--fs-small); color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th.n, td.n { text-align: right; }
th.c, td.c { text-align: center; }
td .sub { display: block; font-size: var(--fs-small); color: var(--muted); line-height: 17px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raised); }
tr.group td { padding: 18px 0 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
tr.group td .sub { display: inline; margin-left: 8px; font-weight: 400; }
tr.group:first-child td { padding-top: 6px; }
.truncate { display: block; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash { color: var(--faint); }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.who b { font-weight: 600; }
.who b, .who .sub { white-space: nowrap; }
.who .sub { margin-top: 1px; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-small); font-weight: 500; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); white-space: nowrap; flex: none; }
.pill.pos { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.pill.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }

/* a written half of the log: filled green dot; unwritten: dashed ring */
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1.5px dashed var(--control); }
.dot.on { background: var(--accent); border: 0; }
.st.on { color: var(--text); }
.m-only { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 720px) { .m-only { display: inline; } }

.ox { display: inline-flex; gap: 2px; padding: 2px; background: var(--raised); border-radius: 8px; }
.ox button { width: 32px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
.ox button[aria-pressed="true"][data-v="o"] { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.ox button[aria-pressed="true"][data-v="x"] { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.oxsum { white-space: nowrap; }
.oxsum .o { color: var(--positive); font-weight: 600; }
.oxsum .x { color: var(--negative); font-weight: 600; }

/* lists */
.rows { display: grid; grid-template-columns: minmax(0, 1fr); }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--rule); }
.row .grow { flex: 1; min-width: 0; }
.row .fig { text-align: right; white-space: nowrap; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); }
.empty { padding: 14px 16px; border: 1px dashed var(--control); border-radius: var(--r-control); color: var(--muted); }

/* ---------- editor: one screen, three short items ---------- */
.log-form { display: grid; gap: 0; }
.fsec { padding: 18px 0 20px; }
.fsec + .fsec { border-top: 1px solid var(--rule); }
.fsec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.fsec h2 { font-size: var(--fs-section); font-weight: 600; line-height: 22px; }
.fsec .hint { color: var(--faint); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lbl { display: grid; gap: 6px; }
.lbl > span { font-weight: 500; font-size: 13px; color: var(--muted); }
.lbl .input { width: 100%; }
textarea.memo { min-height: 64px; }
/* last lesson's plan, read-only, at the top */
.carry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 14px 16px; margin-bottom: 4px; background: var(--raised); border-radius: var(--r-card); font-size: 14px; }
.carry .when { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
.carry dt { color: var(--muted); white-space: nowrap; }
.carry dd { margin: 0; }
.hw-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hw-row .input { flex: 1 1 260px; }
.hwseg button[aria-pressed="true"][data-v="완료"] { background: var(--pill-positive-bg); color: var(--pill-positive-ink); box-shadow: none; }
.hwseg button[aria-pressed="true"][data-v="일부 완료"] { background: var(--pill-mid-bg); color: var(--pill-mid-ink); box-shadow: none; }
.hwseg button[aria-pressed="true"][data-v="미완료"] { background: var(--pill-negative-bg); color: var(--pill-negative-ink); box-shadow: none; }
.pill.mid { background: var(--pill-mid-bg); color: var(--pill-mid-ink); }
/* the Matholic result: extracted, so it reads apart from what the teacher wrote */
.mh { border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 16px; background: var(--surface); }
.mh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.mh-head b { font-weight: 600; }
.mh-head .src { color: var(--faint); font-size: 12px; margin-left: 8px; font-weight: 400; }
.mh-sum { display: grid; gap: 6px; font-size: 14px; }
.mh-sum .big { font-size: 18px; font-weight: 600; }
.mh-sum .k { color: var(--muted); margin-right: 6px; }
.mh-sum .quote { margin-top: 4px; padding: 10px 12px; background: var(--raised); border-radius: var(--r-control); color: var(--muted); font-size: 13px; line-height: 20px; }
.mh-edit { display: grid; gap: 10px; margin-top: 12px; }
.mh-edit .nums { display: grid; grid-template-columns: 120px 120px; gap: 10px; }
.paste textarea { min-height: 52px; height: 52px; border-style: dashed; background: var(--raised); resize: none; }
.paste textarea:focus { background: var(--surface); border-style: solid; }
.paste-msg { margin-top: 6px; font-size: 13px; color: var(--muted); }
.paste-msg:empty { display: none; }
.paste-msg.warn { color: var(--negative); }
/* 매쓰홀릭 결과 카드: 점수 → 학습 단계 → 미해결/해결 단원 → 출처 순으로 읽힌다 */
.mh-sum { gap: 14px; }
.mh-score { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.mh-score .big { font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em; }
.mh-score .big small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.mh-score .rate { color: var(--muted); }
.mh-score .rate b { color: var(--text); font-size: 18px; font-weight: 600; margin-left: 4px; }
.mh-bar { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; margin-top: -6px; }
.mh-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.mh-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.mh-steps div { background: var(--raised); border-radius: var(--r-control); padding: 8px 12px; display: grid; gap: 2px; }
.mh-steps span { font-size: 12px; color: var(--muted); }
.mh-steps b { font-size: 16px; font-weight: 600; }
.mh-dl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 12px; margin: 0; align-items: start; }
.mh-dl dt { color: var(--muted); font-size: 13px; padding-top: 3px; display: flex; align-items: center; gap: 6px; }
.mh-dl dt .cnt { font-size: 12px; color: var(--text); font-weight: 600; }
.mh-dl dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 13px; line-height: 19px; }
.tag.neg { background: var(--pill-negative-bg); color: var(--pill-negative-ink); font-weight: 600; }
.tag.pos { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
/* 엑셀 올리기 옆 도움말, 처음 안내 화면 */
.imp-wrap { display: inline-flex; align-items: center; gap: 2px; }
.btn.help { color: var(--muted); width: 30px; padding: 0; }
.btn.help:hover { color: var(--text); }
.help-dlg { max-width: 640px; }
dialog:has(.help-dlg) { width: min(640px, calc(100vw - 32px)); }
.guide { display: grid; gap: 14px; }
.mock { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); padding: 10px 12px; display: grid; gap: 10px; font-size: 12px; color: var(--muted); }
.mock .m-top { display: flex; gap: 14px; justify-content: center; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.mock .m-bar { display: flex; align-items: center; gap: 10px; }
.mock .m-sp { flex: 1; }
.mock .m-range { color: var(--text); font-weight: 600; }
.mock .m-date { padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; }
.mock .m-btn { padding: 4px 10px; border: 1px solid var(--control); border-radius: 4px; color: var(--text); }
.mock .m-grid { display: grid; grid-template-columns: 1.4fr repeat(5, 1fr); gap: 6px; }
.mock .m-cell { padding: 4px 6px; background: var(--raised); border-radius: 4px; white-space: nowrap; }
.mock .hit { position: relative; color: var(--text); font-weight: 600; outline: 2px solid #2f6fe0; outline-offset: 2px; border-radius: 4px; }
.mock .hit i { position: absolute; top: -10px; right: -10px; width: 18px; height: 18px; border-radius: 50%; background: #2f6fe0; color: #fff; font: 600 11px/18px var(--font); text-align: center; font-style: normal; }
.steps { list-style: decimal; padding-left: 22px; display: grid; gap: 6px; line-height: 21px; }
.steps li::marker { color: #2f6fe0; font-weight: 700; }
/* 처음 안내 화면: 무엇을 해 주는지(큰 문장 + 실제 일지 한 장) → 쓰는 방법 → 엑셀 받는 곳 */
.wel { display: grid; gap: 28px; }
.wel-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 40px; align-items: center; padding: 40px; background: var(--raised); border-radius: var(--r-sheet); }
.wel-copy h1 { font-size: 30px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; }
.wel-lede { margin-top: 14px; font-size: 16px; line-height: 27px; color: var(--muted); max-width: 34em; }
.wel-lede strong { color: var(--text); font-weight: 650; }.wel-cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.wel-cta .btn { height: 40px; padding: 0 18px; font-size: 15px; }
.wel-note { margin-top: 14px; color: var(--faint); font-size: 13px; }
.wel-note .card-link { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.wel-shot { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; display: grid; gap: 12px; font-size: 14px; }
.ws-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.ws-head b { font-size: 17px; font-weight: 700; }
.ws-head span { color: var(--muted); font-size: 13px; }
.ws-carry { position: relative; background: var(--raised); border-radius: var(--r-card); padding: 18px 14px 10px; display: grid; gap: 3px; }
.ws-flag { position: absolute; top: -9px; left: 12px; background: var(--accent-ink); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 8px; border-radius: 999px; }
.ws-flag.alt { background: #2f6fe0; }
.wel-shot .k { display: inline-block; width: 74px; color: var(--muted); font-size: 13px; flex: none; }
.ws-row { display: flex; align-items: center; gap: 6px; }
.ws-text { min-width: 0; }

.wel-guide { display: grid; gap: 16px; padding: 28px; border: 1px solid var(--border); border-radius: var(--r-sheet); }

@media (max-width: 1100px) { .wel-hero { grid-template-columns: 1fr; padding: 28px; } .wel-steps { grid-template-columns: 1fr; } .wel-guide .guide { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .wel-hero { padding: 20px 16px; gap: 24px; } .wel-copy h1 { font-size: 24px; line-height: 32px; } .wel-shot { padding: 16px; } .wel-shot .k { width: 64px; } .wel-guide { padding: 18px 16px; } .ws-seg i { padding: 3px 7px; } }
.feat h2 { margin-bottom: 6px; }

.preview { margin-top: 12px; padding: 12px 14px; background: var(--raised); border-radius: var(--r-card); display: grid; gap: 8px; font-size: 13px; }

.pv-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 10px; }

.start h2 { margin-bottom: 4px; }

/* 주간·월간 기록: 기간 직접 설정, 정답률·해결률 막대 */
.range { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.meter { display: grid; grid-template-columns: minmax(60px, 120px) auto auto; align-items: center; gap: 8px; }

.meter .mbar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

#rep-body > .kpis { margin-bottom: var(--gap); }

.muted { color: var(--muted); }
.imp { display: grid; gap: 6px; padding: 12px 14px; background: var(--raised); border-radius: var(--r-card); }
.check { display: flex; align-items: center; gap: 8px; }

.mk { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: middle; }

@media (max-width: 720px) { .matrix.fixed { min-width: 0; } .matrix .ct { display: none; } .matrix td.wk a.cell { justify-content: center; padding: 0; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: var(--fs-small); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .mk { width: 12px; height: 12px; border-radius: 3px; }
.legend .mk.plan { width: 4px; height: 4px; }

/* settings */
.set-row { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; padding: 28px 0; }
.set-row + .set-row { border-top: 1px solid var(--rule); }
.set-row h2 { font-size: var(--fs-section); font-weight: 600; }
.set-row .desc { margin-top: 6px; color: var(--muted); }
.set-panel { background: var(--raised); border-radius: 12px; padding: 18px; display: grid; gap: 14px; align-content: start; }

.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days label { position: relative; }

.days span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-control); border: 1px solid var(--control); background: var(--surface); color: var(--muted); }

.logo-prev { width: 120px; height: 48px; border-radius: 6px; background: var(--surface); border: 1px dashed var(--control); display: grid; place-items: center; color: var(--faint); font-size: 12px; overflow: hidden; }
.logo-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }
.notice { padding: 10px 12px; border-radius: var(--r-control); background: #fbf8ec; border: 1px solid #ecdfa7; color: #6f4f0c; font-size: 13px; line-height: 19px; }

/* dialog: it floats, so it may carry a shadow */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.18); color: var(--text); }

dialog form { padding: 24px; display: grid; gap: 14px; }
dialog h2 { font-size: 18px; font-weight: 700; }
dialog .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
dialog .foot .left { margin-right: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); transition: opacity .2s ease, transform .25s var(--ease-out); pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- macOS layer: sidebar on the window ground, a floating sheet, system controls ---------- */
body { letter-spacing: -0.006em; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 7px; }
.sidebar { padding: 18px 10px; }
.brand { padding: 6px 10px 2px; }
.brand b { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.scope { margin: 2px 10px 20px 48px; color: var(--faint); }
.group-label { margin: 20px 10px 4px; font-size: 11px; font-weight: 600; color: var(--faint); }
.nav-item { height: 30px; padding: 0 10px; gap: 9px; border-radius: 7px; color: var(--text); }
.nav-item svg { color: var(--blue); stroke-width: 1.6; }
.nav-item:hover { background: rgba(0, 0, 0, .045); color: var(--text); }

.sheet { margin: 10px 10px 10px 0; border: 0; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .05); padding: 30px var(--pad) 48px; }
.title-row h1 { line-height: 32px; letter-spacing: -0.028em; }

.btn { border: 0; border-radius: 7px; background: #fff; box-shadow: var(--shadow-ctl); font-size: 13.5px; padding: 0 13px; transition: background-color .15s ease, box-shadow .15s ease, transform .12s var(--ease-out); }
.btn:hover { background: #fafafb; }

.input, select.input { border: 0; border-radius: 7px; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2), 0 .5px 1px rgba(0, 0, 0, .04); transition: box-shadow .15s ease; }
.input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--blue), var(--ring); }
.segmented, .ox, .ws-seg { background: rgba(0, 0, 0, .06); border-radius: 8px; }

.tabs { border-bottom-color: var(--rule); }

.days span { border: 0; box-shadow: var(--shadow-ctl); border-radius: 8px; }
.days input:checked + span { background: var(--blue); }
.check input { accent-color: var(--blue); }
:is(.btn, .input, .segmented button, .ox button, .nav-item, .days input + span):focus-visible { box-shadow: var(--ring); }

.panel, .mh, .mock, .wel-shot { border: 0; box-shadow: var(--shadow-card); }
.panel { border-radius: 12px; }
.kpis { border: 0; background: var(--raised); border-radius: 12px; }
.kpi + .kpi { border-left-color: rgba(0, 0, 0, .06); }
.kpi-label { font-size: 13px; }
.kpi-value { letter-spacing: -0.02em; }
th { color: var(--faint); font-weight: 500; }
.set-panel { border-radius: 14px; }
.notice { border: 0; border-radius: 10px; }
.empty { border: 0; background: var(--raised); border-radius: 10px; }

.wel { gap: 32px; }
.wel-hero { padding: 48px; border-radius: 20px; gap: 48px; }
.wel-copy h1 { font-size: 34px; line-height: 44px; letter-spacing: -0.032em; }
.wel-lede { font-size: 16.5px; }
.wel-cta .btn { height: 36px; padding: 0 18px; font-size: 14.5px; border-radius: 9px; }
.wel-shot { border-radius: 14px; padding: 0 22px 20px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 18px 44px rgba(0, 0, 0, .1); }
.ws-lights { display: flex; gap: 8px; margin: 0 -22px; padding: 12px 14px; }
.ws-lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .12); }
.ws-lights i:nth-child(2) { background: #febc2e; }
.ws-lights i:nth-child(3) { background: #28c840; }
.ws-flag.alt, .mock .hit i { background: var(--blue); }
.mock .hit { outline-color: var(--blue); }
.steps li::marker { color: var(--blue); }
.wel-steps article { border: 0; background: var(--raised); border-radius: 16px; padding: 22px; }
.wel-steps .wf { background: #fff; border-radius: 10px; }
.wf-fields span, .wf-file .file { border: 0; box-shadow: var(--shadow-ctl); }
.wel-guide { border: 0; background: var(--raised); border-radius: 20px; padding: 32px; }
@media (max-width: 1100px) { .wel-hero { padding: 28px; } }
@media (max-width: 720px) { .wel-hero { padding: 20px 16px; gap: 24px; } .wel-copy h1 { font-size: 25px; line-height: 33px; } .wel-shot { padding: 0 16px 16px; } .ws-lights { margin: 0 -16px; } .wel-guide { padding: 20px 16px; } }

dialog { border-radius: 14px; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 24px 70px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(0, 0, 0, .2); }
dialog[open] { animation: pop .22s var(--ease-out); }
.toast { background: rgba(30, 30, 32, .88); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-radius: 12px; font-weight: 500; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
#view > * { animation: rise .32s var(--ease-out) both; }
@media (prefers-reduced-motion: reduce) { #view > *, dialog[open] { animation: none; } }
@media (max-width: 1100px) {
  .sheet { box-shadow: none; }
  .app .topbar { background: rgba(235, 235, 238, .82); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom-color: rgba(0, 0, 0, .08); }
}

/* ---------- tablet and phone ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; background: var(--surface); transform: translateX(-100%); transition: transform .22s var(--ease-out); padding: 16px; }
  .sidebar.open { transform: none; }
  .sidebar .close { display: inline-flex !important; position: absolute; top: 12px; right: 12px; }
  .topbar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; position: sticky; top: 0; z-index: 10; background: var(--ground); border-bottom: 1px solid var(--border); }
  .topbar b { font-weight: 700; }
  .topbar .grow { flex: 1; }
  .sheet { margin: 0; border: 0; border-radius: 0; min-height: calc(100vh - 52px); padding: 20px 24px 40px; }
  .span-8, .span-4, .span-7, .span-5 { grid-column: span 12; }
}
@media (max-width: 720px) {
  .sheet { padding: 16px 16px 40px; }
  .title-row h1 { font-size: 21px; line-height: 28px; }
  .kpis { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi + .kpi { border-left: 0; }
  .kpi:nth-child(n + 3) { border-top: 1px solid var(--border); }
  .kpi:nth-child(2n) { border-left: 1px solid var(--border); }
  .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .two, .three { grid-template-columns: 1fr; }
  .set-row { grid-template-columns: 1fr; gap: 14px; }
  .actions { width: 100%; }
  .stepper .label { min-width: 0; flex: 1; }
  /* tables become two-line rows */
  table.cards thead { display: none; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards tr:not(.group) { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  table.cards tr:not(.group) td { padding: 0; border: 0; text-align: left; }
  table.cards td[data-l]::before { content: attr(data-l) " "; color: var(--muted); font-size: 12px; }
  table.cards td.first { grid-column: 1; }
  table.cards td.act { grid-column: 2; grid-row: 1; justify-self: end; }
  table.cards td.minor { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  table.cards td.hide-m { display: none; }
  table.cards td.half { grid-column: auto; }
  table.cards td .truncate { display: inline-block; vertical-align: bottom; max-width: 100%; }
  .matrix td.name, .matrix th.name { width: 96px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  .matrix td.name .sub { display: none; }
  .hwseg { display: flex; width: 100%; } .hwseg button { flex: 1; }
  .legacy dl { grid-template-columns: 1fr; }

const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };

const mdw = (s) => `${md(s)} (${WD[dow(s)]})`;

const full = (s) => { const d = parse(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const mondayOf = (s) => { const w = dow(s); return addDays(s, w === 0 ? -6 : 1 - w); };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const nf = new Intl.NumberFormat('ko-KR');
const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
const hasText = (s) => String(s ?? '').trim() !== '';

function newLog(st, date) {
  return { v: 3, sid: st.id, date, updatedAt: null, hw: { text: '', status: '' }, memo: '', next: { hw: '', check: '' }, mh: null };
}
// 기록이 있는지: 이어받은 과제 문구만 있는 빈 일지는 기록으로 치지 않는다
const hasContent = (l) => !!(l && (l.hw.status || hasText(l.memo) || hasText(l.next.hw) || hasText(l.next.check) || l.mh || l.legacy));
// 선생님이 직접 쓴 내용이 있는지 (엑셀에서 불러온 학습 결과만 있는 날과 구분)
const hasTeacher = (l) => !!(l && (l.hw.status || hasText(l.memo) || hasText(l.next.hw) || hasText(l.next.check) || l.legacy));
// 목록에 한 줄로 보여줄 매쓰홀릭 요약: 수업 학습 점수, 없으면 교재채점 같은 수업 밖 채점
const mhShort = (m) => { if (!m) return ''; const p = rateOf(m); if (p !== null) return `${m.correct}/${m.total}`; const o = (m.others || [])[0]; return o ? `${o.type} ${o.c}/${o.n}` : m.video ? `동영상 ${m.video}개` : ''; };
const rateOf = (m) => { const t = parseInt(m?.total, 10), c = parseInt(m?.correct, 10); return t > 0 && c >= 0 && c <= t ? Math.round((c / t) * 100) : null; };

/* ---------- 예전 형식(학생용 v1, 선생님용 v2) 일지를 새 형식으로 옮긴다. 원래 내용은 legacy에 그대로 남긴다 ---------- */
function migrate(l) {
  if (l.v === 3) return l;
  const b = l.before || {}, a = l.after || {};
  const qa = a.qa || b.qa || {}, cm = a.comment || {}, at = a.attitude || {}, res = a.result || {};
  const row = (r) => [r.book, r.unit, hasText(r.pages) ? 'p.' + r.pages : '', r.content].filter(hasText).join(' ');
  const checked = (b.hwCheck || []).filter((h) => h.done === true || h.done === false);
  const out = newLog({ id: l.sid }, l.date);

  out.hw.status = !checked.length ? '' : checked.every((h) => h.done) ? '완료' : checked.every((h) => !h.done) ? '미완료' : '일부 완료';
  const sum = a.summary ? [a.summary.unit, a.summary.text].filter(hasText).join(': ') : '';
  out.memo = [cm.good, cm.improve, qa.q, sum, at.note, a.thanks].filter(hasText).join(' / ');
  out.next.hw = (a.hwPlan || []).map(row).filter(hasText).join(' / ');
  out.next.check = hasText(cm.next) ? cm.next : (a.progressPlan || []).map(row).filter(hasText).join(' / ');
  if (hasText(res.total) || hasText(res.units)) out.mh = { total: res.total || '', correct: res.correct || '', units: res.units || '', weak: res.weak || '', progress: b.mh || '', comment: '' };
  out.legacy = { before: b, after: a };
  return out;
}
// 예전 기록 전체를 읽기 전용으로 보여주고 내보내기 위한 목록
function legacyRows(l) {
  if (!l.legacy) return [];
  const b = l.legacy.before || {}, a = l.legacy.after || {}, out = [];
  const add = (k, v) => { if (hasText(v)) out.push([k, String(v)]); };
  const rows = (list, fn) => (list || []).map(fn).filter(hasText).join('\n');
  add('과제 확인', rows(b.hwCheck, (h) => [h.course, h.book, h.unit, hasText(h.pages) ? 'p.' + h.pages : '', h.done === true ? 'O' : h.done === false ? 'X' : '', h.eval].filter(hasText).join(' ')));

  add('복습', b.review ? [b.review.unit, b.review.text].filter(hasText).join(': ') : '');
  add('진도 확인', rows(b.progressCheck, (p) => [p.time, p.course, p.book, p.unit, hasText(p.pages) ? 'p.' + p.pages : '', p.content].filter(hasText).join(' ')));
  add('매쓰홀릭 진도', hasText(b.mh) ? b.mh + '%' : ''); add('수업 목표', b.goal); add('목표 달성', a.goalMet);
  const r = a.result || {};
  add('학습 결과', hasText(r.total) ? `${r.correct}/${r.total}` : ''); add('단원·유형별', r.units); add('취약 유형', r.weak);
  const cm = a.comment || {};
  add('잘한 점', cm.good); add('보완할 점', cm.improve); add('다음 지도', cm.next); add('학부모 코멘트', a.parentNote);
  if (a.summary) add('개념 요약정리', [a.summary.unit, a.summary.text].filter(hasText).join(': '));
  add('오늘의 감사', a.thanks);
  const at = a.attitude || {};
  add('출결', at.attend); add('집중도', at.focus); add('특이사항', at.note);
  add('과제 계획', rows(a.hwPlan, (p) => [p.time, p.course, p.book, p.unit, hasText(p.pages) ? 'p.' + p.pages : '', p.content].filter(hasText).join(' ')));
  add('진도 계획', rows(a.progressPlan, (p) => [p.time, p.course, p.book, p.unit, hasText(p.pages) ? 'p.' + p.pages : '', p.content].filter(hasText).join(' ')));

}

/* ---------- sample academy (replace with real data in 설정) ---------- */
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function seed() {
  const rnd = mulberry(20261021), pick = (a) => a[Math.floor(rnd() * a.length)];
  const classes = [
    { id: 'c1', name: '초등 4·5 기초반', target: '초4–초5', days: [1, 3, 5], time: '15:00' },

    ['c1','초4','이하윤','초4-2'],['c1','초4','박도윤','초4-2'],['c1','초5','최서아','초5-2'],['c1','초5','정이준','초5-2'],

    ['c3','중1','한유나','중1-2'],['c3','중1','오준서','중1-2'],['c3','중1','서지안','중1-2'],

    ['c6','고1','전소율','공통수학2'],['c6','고1','홍지후','공통수학2'],['c6','고1','문다인','공통수학2'],
    ['c7','고2','배현우','대수'],['c7','고2','유나연','대수'],
    ['c8','고3','장민서','미적분'],['c8','고3','노태윤','미적분'],
  ];
  const slack = { '조민준': 0.45, '오준서': 0.5, '홍지후': 0.55 };
  const students = roster.map(([classId, grade, name, course], i) => ({ id: 's' + (i + 1), name, grade, classId, course, book: grade.startsWith('초') ? '개념 교재' : '유형 문제집', days: [], memo: '' }));
  const GOOD = (u) => pick([`${u} 기본 문제는 안정적.`, `${u} 개념을 스스로 설명함.`, '지난 오답을 다시 풀어 옴.', `${u} 풀이 과정을 끝까지 적음.`]);
  const FIX = (u) => pick(['응용에서 조건 정리 다시 확인 필요.', '계산 실수 반복, 검산 습관 지도 중.', '서술형 풀이 근거 쓰기 연습 필요.', `${u} 응용 유형 풀이 시간이 김.`]);
  const CHECK = (u) => pick([`${u} 응용 문제 조건 정리`, '검산했는지 확인', '오답 노트 정리 상태', `${u} 핵심 개념 말로 설명하기`]);
  const WEAK = (u) => pick([`${u} 응용`, `${u} 서술형`, '계산 검산', '조건 해석']);
  const logs = {};
  const start = addDays(TODAY, -34);

    const c = classes.find((x) => x.id === st.classId), U = UNITS[st.course];

      const total = 12 + Math.floor(rnd() * 16), a1 = Math.min(1, Math.max(0.3, acc + (rnd() - 0.5) * 0.25)), correct = Math.round(total * a1);

    const mhOnly = (d) => { const log = newLog(st, d); log.mh = mhOf(U[u % U.length]); logs[st.id + '|' + d] = log; };
    for (let d = start; d <= TODAY; d = addDays(d, 1)) {

// 지난 수업에서 남긴 다음 과제·지도 계획
function prevPlan(sid, d) { const ls = logsOf(sid).filter((l) => l.date < d && (hasText(l.next.hw) || hasText(l.next.check))); return ls[ls.length - 1] || null; }
function hwStats(ls) { const s = { done: 0, part: 0, miss: 0 }; ls.forEach((l) => { if (l.hw.status === '완료') s.done++; else if (l.hw.status === '일부 완료') s.part++; else if (l.hw.status === '미완료') s.miss++; }); s.n = s.done + s.part + s.miss; return s; }

function scoreSum(ls) { let t = 0, c = 0, n = 0; ls.forEach((l) => { if (rateOf(l.mh) !== null) { t += +l.mh.total; c += +l.mh.correct; n++; } }); return { t, c, n }; }
function studentOrder() {
  const order = (s) => [db.classes.findIndex((c) => c.id === s.classId), GRADES.indexOf(s.grade)];
  return [...db.students].sort((a, b) => { const x = order(a), y = order(b); return x[0] - y[0] || x[1] - y[1] || a.name.localeCompare(b.name, 'ko'); });
}
function tint(id) { const i = db.students.findIndex((s) => s.id === id); const h = (i * 67 + 95) % 360; return `background:hsl(${h} 42% 91%);color:hsl(${h} 38% 27%)`; }

/* ================= 주간·월간 기록 ================= */
// mode: week | month | custom(기간 직접 설정). tab: days(날짜별 기록) | summary(학생별 요약) | rate(정답률·해결률)

  if (rep.mode === 'week') { const s = mondayOf(rep.anchor); return [s, addDays(s, 6)]; }
  const d = parse(rep.anchor); return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
}

  const y = rep.mode === 'custom' && d.getFullYear() !== f.getFullYear();
  return `${y ? d.getFullYear() + '년 ' : ''}${d.getMonth() + 1}월 ${d.getDate()}일 – ${y ? f.getFullYear() + '년 ' : ''}${f.getMonth() + 1}월 ${f.getDate()}일`;
}
/* 정답률과 해결률.
   정답률 = 수업 학습(확인학습·다시풀기·오답유사·유형도전)에서 맞힌 문항 ÷ 푼 문항.
   해결률 = 처음에 틀린 학습 가운데 다시풀기·오답유사로 끝내 다 맞힌 비율. 엑셀에서 불러온 결과로만 센다. */

/* ---------- export: 학생별 요약 + 일지(학생별, 날짜순) ---------- */
function sheets(list, s, e) {

  const head = ['날짜', '요일', '지난 과제', '과제 수행', '지도 메모', '다음 과제', '다음 수업 확인할 점', '맞힌 문항', '푼 문항', '정답률', '학습별 결과', '미해결', '다시 풀어 해결', '그 밖의 학습', '보고서 코멘트', '이전 형식 기록'];
  const out = {}, used = new Set(['학생별 요약']);

  const sheetName = (st) => { let base = `${st.name}(${st.grade})`.replace(/[\\/?*[\]:]/g, '').slice(0, 28), n = base, i = 2; while (used.has(n)) n = `${base}${i++}`; used.add(n); return n; };
  for (const st of list) {
    const r = summarize(st, s, e), rs = rateStats(r.ls);
    summary.push([st.name, st.grade, C(st), st.course, r.need, r.ls.length, r.hs.done, r.hs.part, r.hs.miss, ratio(r.hs.done, r.hs.n), r.sc.n || '', r.sc.t ? r.sc.c : '', ratio(r.sc.c, r.sc.t), r.sc.t || '', rs.wrong || '', rs.wrong ? rs.solved : '', ratio(rs.solved, rs.wrong), rs.top.slice(0, 3).map(([u, n]) => n > 1 ? `${u} (×${n})` : u).join(', '), r.memo, r.plan]);
    if (!r.ls.length) continue;
    const rows = [['학생', st.name, '학년', st.grade, '반', C(st), '기간', `${s} ~ ${e}`], [], head];
    for (const l of r.ls) {
      const m = l.mh || {}, p = rateOf(l.mh);
      rows.push([l.date, WD[dow(l.date)], l.hw.text, l.hw.status, l.memo, l.next.hw, l.next.check, p === null ? '' : +m.correct, p === null ? '' : +m.total, p === null ? '' : p / 100, m.units || '', m.weak || '', m.solved || '', m.extra || '', m.comment || '', legacyRows(l).map(([k, v]) => `${k}: ${v}`).join('\n')]);
    }

}
const fileBase = (s, e, scope) => `학습일지_${{ week: '주간', month: '월간', custom: '기간' }[rep.mode]}_${rep.mode === 'month' ? s.slice(0, 7) : `${s}_${e}`}_${scopeName(scope)}${scope === rep.scope && rep.q.trim() ? '_' + rep.q.trim() : ''}`.replace(/[\\/:*?"<>|\s]+/g, '');
function exportXlsx(scope = rep.scope) {

function exportCsv(scope = rep.scope) {
  const [s, e] = rangeOf(); const sh = sheets(repList(scope), s, e);
  const cell = (v) => { const t = String(v ?? ''); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const body = Object.entries(sh).map(([name, rows]) => `[${name}]\r\n` + rows.map((r) => r.map(cell).join(',')).join('\r\n')).join('\r\n\r\n');
  download(new Blob(['﻿' + body], { type: 'text/csv;charset=utf-8' }), fileBase(s, e, scope) + '.csv');

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  const realCls = (c) => hasText(c) && c !== '미배정';
  return {
    people: list, days, from: dates[0] || '', to: dates[dates.length - 1] || '',
    matched: list.filter((x) => x.match).length,
    newClasses: [...new Set(list.filter((x) => !x.match && realCls(x.cls) && !db.classes.some((c) => c.name === x.cls)).map((x) => x.cls))],
    allClasses: [...new Set(list.filter((x) => realCls(x.cls)).map((x) => x.cls))],
  };
}
function applyImport(parsed, { clearSample, addNew }) {
  if (clearSample) { db.classes = []; db.students = []; db.logs = {}; db.sample = false; }
  const plan = planImport(parsed), map = new Map();
  let created = 0, attached = 0, skipped = 0;
  for (const x of plan.people) {
    let st = x.match ? stu(x.match) : null;
    if (!st && addNew) {
      let classId = '';
      if (hasText(x.cls) && x.cls !== '미배정') {
        let c = db.classes.find((cc) => cc.name === x.cls);
        if (!c) { c = { id: 'c' + uid(), name: x.cls, target: x.grade, days: [], time: '' }; db.classes.push(c); }
        classId = c.id;
      }
      st = { id: 's' + uid(), name: x.name, grade: x.grade, classId, course: '', book: '', days: [], memo: '', mhId: x.id || '' };
      db.students.push(st); created++;
    }
    if (!st) continue;
    if (x.id && !st.mhId) st.mhId = x.id;
    if (x.link) st.mhLink = x.link;
    const top = Object.entries(x.courses).sort((a, b) => b[1] - a[1])[0]?.[0];
    if (top && !hasText(st.course)) st.course = top;
    map.set(x.key, st.id);
  }
  for (const d of plan.days) {
    const sid = map.get(d.pk);
    if (!sid) { skipped++; continue; }
    const key = sid + '|' + d.date, l = db.logs[key] || newLog({ id: sid }, d.date);
    l.mh = d.mh; db.logs[key] = l; attached++;
  }
  persist();
  return { created, attached, skipped, from: plan.from, to: plan.to };
}
function openImport(parsed, fileName) {

  else if (k === 'logo') { const f = ev.target.files[0]; if (!f) return; if (f.size > 400000) return toast('로고는 400KB 이하 이미지로 올려 주세요'); const r = new FileReader(); r.onload = () => { db.academy.logo = r.result; persist(); renderSettings(); }; r.readAsDataURL(f); }
  else if (k === 'mh-import') { const f = ev.target.files[0]; ev.target.value = ''; if (f) importExcel(f); }
  else if (k === 'restore') { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.students || !d.logs) throw 0; if (confirm(`백업의 학생 ${d.students.length}명, 일지 ${Object.keys(d.logs).length}건으로 지금 기록을 바꿀까요?`)) { for (const key of Object.keys(d.logs)) d.logs[key] = migrate(d.logs[key]); d.v = 3; db = d; persist(); route(); toast('복원했습니다'); } } catch (e) { toast('학습일지 백업 파일이 아닙니다'); } }; r.readAsText(f); }
});

/* ---------- 매쓰홀릭 엑셀 가져오기: 버튼으로 고르거나 화면에 끌어다 놓기 ---------- */
// 안내 창마다 실제로 읽은 파일을 적어, 다른 파일이 골라졌는지 바로 알 수 있게 한다
const fileInfo = (f) => `읽은 파일: ${f.name} (${Math.max(1, Math.round(f.size / 1024))}KB · ${new Date(f.lastModified).toLocaleString('ko-KR')})`;
function importExcel(f) {
  if (!window.XLSX) return toast('엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
  f.arrayBuffer().then((buf) => {
    // 엑셀 파일은 PK(.xlsx) 또는 D0 CF(.xls)로 시작한다. 아니면 보안 프로그램(DRM)이 잠근 파일이거나 다른 형식이다
    const b = new Uint8Array(buf.slice(0, 2));
    if (!((b[0] === 0x50 && b[1] === 0x4b) || (b[0] === 0xd0 && b[1] === 0xcf))) return alert(`엑셀 파일로 읽을 수 없습니다.\n\n회사·학원 보안 프로그램(DRM)이 파일을 잠갔거나, 엑셀이 아닌 파일일 수 있어요.\n매쓰홀릭에서 엑셀을 다시 받아 열지 않은 채로 바로 올려 보세요.\n\n${fileInfo(f)}`);
    const wb = XLSX.read(buf, { type: 'array' });
    const parsed = readMatholic(wb);
    // 학습일지에서 내려받은 엑셀(첫 시트 '학생별 요약')을 잘못 올린 경우
    if (!parsed.rows.length && !parsed.roster.length && wb.SheetNames.includes('학생별 요약')) return alert(`학습일지에서 내려받은 엑셀이 골라졌어요.\n\n여기에는 매쓰홀릭에서 받은 '매쓰홀릭_학습_이력' 엑셀을 올려 주세요.\n매쓰홀릭 [학습현황]에서 날짜와 학생을 고르고 [학습 이력 n명]을 누르면 받아집니다.\n\n${fileInfo(f)}`);
    if (!parsed.rows.length && !parsed.roster.length) return alert(`매쓰홀릭 학습 이력 엑셀에서 학생을 찾지 못했습니다.\n\n매쓰홀릭 학습현황에서 받은 '학습 이력' 엑셀인지 확인해 주세요. (? 버튼: 엑셀 받는 곳 보기)\n\n${fileInfo(f)}\n읽은 시트와 첫 줄:\n${parsed.sheets.join('\n')}`);
    openImport(parsed, f.name);
  }).catch((e) => alert(`엑셀 파일을 읽지 못했습니다.\n암호가 걸려 있거나 보안 프로그램으로 잠긴 파일일 수 있어요.\n\n${fileInfo(f)}\n(${e && e.message ? e.message : e})`));
}
const isFileDrag = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragover', (e) => { if (isFileDrag(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
window.addEventListener('drop', (e) => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  const f = [...e.dataTransfer.files].find((x) => /\.xlsx?$/i.test(x.name));
  if (f) importExcel(f); else toast('매쓰홀릭 엑셀(.xlsx) 파일을 끌어다 놓아 주세요');
});

route();
</script>
</body>
</html>
