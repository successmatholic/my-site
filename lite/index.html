<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --ink:#0f2119; --ink2:#4a6157; --ink3:#8aa096; --line:#dde6e0; --line2:#eaf1ec;
  --paper:#f8fbf8; --surf:#fff; --dark:#0e3a27;
  --acc:#0d8a4f; --acc2:#0a6d3e; --accsoft:#e9f5ee; --accline:#bfe3cd;
  --good:#0d8a4f; --goodsoft:#f1f9f4;
  --max:1140px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px;line-height:1.68;letter-spacing:-.011em;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
.w{max-width:var(--max);margin:0 auto;padding:0 30px}
.num{font-variant-numeric:tabular-nums}
section{scroll-margin-top:74px}

/* ── 헤더 ── */
header{position:sticky;top:0;z-index:40;background:rgba(248,251,248,.88);backdrop-filter:blur(12px)}
header .w{display:flex;align-items:center;gap:26px;height:62px;border-bottom:1px solid transparent;
  transition:border-color .2s}
header.stuck .w{border-color:var(--line)}
.brand{font-size:15px;font-weight:700;letter-spacing:-.025em;white-space:nowrap}
.brand em{font-style:normal;color:var(--ink3);font-weight:500;margin-left:7px}
nav{display:flex;gap:22px;margin-left:auto}
nav a{font-size:13.5px;color:var(--ink2)}
nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;background:var(--acc);color:#fff;font-size:13px;
  font-weight:600;padding:9px 16px;border-radius:8px;transition:.16s;white-space:nowrap}
.btn:hover{background:var(--acc2);transform:translateY(-1px)}

/* ── 히어로 : 제목 + 진행 카드 한 줄 ── */
.hero{padding:52px 0 44px}
.hero .w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:end}
.eb{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:16px}
.eb:before{content:'';width:22px;height:2px;background:var(--acc);border-radius:2px}
.hero h1{margin:0;font-size:clamp(38px,6vw,82px);line-height:1.14;letter-spacing:-.05em;font-weight:800}
.hero h1 em{font-style:normal;font-weight:400;color:var(--ink2)}
.hero .sub{margin:20px 0 0;font-size:17px;color:var(--ink2);line-height:1.8;max-width:40ch}
.hero .sub b{color:var(--ink);font-weight:700}

.pcard{width:376px}
.pcard .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:15px}
.pcard .ph b{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3)}
.pcard .ph span{margin-left:auto;font-size:15px;color:var(--ink3);font-weight:600;line-height:1}
.pcard .ph span i{font-style:normal;color:var(--ink);font-weight:800;font-size:38px;
  letter-spacing:-.045em;margin-right:3px}
.bar4{display:flex;gap:6px}
.bar4 .sg{flex:1;height:9px;border-radius:20px;background:#e2ebe6;overflow:hidden}
.bar4 .sg u{display:block;height:100%;width:0;border-radius:20px;background:var(--cd);
  transition:width .55s cubic-bezier(.4,0,.2,1)}
.pcard .msg{margin-top:15px;font-size:14px;line-height:1.6;color:var(--ink2)}
.pcard .msg b{color:var(--acc2);font-weight:700}
.pcard.fin .ph span i{color:var(--acc)}

/* ── 단계 선택 띠 ── */
.bandwrap{padding:8px 0 0}
.band{position:relative;background:#edf4ef;border-radius:24px;padding:30px 30px 32px}
#notch{position:absolute;bottom:-10px;width:22px;height:10px;background:#edf4ef;
  clip-path:polygon(0 0,100% 0,50% 100%);transition:left .28s cubic-bezier(.4,0,.2,1);
  opacity:0;pointer-events:none}
#notch.on{opacity:1}
.bhead{display:flex;align-items:baseline;gap:16px;margin-bottom:18px}
.bhead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.032em}
.bhead .note{margin-left:auto;font-size:13.5px;color:var(--ink2)}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lp2{position:relative;display:flex;flex-direction:column;gap:9px;padding:18px 18px 16px;
  background:var(--surf);border:1px solid transparent;border-radius:15px;text-align:left;overflow:hidden;
  box-shadow:0 1px 2px rgba(14,58,39,.05);
  transition:background .2s,box-shadow .2s,transform .18s}
.lp2:hover{transform:translateY(-2px);box-shadow:0 10px 22px -6px rgba(14,58,39,.16)}
.lp2 .gn{position:absolute;top:6px;right:12px;font-size:50px;font-weight:800;line-height:1;
  letter-spacing:-.05em;color:var(--cd);opacity:.11;pointer-events:none}
.lp2.on{background:var(--cd);box-shadow:0 14px 30px -10px var(--cd)}
.lp2.on .t{color:#fff}
.lp2.on .i{color:rgba(255,255,255,.75)}
.lp2.on .i b{background:#fff}
.lp2.on .gn{color:#fff;opacity:.20}
.lp2.on .mini .tr{background:rgba(255,255,255,.3)}
.lp2.on .mini .tr u{background:#fff}
.lp2.on .mini .n{color:rgba(255,255,255,.88)}
.lp2:focus-visible{outline:2px solid var(--cd);outline-offset:3px}
.lp2 .i{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.14em;
  color:var(--ink3)}
.lp2 .i b{width:7px;height:7px;border-radius:50%;background:var(--cd);flex:none}
.lp2 .t{font-size:20.5px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
.lp2 .mini{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:8px}
.lp2 .mini .tr{flex:1;height:4px;border-radius:20px;background:#e4ede8;overflow:hidden}
.lp2 .mini .tr u{display:block;height:100%;width:0;background:var(--cd);border-radius:20px;
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.lp2 .mini .n{font-size:12px;color:var(--ink3);font-weight:600;white-space:nowrap}
.lp2.ok:not(.on){background:var(--goodsoft)}
.lp2.ok .mini .n{color:var(--good);font-weight:700}
.lp2.ok.on .mini .n{color:#fff}

/* ── 독려 줄 ── */
.nudge{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.nudge .lb{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ctx)}
.nudge .lb i{width:7px;height:7px;border-radius:50%;background:var(--cd);font-style:normal}
.nudge .lb u{text-decoration:none;font-size:11.5px;letter-spacing:.13em;color:var(--cd);opacity:.8}
.nudge .say{margin-left:auto;font-size:13.5px;color:var(--ink2)}
.nudge .say b{color:var(--acc2);font-weight:700}
.nudge .go{display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:#fff;
  font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:8px;transition:.16s}
.nudge .go:hover{background:var(--acc2);transform:translateY(-1px)}
.nudge .go i{font-style:normal;transition:transform .2s}
.nudge .go:hover i{transform:translateX(3px)}
.nudge.done .say{color:var(--acc2);font-weight:700}

section.guides{padding:30px 0 64px}
#ghost>#panel{padding:0 30px}

/* ── 가이드 목록 : 단계 아래 한 단계 낮은 층 ── */
.list{display:block}
.gc{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:17px;
  background:#fff;border:1px solid var(--line2);border-radius:15px;padding:18px 20px;
  box-shadow:0 1px 2px rgba(14,58,39,.04);
  transition:transform .16s cubic-bezier(.3,.8,.4,1),box-shadow .16s,border-color .16s}
.gc+.gc{margin-top:9px}
.gc:hover{border-color:transparent;transform:translateX(3px);
  box-shadow:0 10px 24px -10px rgba(14,58,39,.22),0 0 0 1px var(--cd)}
.gc .idx{width:32px;height:32px;border-radius:50%;background:var(--cbg);color:var(--ctx);
  font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  transition:.16s;flex:none}
.gc .idx:hover{transform:scale(1.08)}
.gc .body{min-width:0}
.gc .ttl{display:block;font-size:17.5px;font-weight:700;letter-spacing:-.032em;line-height:1.35;
  color:var(--ink)}
.gc .d{display:block;margin-top:4px;font-size:13.5px;color:var(--ink2);line-height:1.55;
  max-width:62ch}
.gc .rt{display:flex;align-items:center;gap:12px}
.gc .tm{font-size:12.5px;color:var(--ink3);font-weight:600;white-space:nowrap}
.gc .pre{display:inline-flex;align-items:center;gap:5px;background:var(--paper);
  border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--ink3);
  white-space:nowrap}
.gc .pre b{color:var(--ink2);font-weight:600}
.gc .ar{width:33px;height:33px;border-radius:50%;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:12px;color:var(--ink3);transition:.16s;flex:none}
.gc:hover .ar{background:var(--cd);border-color:var(--cd);color:#fff}
.gc.ok{background:var(--goodsoft);border-color:var(--accline)}
.gc.ok .idx{background:var(--good);color:#fff}
.gc.soon{opacity:.55}
.gc:focus-visible{outline:2px solid var(--cd);outline-offset:3px}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gc.in{animation:cardin .34s cubic-bezier(.22,1,.36,1) both}
.c-start{--cbg:#e7f3ec;--ctx:#0a6d3e;--cd:#0d8a4f}
.c-class{--cbg:#e5edf8;--ctx:#1f5aa8;--cd:#3b7ad1}
.c-grade{--cbg:#fbeee1;--ctx:#9c5716;--cd:#c9812f}
.c-manage{--cbg:#eee9f6;--ctx:#584594;--cd:#7c68bd}


/* ── 완주 축하 팝업 ── */
#done{position:fixed;inset:0;z-index:210;display:none;padding:24px}
#done.on{display:grid;place-items:center}
#done:before{content:'';position:absolute;inset:0;background:rgba(8,26,18,.5);
  backdrop-filter:blur(3px);animation:fade .24s ease both}
.dbox{position:relative;width:min(92vw,470px);background:#fff;border-radius:22px;
  padding:44px 40px 34px;text-align:center;
  box-shadow:0 30px 80px rgba(6,22,14,.34);animation:lift .34s cubic-bezier(.22,1,.36,1) both}
.dbox .e{display:block;font-size:46px;line-height:1}
.dbox b{display:block;margin-top:18px;font-size:24px;font-weight:800;letter-spacing:-.04em;
  line-height:1.3}
.dbox p{margin:12px 0 0;font-size:14.5px;color:var(--ink2);line-height:1.75}
.dbox .acts{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.dbox .p{display:block;background:var(--acc);color:#fff;font-size:15px;font-weight:700;
  padding:14px 20px;border-radius:11px;transition:.16s}
.dbox .p:hover{background:var(--acc2)}
.dbox .s{font-size:13.5px;color:var(--ink3);padding:8px}
.dbox .s:hover{color:var(--ink)}

/* ── 가이드 뷰어 ── */
#vw{position:fixed;inset:0;z-index:200;display:none;padding:18px 16px}
#vw.on{display:grid;place-items:center}
#vw:before{content:'';position:absolute;inset:0;background:rgba(8,26,18,.55);
  backdrop-filter:blur(3px);animation:fade .22s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes lift{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
.vwbox{position:relative;width:min(97vw,2400px,calc((100vh - 104px) * 16 / 9));background:#fff;
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(6,22,14,.4);animation:lift .28s cubic-bezier(.22,1,.36,1) both}
.vwbar{display:flex;align-items:center;gap:12px;padding:13px 16px 13px 20px;
  border-bottom:1px solid var(--line2);background:#fff}
.vwbar .no{font-size:10.5px;font-weight:800;letter-spacing:.13em;color:var(--cd)}
.vwbar .vt{font-size:15px;font-weight:700;letter-spacing:-.03em;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vwbar .sp{flex:1}
.vwbar .lnk{font-size:12px;color:var(--ink3)}
.vwbar .lnk:hover{color:var(--ink)}
.vwbar .x{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:16px;color:var(--ink2);transition:.15s}
.vwbar .x:hover{background:var(--line2);color:var(--ink)}
#vwf{width:100%;aspect-ratio:16/9;border:0;background:#f8fbf8;display:block}
body.lock{overflow:hidden}

footer{margin-top:auto;border-top:1px solid var(--line);padding:28px 0 30px}
footer .w{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
footer a{color:var(--ink2)} footer a:hover{color:var(--ink)}
footer .sp{flex:1}
footer .rs:hover{color:#a13b2a}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9999}

/* ── 가이드 열기 전 3초 인트로 : "이걸 만듭니다" ── */
#intro{position:absolute;inset:0;z-index:6;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(8px,2vw,20px);padding:clamp(16px,3vw,32px);
  color:var(--cd);animation:ifade .26s ease both;cursor:default}
#intro.out{animation:iout .3s ease both}
@keyframes ifade{from{opacity:0}to{opacity:1}}
@keyframes iout{to{opacity:0}}
#intro .ihd{text-align:center;color:var(--ink);animation:iup .55s .05s cubic-bezier(.2,.7,.3,1) both}
#intro .istep{display:block;font-size:clamp(10px,1.3vw,12px);font-weight:800;letter-spacing:.16em;
  color:var(--cd);margin-bottom:7px}
#intro .ihd b{display:block;font-size:clamp(18px,3vw,32px);font-weight:800;letter-spacing:-.042em;
  line-height:1.25}
#intro .istage{width:min(100%,600px)}
#intro svg{width:100%;height:auto;display:block;overflow:visible}
#intro svg *{transform-box:fill-box;transform-origin:center}
#intro .itag{font-size:clamp(12px,1.6vw,16px);color:var(--ink2);font-weight:600;text-align:center;
  animation:iup .5s 2.4s cubic-bezier(.2,.7,.3,1) both}
#intro .itag b{color:var(--cd);font-weight:800}
#intro .iskip{position:absolute;right:14px;bottom:12px;font-size:12.5px;font-weight:700;
  color:var(--ink3);padding:8px 12px;border-radius:8px;transition:.15s}
#intro .iskip:hover{background:var(--line2);color:var(--ink)}
#intro .ibar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line2)}
#intro .ibar u{display:block;height:100%;width:0;background:var(--cd);animation:ibar 3s linear both}
@keyframes ibar{to{width:100%}}
@media(max-width:640px){#intro .istage{width:100%}#intro .iskip{right:10px;bottom:8px}}

/* 공용 동작 */
#intro .pop{animation:ipop .52s cubic-bezier(.2,1.5,.4,1) both}
#intro .up{animation:iupS .5s cubic-bezier(.2,.9,.3,1) both}
#intro .rt{animation:irt .55s cubic-bezier(.2,.9,.3,1) both}
#intro .gw{animation:igw .5s cubic-bezier(.2,.9,.3,1) both;transform-origin:bottom}
#intro .fade{animation:ifin .45s ease both}
#intro .sweep{animation:isweep 1.15s .5s cubic-bezier(.5,0,.5,1) both}
#intro .split{animation:isplit .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes ipop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes iupS{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes irt{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes igw{from{opacity:0;transform:scaleY(.05)}to{opacity:1;transform:none}}
@keyframes ifin{from{opacity:0}to{opacity:1}}
@keyframes isweep{0%{opacity:0;transform:translateY(-46px)}12%{opacity:1}
  88%{opacity:1}100%{opacity:0;transform:translateY(46px)}}
@keyframes isplit{from{opacity:0;transform:translateX(0) scale(.9)}to{opacity:1;transform:none}}
#intro .a1{animation-delay:.34s}#intro .a2{animation-delay:.52s}#intro .a3{animation-delay:.70s}
#intro .a4{animation-delay:.88s}#intro .a5{animation-delay:1.06s}#intro .a6{animation-delay:1.26s}
#intro .a7{animation-delay:1.48s}#intro .a8{animation-delay:1.70s}#intro .a9{animation-delay:1.9s}
/* 짜잔 순간 */
#intro .fin{animation:izoom .62s 2.12s cubic-bezier(.2,1.6,.35,1) both}
@keyframes izoom{0%{opacity:0;transform:scale(.5) rotate(-8deg)}
  60%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:none}}
#intro .spk{animation:ispk .8s 2.2s ease-out both}
@keyframes ispk{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.15)}
  100%{opacity:0;transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){
  #intro *,#intro{animation-duration:.01s!important;animation-delay:0s!important}
}

/* ── 첫 방문 둘러보기 ── */
#tour{position:fixed;inset:0;z-index:150;display:none}
#tour.on{display:block}
#tspot{position:absolute;border-radius:18px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(8,26,18,.6),0 0 0 2px rgba(255,255,255,.92);
  transition:all .34s cubic-bezier(.4,0,.2,1)}
#ttip{position:absolute;width:min(92vw,344px);background:#fff;border-radius:16px;
  padding:20px 20px 16px;box-shadow:0 22px 54px rgba(6,22,14,.32);
  transition:all .34s cubic-bezier(.4,0,.2,1)}
#ttip .hd{display:flex;align-items:center;gap:11px}
#ttip .n{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--acc)}
#ttip .dots{display:flex;gap:5px}

 {id:'G02',fx:'roster',cat:'start',t:'학생 등록하기',s:'학생 등록',ask:'학생 추가 명단 등록',

 {id:'G05',fx:'twin',cat:'class',core:1,t:'시중교재 쌍둥이 문제 만들기',s:'쌍둥이 유형 문제',

 {id:'G12',fx:'wrong',cat:'grade',core:3,t:'틀린 문제만 모아 다시 풀기',s:'오답 다시 풀기',

 {id:'G16',fx:'grade',cat:'grade',t:'시중교재 채점하고 유사 문제 풀기',s:'시중교재 채점',

 {id:'G14',fx:'diag',cat:'manage',t:'입학 상담용 진단지 만들기',s:'진단지 만들기',

 {id:'G15',fx:'report',cat:'manage',t:'카카오톡 모바일 보고서 생성하기',s:'모바일 보고서',

var ICON={
 start:'<path d="M14 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 16l4-4-4-4"/><path d="M14 12H3"/>',
 cls:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>',
 grade:'<path d="M9 4H7a2 2 0 00-2 2v13a2 2 0 002 2h10a2 2 0 002-2V6a2 2 0 00-2-2h-2"/><rect x="9" y="2.5" width="6" height="3.5" rx="1.2"/><path d="M9 13.5l2.2 2.2L15.5 11"/>',
 manage:'<circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.7-5.2 6-5.2s6 1.9 6 5.2"/><path d="M17 11.2a2.6 2.6 0 000-5.2"/><path d="M18.8 20c0-2.3-.6-3.9-1.8-4.8"/>'};

var STAGES=[
 {id:'start', no:'01', big:'수업 준비하기',        c:'#0d8a4f', ic:ICON.start},
 {id:'class', no:'02', big:'원하는 문제 출제하기', c:'#3b7ad1', ic:ICON.cls},
 {id:'grade', no:'03', big:'학습 후 관리하기',      c:'#c9812f', ic:ICON.grade},
 {id:'manage',no:'04', big:'상담 자료 제공하기',   c:'#7c68bd', ic:ICON.manage}
];

var done=[]; try{done=JSON.parse(localStorage.getItem('mhl_done')||'[]')}catch(e){done=[]}
var party=[]; try{party=JSON.parse(localStorage.getItem('mhl_party')||'[]')}catch(e){party=[]}
function save(){try{localStorage.setItem('mhl_done',JSON.stringify(done));
  localStorage.setItem('mhl_party',JSON.stringify(party))}catch(e){}}
function isDone(id){return done.indexOf(id)>=0}
function mark(id){if(!isDone(id)){done.push(id);save();setTimeout(render,60)}}
function toggle(id){var i=done.indexOf(id);if(i>=0)done.splice(i,1);else done.push(id);save();render()}
function byId(id){for(var i=0;i<GUIDES.length;i++)if(GUIDES[i].id===id)return GUIDES[i]}
var gone={};   /* 폴더에 파일이 없는 가이드는 자동으로 '준비 중'이 됩니다 */
function live(g){return !g.soon&&!!g.url&&!gone[g.id]}
function probe(){
  if(location.protocol==='file:')return;   /* 내 컴퓨터에서 열어볼 때는 건너뜁니다 */
  var left=0,hit=false;
  GUIDES.forEach(function(g){
    if(!g.url)return; left++;
    fetch(g.url,{method:'HEAD',cache:'no-store'})
      .then(function(r){ if(!r.ok){gone[g.id]=true;hit=true} })
      .catch(function(){})
      .then(function(){ if(--left===0&&hit)render(); });
  });
}
function inStage(c){return GUIDES.filter(function(g){return g.cat===c&&live(g)})}
function nDone(c){return inStage(c).filter(function(g){return isDone(g.id)}).length}
function stageDone(c){var l=inStage(c);return l.length>0&&nDone(c)===l.length}
function stagesDone(){return STAGES.filter(function(s){return stageDone(s.id)}).length}
function state(){var s={};done.forEach(function(id){var g=byId(id);if(g)g.out.forEach(function(o){s[o]=1})});return s}
function missing(g,s){return g.req.filter(function(r){return !s[r]})}
function producer(c){
  var m=GUIDES.filter(function(g){return g.out.indexOf(c)>=0});
  m.sort(function(a,b){return (b.core?1:0)-(a.core?1:0)}); return m[0];
}
function nextStage(){
  for(var i=0;i<STAGES.length;i++) if(!stageDone(STAGES[i].id)) return STAGES[i];
  return null;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* ── 측정 : GA4 가 없으면 조용히 넘어갑니다 ── */
function ev(name,p){ try{ if(window.gtag) gtag('event',name,p||{}); }catch(e){} }
function stageOf(c){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].id===c) return STAGES[i]; return null; }

function boom(big){
  try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  var c=document.createElement('canvas');c.id='cf';document.body.appendChild(c);
  var x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  var col=['#0d8a4f','#0a6d3e','#0e3a27','#c9a227','#8fe8bd'],P=[],N=big?170:95;
  for(var i=0;i<N;i++)P.push({x:W/2+(Math.random()-.5)*W*.45,y:H*.4+(Math.random()-.5)*60,
    vx:(Math.random()-.5)*(big?13:10),vy:Math.random()*(big?-15:-12)-3,w:3+Math.random()*5,h:6+Math.random()*8,
    r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:col[i%col.length],a:1});
  var t0=Date.now();
  (function f(){var el=Date.now()-t0;x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];p.vy+=.34;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx*=.995;
      if(el>1500)p.a-=.018;
      x.save();x.globalAlpha=Math.max(0,p.a);x.translate(p.x,p.y);x.rotate(p.r);
      x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(el<2600)requestAnimationFrame(f);else c.remove()})();
}

var tab='start';
function pick(id){
  var st=stageOf(id);
  ev('stage_open',{stage:id, stage_name:st?st.big:id, step:st?('STEP '+st.no):''});
  tab=id; render();
}
function placePanel(){
  var panel=document.getElementById('panel'),lp=document.getElementById('loop'),
      host=document.getElementById('ghost'),sec=document.getElementById('guides');
  if(!panel)return;
  if(innerWidth<=640){
    var a=lp.querySelector('.lp2.on');
    if(a&&a.nextElementSibling!==panel)a.insertAdjacentElement('afterend',panel);
    sec.classList.add('hide');
  }else{
    if(panel.parentElement!==host)host.appendChild(panel);
    sec.classList.remove('hide');
  }
}
function moveNotch(){
  var n=document.getElementById('notch'),a=document.querySelector('.lp2.on'),

    b.onclick=function(){pick(st.id)};
    lp.appendChild(b);
  });

  /* ── 독려 줄 ── */
  var cur=STAGES.filter(function(x){return x.id===tab})[0];
  var tot=inStage(tab).length, dn=nDone(tab), rem=tot-dn;
  var nu=document.getElementById('nudge');
  nu.className='nudge c-'+tab+(rem===0&&tot>0?' done':'');
  var say, go='';
  if(tot===0) say='이 단계의 가이드는 준비 중입니다.';
  else if(rem===0){
    say='<b>STEP '+cur.no+' 완료!</b>';
    if(nx) go='<button class="go" onclick="pick(\''+nx.id+'\')">다음 · '+nx.big+' <i>→</i></button>';
  }
  else if(dn===0) say='가이드 '+tot+'편이면 이 단계가 끝납니다.';
  else if(rem===1) say='<b>한 편만 더</b> 보면 STEP '+cur.no+' 완료입니다.';
  else say=dn+' / '+tot+' 진행 중 · <b>'+rem+'편</b> 남았습니다.';
  nu.innerHTML='<span class="lb"><i></i><u class="num">STEP '+cur.no+'</u>'+cur.big+'</span>'+
    '<span class="say">'+say+'</span>'+go;

  /* ── 카드 ── */
  var list=GUIDES.filter(function(g){return g.cat===tab});
  list.sort(function(a,b){return (missing(a,s).length?1:0)-(missing(b,s).length?1:0)});
  var lw=document.getElementById('list');lw.innerHTML='';
  if(!list.length)lw.innerHTML='<div class="gc" style="opacity:.6">준비 중입니다.</div>';

  list.forEach(function(g,idx){
    var miss=missing(g,s),d=isDone(g.id),soon=!live(g);
    var a=document.createElement('a');
    a.className='gc c-'+g.cat+(d?' ok':'')+(soon?' soon':'');
    a.href=soon?'#guides':g.url;
    a.onclick=function(e){ e.preventDefault(); if(soon)return; openGuide(g); };
    var pd=miss.length?producer(miss[0]):null;
    var pre=miss.length?'먼저 <b>'+esc(pd?(pd.s||pd.t):COND[miss[0]])+'</b>':'';
    a.innerHTML=
      '<button class="idx num" title="'+(d?'완료 취소':'완료로 표시')+'">'+(d?'✓':(idx+1))+'</button>'+
      '<span class="body"><span class="ttl">'+esc(g.t)+'</span>'+
      '<span class="d">'+esc(g.d)+'</span></span>'+
      '<span class="rt">'+
        (soon?'<span class="pre">준비 중</span>':(pre?'<span class="pre">'+pre+'</span>':''))+
        '<span class="tm num">'+g.min+'</span><span class="ar">→</span></span>';
    if(!soon){
      a.querySelector('.idx').onclick=function(e){
        e.preventDefault();e.stopPropagation();toggle(g.id)};
    }
    a.classList.add('in'); a.style.animationDelay=(idx*45)+'ms';
    a.addEventListener('animationend',function(){a.classList.remove('in');a.style.animationDelay=''});
    lw.appendChild(a);

  /* ── 축하 : 단계마다 한 번, 전체 완료에 한 번 ── */
  STAGES.forEach(function(st){

      ev('stage_done',{stage:st.id, stage_name:st.big, step:'STEP '+st.no});
      setTimeout(function(){boom(false)},240); }
  });
  if(all&&party.indexOf('ALL')<0){ party.push('ALL'); save();
    ev('all_done',{guides_done:done.length});
    setTimeout(function(){ boom(true); openDone(); },420); }

  placePanel();
  requestAnimationFrame(moveNotch);
}

];
var TV=document.getElementById('tour'), TSP=document.getElementById('tspot'),
    TTP=document.getElementById('ttip'), ti=0;
function tourEl(k){
  var s=TOUR[k];
  return document.querySelector((innerWidth<=640&&s.elm)?s.elm:s.el);
}
/* 강조 상자는 현재 화면 기준이라 스크롤이 생기면 바로 다시 계산합니다 */
function tplace(k){
  var s=TOUR[k], el=tourEl(k);
  if(!el)return;
  {
    var r=el.getBoundingClientRect(), pad=10;
    TSP.style.cssText='left:'+(r.left-pad)+'px;top:'+(r.top-pad)+'px;'+
      'width:'+(r.width+pad*2)+'px;height:'+(r.height+pad*2)+'px';
    document.getElementById('tn').textContent=(k+1)+' / '+TOUR.length;
    var dots=document.getElementById('tdots');
    if(dots.children.length!==TOUR.length){
      dots.innerHTML=''; TOUR.forEach(function(_,n){ var d=document.createElement('i');
        d.title=(n+1)+'단계'; d.onclick=function(){ti=n;tourAt(n)}; dots.appendChild(d); });
    }
    [].forEach.call(dots.children,function(d,n){d.className=(n===k?'on':'')});
    document.getElementById('tpv').className='pv'+(k===0?' off':'');
    document.getElementById('tt').textContent=s.t;
    document.getElementById('td').textContent=s.d;
    document.getElementById('tnx').textContent=(k===TOUR.length-1)?'시작하기':'다음';
    var tw=TTP.offsetWidth||330, th=TTP.offsetHeight||190;
    var below=r.bottom+pad+14, above=r.top-pad-14-th, top;
    if(below+th<=innerHeight-12) top=below;
    else if(above>=12) top=above;
    else top=((r.top+r.height/2)<innerHeight/2)?(innerHeight-th-16):16;
    var left=Math.min(Math.max(12,r.left+r.width/2-tw/2), innerWidth-tw-12);
    TTP.style.left=left+'px'; TTP.style.top=top+'px';
  }
}
function tourAt(k){
  var el=tourEl(k);
  if(!el){ tourEnd(); return; }
  el.scrollIntoView({behavior:'smooth',block:'center'});
  tplace(k); setTimeout(function(){tplace(k)},380);
}
/* 둘러보기 중에는 뒤 화면이 움직이지 않게 막습니다 */
function tstop(e){ e.preventDefault(); }
function tkey(e){
  if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key)>=0)e.preventDefault();
  if(e.key==='ArrowRight'){e.preventDefault();document.getElementById('tnx').click()}
  if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('tpv').click()}
}
function tourStart(){ ti=0; ev('tour_start',{}); TV.classList.add('on'); TV.setAttribute('aria-hidden','false');
  TV.addEventListener('wheel',tstop,{passive:false});
  TV.addEventListener('touchmove',tstop,{passive:false});
  addEventListener('keydown',tkey,{passive:false});
  tourAt(0); setTimeout(function(){document.getElementById('tnx').focus()},420); }
function tourEnd(){ TV.classList.remove('on'); TV.setAttribute('aria-hidden','true');
  TV.removeEventListener('wheel',tstop); TV.removeEventListener('touchmove',tstop);
  removeEventListener('keydown',tkey);
  /* 체크했을 때만 다음부터 감춥니다 */
  var off=document.getElementById('tno').checked;
  ev('tour_end',{last_step:Math.min(ti+1,TOUR.length), total_steps:TOUR.length,
                 finished:(ti>=TOUR.length)?'끝까지':'중간에 닫음',
                 never_again:off?'다시 안 봄':'다음에도 봄'});

(function(){ var off=false; try{off=localStorage.getItem('mhl_tour_off')==='1'}catch(e){}
  if(!off)setTimeout(tourStart,900); })();

/* ── 배경음악 : 기본은 꺼짐, 켠 상태만 기억합니다 ── */
var BGM=document.getElementById('bgm'), MB=document.getElementById('mbtn'),
    MT=document.getElementById('mtxt'), VOL=.16, want=false, fadeT=null, duck=false;
try{ want=localStorage.getItem('mhl_bgm')==='1' }catch(e){}
function fade(to,ms,after){
  clearInterval(fadeT); var from=BGM.volume, t0=Date.now();
  fadeT=setInterval(function(){
    var k=Math.min(1,(Date.now()-t0)/ms);
    BGM.volume=Math.max(0,Math.min(1,from+(to-from)*k));
    if(k>=1){clearInterval(fadeT); if(after)after();}
  },40);
}
function paint(){
  MB.classList.toggle('on',want&&!BGM.paused);
  MB.setAttribute('aria-pressed',want?'true':'false');
  MT.textContent=want?'음악 끄기':'음악 켜기';
}
function playBgm(){
  if(duck)return;
  BGM.volume=0;
  var pr=BGM.play();
  if(pr&&pr.catch)pr.catch(function(){});
  fade(VOL,1400); setTimeout(paint,60);
}
function stopBgm(){ fade(0,600,function(){BGM.pause()}); setTimeout(paint,60); }
/* 파일을 못 찾으면 버튼을 숨겨서 눌러도 반응 없는 상황을 없앱니다 */
BGM.addEventListener('error',function(){
  MB.classList.remove('show'); want=false;
  try{localStorage.setItem('mhl_bgm','0')}catch(e){}
});
MB.onclick=function(){
  want=!want; ev('bgm_toggle',{state:want?'켜기':'끄기'});
  try{localStorage.setItem('mhl_bgm',want?'1':'0')}catch(e){}
  if(want)playBgm(); else stopBgm();
  paint();
};
/* 켜둔 채로 다시 들어오면, 브라우저 규칙상 첫 클릭 뒤에 이어집니다 */
if(want){
  var once=function(){ document.removeEventListener('click',once);
    document.removeEventListener('keydown',once); if(want)playBgm(); };
  document.addEventListener('click',once); document.addEventListener('keydown',once);
}
/* 가이드를 여는 동안에는 음성 설명과 겹치지 않게 잠시 멈춥니다 */
function duckBgm(on){
  duck=on;
  if(on){ if(!BGM.paused)fade(0,300,function(){BGM.pause()}); }
  else if(want){ playBgm(); }
  setTimeout(paint,60);
}
/* 파일이 있을 때만 버튼을 보여줍니다 */
(function(){
  if(location.protocol==='file:'){ MB.classList.add('show'); paint(); return; }
  fetch('bgm.mp3',{method:'HEAD',cache:'no-store'})
    .then(function(r){ if(r.ok){MB.classList.add('show');paint()} })
    .catch(function(){});
})();

 },

var TAG={
 login:'한 번 로그인하면 <b>PC·태블릿·폰</b> 어디서든 이어집니다',
 roster:'한 번 등록하면 <b>숙제도 채점도 이름만</b> 누르면 됩니다',
 twin:'쓰던 교재 그대로, <b>같은 유형 문제</b>를 얼마든지',
 level:'학생마다 <b>다른 난이도</b>로 한 번에 배포',
 wrong:'틀린 것만 모아 <b>오답 재시험지</b>가 자동으로',
 grade:'채점만 끝내면 <b>닮은 문제</b>가 저절로 만들어집니다',
 diag:'상담 온 학생 수준을 <b>10분 만에</b> 확인',
 report:'상담 자료를 <b>카톡으로 바로</b> 보냅니다'
};

var introT=null;
function playIntro(g, st, after){
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches }catch(e){}
  if(reduce || !g.fx || !FX[g.fx] || seenIntro[g.id]){ after(); return; }
  seenIntro[g.id]=1;
  try{ localStorage.setItem('mhl_intro',JSON.stringify(seenIntro)) }catch(e){}

  var box=document.querySelector('.vwbox');
  var d=document.createElement('div');
  d.id='intro';
  d.style.setProperty('--cd', st?st.c:'#0d8a4f');
  d.innerHTML='<div class="ibar"><u></u></div>'+
    '<div class="ihd"><span class="istep num">STEP '+(st?st.no:'')+'</span><b>'+esc(g.t)+'</b></div>'+
    '<div class="istage">'+FX[g.fx]()+'</div>'+
    '<div class="itag">'+(TAG[g.fx]||'')+'</div>'+
    '<button class="iskip">건너뛰기 →</button>';
  box.appendChild(d);
  ev('intro_view',{guide_id:g.id, guide_name:g.t, stage:g.cat});

  var t0=Date.now(), done=false;
  function end(skipped){
    if(done)return; done=true;
    clearTimeout(introT);
    if(skipped) ev('intro_skip',{guide_id:g.id, guide_name:g.t,
                                 seconds:Math.round((Date.now()-t0)/10)/100});
    d.className='out';
    setTimeout(function(){ if(d.parentNode)d.remove(); },280);
    after();
  }
  d.querySelector('.iskip').onclick=function(e){ e.stopPropagation(); end(true); };
  d.onclick=function(){ end(true); };
  introT=setTimeout(function(){ end(false); },3000);
}
function killIntro(){
  clearTimeout(introT);
  var d=document.getElementById('intro'); if(d)d.remove();
}

/* ── 완주 축하 팝업 ── */
var dn=document.getElementById('done');
function openDone(){ dn.classList.add('on'); dn.setAttribute('aria-hidden','false');
  document.body.classList.add('lock'); document.getElementById('dx').focus(); }
function closeDone(){ dn.classList.remove('on'); dn.setAttribute('aria-hidden','true');
  document.body.classList.remove('lock'); }
document.getElementById('dx').onclick=closeDone;
dn.addEventListener('click',function(e){ if(e.target===dn)closeDone() });
document.querySelector('.dbox .p').addEventListener('click',closeDone);

/* ── 가이드 뷰어 ── */
var vw=document.getElementById('vw'),vwf=document.getElementById('vwf'),lastY=0,openId=null;
var openAt=0, openFin=false;   /* 가이드를 연 시각 · 끝까지 봤는지 */
function openGuide(g){
  var st=STAGES.filter(function(x){return x.id===g.cat})[0];
  document.getElementById('vwbar').style.setProperty('--cd',st?st.c:'#0d8a4f');
  document.getElementById('vwn').textContent='STEP '+(st?st.no:'');
  document.getElementById('vwt').textContent=g.t;
  document.getElementById('vwo').href=g.url;
  lastY=scrollY; openId=g.id; duckBgm(true);
  openAt=Date.now(); openFin=false;
  ev('guide_open',{guide_id:g.id, guide_name:g.t, stage:g.cat,
                   step:st?('STEP '+st.no):'', repeat:isDone(g.id)?'재시청':'처음'});
  vw.classList.add('on'); vw.setAttribute('aria-hidden','false');
  document.body.classList.add('lock');
  document.getElementById('vwx').focus();
  /* 결과물을 먼저 보여준 뒤 가이드를 띄운다 */
  playIntro(g, st, function(){ vwf.src=g.url; });
}
function closeGuide(){
  if(!vw.classList.contains('on'))return;
  vw.classList.remove('on'); vw.setAttribute('aria-hidden','true');
  killIntro(); vwf.src='about:blank'; document.body.classList.remove('lock'); duckBgm(false);
  if(openId){
    var g=byId(openId);
    ev('guide_close',{guide_id:openId, guide_name:g?g.t:'', stage:g?g.cat:'',
                      seconds:Math.round((Date.now()-openAt)/1000),
                      finished:openFin?'완주':'중간이탈'});
    mark(openId); openId=null;
  }
  scrollTo(0,lastY);
}
document.getElementById('vwx').onclick=closeGuide;
vw.addEventListener('click',function(e){ if(e.target===vw)closeGuide() });
function onEsc(e){ if(e.key==='Escape'){closeGuide();closeDone()} }
addEventListener('keydown',onEsc);
vwf.addEventListener('load',function(){
  try{ vwf.contentDocument.addEventListener('keydown',onEsc) }catch(err){}
});
addEventListener('message',function(e){
  if(e&&e.data&&e.data.matholic==='done'&&openId){
    if(!openFin){
      openFin=true;
      var g=byId(openId);
      ev('guide_finish',{guide_id:openId, guide_name:g?g.t:'', stage:g?g.cat:'',
                         seconds:Math.round((Date.now()-openAt)/1000)});
    }
    mark(openId);
  }
});

document.getElementById('reset').onclick=function(){
  if(confirm('완료 표시를 모두 지울까요?')){
    ev('reset_progress',{guides_done:done.length});
    seenIntro={}; try{localStorage.removeItem('mhl_intro')}catch(e){}
    done=[];party=[];save();render()}};

/* 매쓰홀릭으로 넘어간 사람 = 이 가이드의 진짜 성과 */
[].forEach.call(document.querySelectorAll('a[href*="matholic.com"]'),function(a){
  a.addEventListener('click',function(){
    ev('open_app',{place: a.closest('#done') ? '완주 팝업' : '상단 버튼',
                   stages_done: stagesDone(), guides_done: done.length});
  });
});
addEventListener('scroll',function(){
  document.getElementById('hd').classList.toggle('stuck',scrollY>8)});
render();
probe();
</script>
