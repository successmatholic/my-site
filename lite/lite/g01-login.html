/* 작성자가 음성을 의도한 경우(문장을 직접 넣거나 녹음을 올린 경우)에만 시작 안내를 띄운다 */
function wantsVoice(){ return D.scenes.some(function(s){return s.audio||(s.say&&s.say.trim())}); }
function setSpk(on){ if(on)O.classList.add('spk'); else O.classList.remove('spk'); }
function stopAll(){
 spoke=-1;
 try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
 try{ AU.pause(); AU.currentTime=0; }catch(e){}
 setSpk(0);
}
var spoke=-1;
function speak(force){
 var s=D.scenes[i];
 /* 창 크기 변경 등으로 다시 그릴 때 같은 장면 음성을 처음부터 재생하지 않도록 */
 if(!force && spoke===i) return;
 stopAll();
 if(!voiceOn||muted||!started) return;
 spoke=i;
 if(s.audio){
  AU.src=s.audio; AU.playbackRate=RATE;
  AU.onplaying=function(){setSpk(1)}; AU.onended=AU.onerror=function(){setSpk(0)};
  AU.play().catch(function(){}); return;
 }
 var t=sayText(s);
 if(!t||!window.speechSynthesis) return;
 var u=new SpeechSynthesisUtterance(t);
 u.lang='ko-KR'; u.rate=RATE; var v=koVoice(); if(v)u.voice=v;
 u.onstart=function(){setSpk(1)}; u.onend=function(){setSpk(0)}; u.onerror=function(){setSpk(0)};
 speechSynthesis.speak(u);
}

/* 이 장면에서 강조할 영역(박스 전체를 감싸는 범위) */
function span(s){
 if(!s.boxes.length) return null;
 var x1=100,y1=100,x2=0,y2=0;
 s.boxes.forEach(function(b){
  x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h);
 });
 return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}

/* 보이는 틀 크기 · 이미지 배율 · 이동량 계산 */
function geom(){
 var s=D.scenes[i];
 var cs=getComputedStyle(M),pad=parseFloat(cs.paddingLeft)*2;
 var W=Math.max(60,M.clientWidth-pad), H=Math.max(60,M.clientHeight-pad);
 var ar=(s.w||16)/(s.h||9);
 var dw=Math.min(W,H*ar), dh=dw/ar;          /* 확대 없이 전체가 들어오는 크기 */
 var sk=s.zk, k=(sk==='off')?0:(sk?+sk:ZK);
 var r=(zoom&&k)?span(s):null, z=1;
 if(r){
  /* 기준은 "원본 캡쳐의 몇 %로 보여줄지". k=1 이면 캡쳐를 찍었을 때의 실제 크기(1:1) */
  z=(s.w||dw)*k/dw;
  /* 강조 영역이 화면을 꽉 채워 넘칠 만큼은 확대하지 않음 */
  z=Math.min(z, Math.max(1,Math.min(W*.8/Math.max(4,r.w/100*dw), H*.8/Math.max(4,r.h/100*dh))));
  z=Math.max(1,Math.min(z,8));
 }
 var fw=dw*z, fh=dh*z;
 var vw=Math.min(W,Math.round(fw)), vh=Math.min(H,Math.round(fh));
 var tx,ty;
 if(fw<=vw+.5) tx=(vw-fw)/2;
 else { var cx=(r?(r.x+r.w/2)/100:.5)*fw; tx=Math.max(vw-fw,Math.min(0,vw/2-cx)); }
 if(fh<=vh+.5) ty=(vh-fh)/2;
 else { var cy=(r?(r.y+r.h/2)/100:.5)*fh; ty=Math.max(vh-fh,Math.min(0,vh/2-cy)); }
 return {vw:vw,vh:vh,fw:fw,fh:fh,tx:tx,ty:ty,z:z};
}
function fit(){
 var g=geom();
 VP.style.width=g.vw+'px'; VP.style.height=g.vh+'px';
 F.style.width=g.fw+'px'; F.style.left=g.tx+'px'; F.style.top=g.ty+'px';
 return g;
}
function tgt(b){
 if(b.next==='end')return -1;
 if(b.next==='auto')return i+1<D.scenes.length?i+1:-1;
 var k=D.ids.indexOf(b.next);return k<0?-1:k;
}
/* ── 시청 기록 (프리미엄 튜토리얼 기록 시트와 같은 주소·형식, 프로젝트=라이트) ── */
var SHEET_URL='https://script.google.com/macros/s/AKfycbzKairTvQfURGkhftGkjbhrZ_8EQ4Xu7rodBu3AODciYW8IYRgpGjOAWtcelmL0c8Jm/exec';
var LT=(function(){
 var SID=(function(){ try{ var k='mh_sid',v=sessionStorage.getItem(k);
   if(!v){ v=Date.now().toString(36)+Math.random().toString(36).slice(2,10); sessionStorage.setItem(k,v); } return v;
  }catch(e){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); } })();
 var t0=Date.now(), best=-1, sent=-1, done=false, opened=false;
 var Q=(function(){ var p={get:function(){return null;}}; try{ p=new URLSearchParams(location.search); }catch(e){}
  var fr=false; try{ fr=window.self!==window.top; }catch(e){ fr=true; }
  var rf=''; try{ rf=document.referrer?new URL(document.referrer).hostname:''; }catch(e){}
  var ts=p.get('test');
  return {src:p.get('utm_source')||p.get('from')||'', content:p.get('utm_content')||'', medium:p.get('utm_medium')||'', campaign:p.get('utm_campaign')||'',
   embed:fr?1:0, ref:rf, test:(ts==='1'||ts==='true')?1:0}; })();
 var SLUG=(location.pathname.split('/').filter(Boolean).pop()||'').replace(/\.html?$/,'');
 var live=!!SHEET_URL && /^https?:$/.test(location.protocol);
 function body(k,fin){
  var s=D.scenes[k]||{};
  return JSON.stringify({tutorial:'[라이트] '+(D.title||document.title||''), sid:SID, reach:k+1, total:D.scenes.length,
   done:fin?1:0, sceneName:(s.cap||s.headline||s.name||('장면 '+(k+1))), secs:Math.round((Date.now()-t0)/1000),
   src:Q.src, content:Q.content, med:Q.medium, cmp:Q.campaign, embed:Q.embed, ref:Q.ref, test:Q.test,
   slug:SLUG, project:'라이트'});
 }
 function send(b,leaving){
  if(!live) return;
  if(leaving&&navigator.sendBeacon){ try{ if(navigator.sendBeacon(SHEET_URL,new Blob([b],{type:'text/plain;charset=utf-8'}))) return; }catch(e){} }
  try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:b}).catch(function(){}); }catch(e){}
 }
 var T={
  step:function(k){ if(k>best) best=k; if(!opened){ opened=true; sent=best; send(body(best,false)); } },
  finish:function(){ if(done) return; done=true; best=sent=D.scenes.length-1; send(body(best,true)); },
  leave:function(){ if(done||best<=sent) return; sent=best; send(body(best,false),true); }
 };
 document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') T.leave(); });
 window.addEventListener('pagehide',function(){ T.leave(); });
 return T;
})();
function go(n,push){ if(push)H.push(i); i=n; draw(); }
function draw(){
 var s=D.scenes[i];
 try{LT.step(i);}catch(e){}
 I.src=s.src;
 document.getElementById('cap').textContent=s.cap||'';
 document.getElementById('bk').disabled=!H.length;
 var pg=document.getElementById('pg'),h='';
 for(var k=0;k<D.scenes.length;k++)h+='<i class="'+(k===i?'on':'')+'"></i>';
 pg.innerHTML=h;
 document.getElementById('st').textContent=(i+1)+' / '+D.scenes.length;
 var g=fit();
 O.innerHTML='';
 s.boxes.forEach(function(b,n){
  var d=document.createElement('div');
  d.className='hl';
  d.style.cssText='left:'+b.x+'%;top:'+b.y+'%;width:'+b.w+'%;height:'+b.h+'%;'+
   '--c:'+b.color+';--g:'+rgba(b.color,.55)+';--f:'+rgba(b.color,.13)+';--f2:'+rgba(b.color,.26);
  d.title=b.text||'클릭';
  d.onclick=function(){var t=tgt(b); if(t<0){fin();}else{go(t,1);}};
  O.appendChild(d);
  if(b.text){
   var p=document.createElement('div');p.className='tip';p.style.setProperty('--c',b.color);
   p.innerHTML='<b>STEP '+(i+1)+(s.boxes.length>1?'-'+(n+1):'')+
     '<span class="sp">🔊</span></b>'+b.text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
   p.onclick=function(ev){ev.stopPropagation();started=true;muted=false;sync();speak(1);};
   O.appendChild(p);place(p,b,g);
  }
 });
 sync(); speak();
}
function sync(){
 var c = window.innerWidth<820;   /* 노션 임베드처럼 좁을 때는 아이콘만 */
 sb.style.display = (voiceOn&&hasVoice())?'':'none';
 sb.textContent = muted?'🔇':(c?'🔊':(started?'🔊 소리 켜짐':'🔊 소리로 듣기'));
 sb.title = muted?'소리 켜기':'소리 끄기 / 다시 듣기';
 zb.textContent = c?(zoom?'🔍':'🔎'):(zoom?'🔍 전체 보기':'🔍 확대 보기');
 document.getElementById('bk').textContent = c?'←':'← 이전';
 document.getElementById('hm').textContent = c?'↻':'↻ 처음부터';
}
function rgba(h,a){var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#ff3b30');
 return m?'rgba('+parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16)+','+a+')':'rgba(255,59,48,'+a+')';}
/* 말풍선 위치. 좌표는 이미지(확대된 크기) 기준이며 보이는 영역 안으로 가둔다 */
function place(p,b,g){
 var pw=p.offsetWidth,ph=p.offsetHeight,gap=13;
 var bx=b.x/100*g.fw,by=b.y/100*g.fh,bw=b.w/100*g.fw,bh=b.h/100*g.fh;
 var vL=-g.tx, vT=-g.ty, vR=vL+g.vw, vB=vT+g.vh;   /* 보이는 창(이미지 좌표계) */
 var pos=b.pos&&b.pos!=='auto'?b.pos:
   (by-vT>ph+gap+8?'top':(by+bh+ph+gap<vB?'bottom':(bx-vL>pw+gap?'left':'right')));
 var L,T,cls;
 if(pos==='top'){T=by-ph-gap;L=bx+bw/2-pw/2;cls='tp';}
 else if(pos==='bottom'){T=by+bh+gap;L=bx+bw/2-pw/2;cls='bt';}
 else if(pos==='left'){L=bx-pw-gap;T=by+bh/2-ph/2;cls='lf';}
 else{L=bx+bw+gap;T=by+bh/2-ph/2;cls='rt';}
 var L2=Math.max(vL+6,Math.min(vR-pw-6,L));
 if(cls==='tp'||cls==='bt')p.style.setProperty('--ax',(bx+bw/2-L2)+'px');
 T=Math.max(vT+6,Math.min(vB-ph-6,T));
 p.className='tip '+cls;p.style.left=L2+'px';p.style.top=T+'px';
}
var NEXT={href:'g02-student.html',label:'다음 편: 학생을 등록하고 싶어요 →'}, NEXT_N=1;
function fin(){
 try{LT.finish();}catch(e){}
 var d=document.createElement('div');d.id='fin';
 d.innerHTML='<div class="e">🎉</div><h2>따라하기를 완료했어요!</h2>'+
  '<p>수고하셨어요. 다시 보고 싶으면 아래 버튼을 눌러주세요.</p>'+
  '<div class="fbt"><button id="rs">처음부터 다시 보기</button>'+
  (NEXT?'<button id="nx">'+NEXT.label+'</button>':'')+'</div>'+
  '<div class="fpg">8편 중 '+NEXT_N+'편 완료</div>';
 VP.appendChild(d);
 if(NEXT)document.getElementById('nx').onclick=function(){ location.href=NEXT.href; };
 try{ if(window.parent&&window.parent!==window)
        window.parent.postMessage({matholic:'done'},'*'); }catch(e){}
 document.getElementById('rs').onclick=function(){d.remove();H=[];go(0);};
}
document.getElementById('bk').onclick=function(){if(H.length){var f=document.getElementById('fin');if(f)f.remove();i=H.pop();draw();}};
document.getElementById('hm').onclick=function(){var f=document.getElementById('fin');if(f)f.remove();H=[];go(0);};
var zb=document.getElementById('zb'), sb=document.getElementById('sb');
zb.onclick=function(){ zoom=!zoom; draw(); };
I.addEventListener('dblclick',function(){ zoom=!zoom; draw(); });
sb.onclick=function(){
 muted=!muted; started=true; sync();
 if(muted) stopAll(); else speak(1);
};
/* 예상 소요 시간 — 장면 수와 설명 길이로 자동 계산 */
function est(){
 var t=0;
 D.scenes.forEach(function(s){ t += 5 + (sayText(s)||'').length/6.5; });
 var lo=Math.max(1,Math.round(t/60*.85)), hi=Math.max(lo+1,Math.round(t/60*1.3));
 return lo+'~'+hi;
}
function isMobile(){
 try{ if(window.matchMedia('(pointer:coarse)').matches) return true; }catch(e){}
 return Math.min(window.innerWidth,window.screen?screen.width:9999)<820;
}
/* 시작 화면. 시작 버튼 클릭이 브라우저의 자동재생 제한도 함께 풀어준다 */
function intro(){
 if(D.start===false){ started=true; return; }
 var v=voiceOn&&wantsVoice(), snd=true, mob=isMobile();
 var d=document.createElement('div'); d.id='go';
 var ask=D.ask!==false;
 d.innerHTML='<div class="e">📘</div><h2>'+D.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</h2>'+
  (D.intro?'<p>'+D.intro.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p>':'')+
  '<div class="meta"><span>총 <b>'+D.scenes.length+'단계</b></span><i></i>'+
  '<span>예상 소요 시간 <b>약 '+est()+'분</b></span>'+
  (v?'<i></i><span>🔊 음성 설명 있음</span>':'')+'</div>'+
  (ask
   ? '<div class="devs">'+
     '<button class="dev" id="dPc"><span class="i">💻</span><b>PC로 보기</b>'+
     '<em>원본 크기 그대로<br>넓게 봅니다</em>'+(mob?'':'<u>추천</u>')+'</button>'+
     '<button class="dev" id="dMo"><span class="i">📱</span><b>모바일로 보기</b>'+
     '<em>눌러야 할 버튼을<br>확대해서 봅니다</em>'+(mob?'<u>추천</u>':'')+'</button></div>'
   : '<div class="bs"><button id="dGo">시작하기</button></div>')+
  (v?'<button class="chip on" id="vc">🔊 음성 설명 켜짐</button>':'');
 VP.appendChild(d);

 if(v){
  var vc=document.getElementById('vc');
  vc.onclick=function(){
   snd=!snd; vc.className='chip'+(snd?' on':'');
   vc.textContent=snd?'🔊 음성 설명 켜짐':'🔇 음성 설명 꺼짐';
  };
 }
 function begin(zm){
  d.remove(); zoom=zm; started=true; muted=!snd;
  draw();
 }
 if(ask){
  document.getElementById('dPc').onclick=function(){ begin(false); };
  document.getElementById('dMo').onclick=function(){ begin(true); };
 }else{
  document.getElementById('dGo').onclick=function(){ begin(zoom); };
 }
}
window.addEventListener('resize',function(){setTimeout(draw,60)});
I.onload=function(){
 var g=fit(),s=D.scenes[i],bs=s.boxes.filter(function(b){return b.text});
 [].forEach.call(O.querySelectorAll('.tip'),function(p,n){place(p,bs[n],g);});
};
draw(); intro();
</script>
