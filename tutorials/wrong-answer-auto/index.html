<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오답 관리하기(자동 오답유사)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f4f8fd;color:#16233a;display:flex;flex-direction:column;
 font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
 letter-spacing:-.011em;word-break:keep-all}
header{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#fff;
 border-bottom:1px solid #e4eaf6;flex:none;flex-wrap:wrap}
header .t{font-weight:700;font-size:15px;letter-spacing:-.03em}
header .c{color:#7c8aa6;font-size:12.5px;flex:1;min-width:120px}
header button{font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;
 background:#fff;color:#46536b;border:1px solid #dbe3f0;transition:.15s}
header button:hover{background:#eaf1fd;border-color:#b8cdf2;color:#1d4ed8}
.pg{display:flex;gap:5px;align-items:center}
.pg i{width:7px;height:7px;border-radius:50%;background:#dbe3f0;display:block;transition:.2s}
.pg i.on{background:#3461ee;width:20px;border-radius:4px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0;overflow:hidden}
#vp{position:relative;overflow:hidden;border-radius:10px;background:#fff;
 border:1px solid #dbe3f0;box-shadow:0 18px 44px rgba(31,64,143,.12)}
#f{position:absolute;left:0;top:0;line-height:0;
 transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),width .5s cubic-bezier(.4,0,.2,1)}
#f img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
#o{position:absolute;inset:0}
.hl{position:absolute;border:3px solid var(--c);border-radius:8px;box-sizing:border-box;cursor:pointer;
 background:var(--f);animation:bl 1.25s ease-in-out infinite}
.hl:after{content:"";position:absolute;inset:-7px;border:3px solid var(--c);border-radius:13px;
 animation:rg 1.6s ease-out infinite;pointer-events:none}
.hl:hover{animation:none;background:var(--f2);border-width:4px}
@keyframes bl{0%,100%{box-shadow:0 0 0 0 var(--g),0 0 16px 3px var(--g);opacity:1}
 50%{box-shadow:0 0 0 0 transparent,0 0 0 0 transparent;opacity:.62}}
@keyframes rg{0%{opacity:.85;transform:scale(.94)}70%{opacity:0;transform:scale(1.07)}100%{opacity:0}}
.tip{position:absolute;transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1);
 background:#10233f;color:#fff;border:1px solid rgba(255,255,255,.14);
 border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.5;max-width:280px;width:max-content;
 box-shadow:0 12px 30px rgba(15,35,80,.32);z-index:5;white-space:pre-wrap}
.tip b{color:#8fc7ff;display:block;font-size:11px;margin-bottom:3px;letter-spacing:.04em}
.tip:after{content:"";position:absolute;width:9px;height:9px;background:#10233f;
 border:1px solid rgba(255,255,255,.14);transform:rotate(45deg)}
.tip.bt:after{top:-5.5px;left:var(--ax,50%);margin-left:-5px;border-right:none;border-bottom:none}
.tip.tp:after{bottom:-5.5px;left:var(--ax,50%);margin-left:-5px;border-left:none;border-top:none}
.tip.lf:after{right:-5.5px;top:50%;margin-top:-5px;border-left:none;border-bottom:none}
.tip.rt:after{left:-5.5px;top:50%;margin-top:-5px;border-right:none;border-top:none}
#go{position:absolute;inset:0;background:rgba(244,248,253,.96);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:11px;z-index:22;backdrop-filter:blur(5px);text-align:center;padding:18px}
#go .brandLogo{height:26px;width:auto;object-fit:contain;margin-bottom:4px}
#go .e{font-size:34px;line-height:1}
#go h2{margin:0;font-size:23px;letter-spacing:-.02em;line-height:1.35;max-width:620px}
#go h3{margin:0;font-size:16px}
#go p{margin:0;color:#46536b;font-size:13px;line-height:1.65;max-width:520px}
#go .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
 color:#7c8aa6;font-size:12px}
#go .meta b{color:#16233a;font-weight:700}
#go .meta i{width:3px;height:3px;border-radius:50%;background:#c9d3ea}
#go .devs{display:flex;gap:11px;margin-top:9px;flex-wrap:wrap;justify-content:center}
#go .dev{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
 width:178px;padding:15px 12px 13px;border-radius:14px;border:1px solid #dbe3f0;background:#fff;
 color:#16233a;cursor:pointer;box-shadow:none;font-weight:400;transition:.16s}
#go .dev:hover{background:#eef4fe;border-color:#3461ee;transform:translateY(-2px);
 box-shadow:0 12px 26px rgba(31,64,143,.12)}
#go .dev .i{font-size:25px;line-height:1.1}
#go .dev b{font-size:14.5px}
#go .dev em{font-style:normal;font-size:11.5px;color:#7c8aa6;line-height:1.45}
#go .dev u{position:absolute;top:-8px;right:10px;text-decoration:none;background:#3461ee;color:#fff;
 font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
#go .chip{background:#fff;box-shadow:none;border:1px solid #dbe3f0;color:#46536b;font-size:12px;
 font-weight:600;padding:7px 14px;border-radius:20px;margin-top:2px;cursor:pointer}
#go .chip.on{border-color:#b8cdf2;color:#1d4ed8;background:#eaf1fd}
#go .bs{display:flex;gap:9px;margin-top:7px;flex-wrap:wrap;justify-content:center}
#go button{font:inherit;font-size:14px;font-weight:700;padding:12px 26px;border-radius:10px;border:none;
 background:#3461ee;color:#fff;cursor:pointer;box-shadow:0 8px 22px rgba(52,97,238,.28)}
#go button:hover{background:#1d4ed8}
#go button.g{background:#fff;color:#46536b;border:1px solid #dbe3f0;box-shadow:none;font-size:13px;padding:11px 18px}
@media(max-height:420px){#go{gap:7px;padding:10px}#go .e{display:none}#go h2{font-size:18px}
 #go p{font-size:12px}#go button{padding:9px 20px;font-size:13px}}
#o.spk .hl{animation:bl 2.4s ease-in-out infinite}
#o.spk .hl:after{animation:rg 2.4s ease-out infinite}
.tip{cursor:pointer}
.tip .sp{display:none}
#o.spk .tip .sp{display:inline-block;margin-left:5px}
#fin{position:absolute;inset:0;background:rgba(244,248,253,.95);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:14px;z-index:20;backdrop-filter:blur(3px);line-height:1.6}
#fin .e{font-size:46px}
#fin h2{margin:0;font-size:21px}
#fin p{margin:0;color:#46536b;font-size:13px}
#fin .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:520px}
#fin button{font:inherit;font-size:13px;font-weight:700;padding:10px 20px;border-radius:9px;border:none;
 background:#3461ee;color:#fff;cursor:pointer}
#fin button:hover{background:#1d4ed8}
#fin button.sec{background:#fff;color:#46536b;border:1px solid #dbe3f0;font-weight:600}
#fin button.sec:hover{background:#eef4fe;border-color:#b8cdf2;color:#1d4ed8}
@media(max-width:480px){#fin .row{flex-direction:column;width:100%;max-width:280px}
 #fin .row button{width:100%}}
#em{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:26px;z-index:15}
#em .ecardp{display:flex;flex-direction:column;align-items:center;gap:14px;border-radius:24px;
 padding:42px 36px;max-width:560px;border:2px solid transparent}
#em .ic{font-size:54px;line-height:1;animation:emPulse 1.8s ease-in-out infinite}
#em h2{margin:0;font-size:24px;color:#16233a;max-width:500px;line-height:1.4;letter-spacing:-.02em;white-space:pre-wrap}
#em p{margin:0;color:#3d4f68;font-size:16px;max-width:460px;line-height:1.7;white-space:pre-wrap}
#em button{font:inherit;font-size:14px;font-weight:700;padding:12px 26px;border-radius:10px;border:none;
 color:#fff;cursor:pointer}
#em button:hover{filter:brightness(1.08)}
#em .exsec{align-self:stretch;text-align:left;border-radius:14px;padding:15px 18px;border:1px solid var(--xc);
 background:linear-gradient(135deg,var(--xc2),rgba(255,255,255,.5))}
#em .exsec .xh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;
 color:var(--xc);margin-bottom:6px;letter-spacing:.01em}
#em .exsec p{margin:0;color:#233b31;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
#em .exsec.feat{--xc:#c07a08;--xc2:rgba(245,158,11,.18)}
#em .exsec.usage{--xc:#22c55e;--xc2:rgba(34,197,94,.18)}
@media(max-height:420px){#em .exsec{padding:10px 13px}#em .exsec p{font-size:12.5px}}
@keyframes emPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.pg i.em{background:#f5b73d}
.pg i.vid{background:#4f8cff}
@media(max-height:420px){#em .ecardp{gap:8px;padding:16px 20px}#em .ic{font-size:36px}#em h2{font-size:17px}
 #em p{font-size:13px}#em button{padding:9px 20px;font-size:13px}}
#vid{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
 gap:12px;padding:22px;z-index:15;background:#0b0c10}
#vid video{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:8px;background:#000}
#vid .vskip{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font:inherit;font-size:14px;
 font-weight:700;padding:12px 26px;border-radius:24px;border:none;background:#3461ee;
 color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(52,97,238,.5);animation:vskipPulse 2.2s ease-in-out infinite}
#vid .vskip:hover{background:#1d4ed8;animation:none}
#vidErrMsg{display:none;color:#e7ebf2;font-size:14px;line-height:1.7;text-align:center;
 background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:22px 26px}
@keyframes vskipPulse{0%,100%{box-shadow:0 8px 24px rgba(52,97,238,.5)}50%{box-shadow:0 8px 24px rgba(52,97,238,.5),0 0 0 8px rgba(52,97,238,.18)}}
@media(max-width:640px){#vid .vskip{font-size:12.5px;padding:9px 18px;bottom:16px}}
footer{flex:none;text-align:center;color:#7c8aa6;font-size:11.5px;padding:0 12px 10px}
@media(max-width:640px){.tip{max-width:200px;font-size:12.5px}}
@media(max-width:820px){
 header{gap:6px;padding:8px 10px}header .t{font-size:13px}
 header button{padding:5px 8px;font-size:11.5px}.pg{display:none}
}
@media(max-height:520px){
 header{padding:6px 12px;gap:8px}header .t{font-size:13px}header .c{font-size:11.5px}
 header button{padding:4px 9px;font-size:11.5px}footer{display:none}main{padding:8px}
}
</style>

   박스마다 자기만의 문장(b.say, 없으면 b.text)을 읽고, 장면 전체의 s.say는 박스가 없을 때만 쓰는 대체값이다.
   그래야 박스 여러 개의 음성 문구를 각각 다르게 설정해도 서로 영향을 주지 않는다 */
function sayText(s){
 if(s.type==='emph') return ((s.say&&s.say.trim())?s.say.trim():((s.headline||'')+'. '+(s.text||''))).trim();
 var ab=activeBoxes(s);
 if(ab.length){
  var t=ab.map(function(b){return (b.say&&b.say.trim())?b.say.trim():b.text;}).filter(Boolean).join('. ');
  if(t) return t;
 }
 return (s.say&&s.say.trim())?s.say.trim():'';
}
/* 장면 전체 내용(모든 박스 포함) — 소요 시간 계산·음성 유무 판단용, 순차 노출 상태와 무관 */
function allText(s){
 if(s.type==='emph') return ((s.say&&s.say.trim())?s.say.trim():((s.headline||'')+'. '+(s.text||''))).trim();
 var t=(s.boxes||[]).map(function(b){return (b.say&&b.say.trim())?b.say.trim():b.text;}).filter(Boolean).join('. ');
 return t || ((s.say&&s.say.trim())?s.say.trim():'');
}
function hasVoice(){ return D.scenes.some(function(s){return s.audio||allText(s)}); }
/* 작성자가 음성을 의도한 경우(문장을 직접 넣거나 녹음을 올린 경우)에만 시작 안내를 띄운다 */
function wantsVoice(){ return D.scenes.some(function(s){
  return s.audio||(s.say&&s.say.trim())||(s.boxes||[]).some(function(b){return b.say&&b.say.trim();});
}); }
function setSpk(on){ if(on)O.classList.add('spk'); else O.classList.remove('spk'); }
function stopAll(){
 spoke=null;
 try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
 try{ AU.pause(); AU.currentTime=0; }catch(e){}
 setSpk(0);
}
var spoke=null;
function speak(force){
 var s=D.scenes[i];
 /* 같은 장면·같은 박스로 다시 그릴 때(창 크기 변경 등) 음성을 처음부터 다시 재생하지 않도록.
    박스가 순차로 바뀌면(focusBox 변경) 새 문장을 읽도록 focusBox도 키에 포함시킨다 */
 var key=i+':'+(focusBox||'');
 if(!force && spoke===key) return;
 stopAll();
 if(!voiceOn||muted||!started) return;
 spoke=key;
 if(s.audio){
  AU.src=s.audio; AU.playbackRate=RATE;
  AU.onplaying=function(){setSpk(1)}; AU.onended=AU.onerror=function(){setSpk(0)};
  AU.play().catch(function(){}); return;
 }
 var t=sayText(s);
 if(!t||!window.speechSynthesis) return;
 var u=new SpeechSynthesisUtterance(t);
 u.lang='ko-KR'; u.rate=RATE; var v=koVoice(); if(v)u.voice=v;
 u.onstart=function(){setSpk(1)}; u.onend=function(){setSpk(0)}; u.onerror=function(){setSpk(0)};
 speechSynthesis.speak(u);
}

/* 이 장면에서 강조할 영역(현재 활성 박스들 전체를 감싸는 범위) */
function span(list){
 if(!list||!list.length) return null;
 var x1=100,y1=100,x2=0,y2=0;
 list.forEach(function(b){
  x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h);
 });
 return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
/* 이 장면에서 지금 실제로 보여줄 박스들.
   focusBox가 있으면 그 박스 하나만. 없더라도 박스가 2개 이상이면 첫 박스부터 순서대로 하나씩 보여준다 */
function activeBoxes(s){
 var bs=s.boxes||[];
 if(focusBox){ var one=bs.filter(function(b){return b.id===focusBox;}); if(one.length) return one; }
 if(bs.length>1) return bs.slice(0,1);
 return bs;
}
/* 전체 장면을 통틀어 특정 박스 id가 어느 장면의 몇 번째 박스인지 찾기 */
function boxLoc(id){
 for(var si=0;si<D.scenes.length;si++){
  var bs=D.scenes[si].boxes||[];
  for(var bj=0;bj<bs.length;bj++){ if(bs[bj].id===id) return {scene:si,box:bj}; }
 }
 return null;
}

/* 보이는 틀 크기 · 이미지 배율 · 이동량 계산 */
function geom(){
 var s=D.scenes[i];
 var cs=getComputedStyle(M),pad=parseFloat(cs.paddingLeft)*2;
 var W=Math.max(60,M.clientWidth-pad), H=Math.max(60,M.clientHeight-pad);
 var ar=(s.w||16)/(s.h||9);
 var dw=Math.min(W,H*ar), dh=dw/ar;          /* 확대 없이 전체가 들어오는 크기 */
 var sk=s.zk, k=(sk==='off')?0:(sk?+sk:ZK);
 var r=(zoom&&k)?span(activeBoxes(s)):null, z=1;
 if(r){
  /* 기준은 "원본 캡쳐의 몇 %로 보여줄지". k=1 이면 캡쳐를 찍었을 때의 실제 크기(1:1) */
  z=(s.w||dw)*k/dw;
  /* 강조 영역이 화면을 꽉 채워 넘칠 만큼은 확대하지 않음 */
  z=Math.min(z, Math.max(1,Math.min(W*.8/Math.max(4,r.w/100*dw), H*.8/Math.max(4,r.h/100*dh))));
  z=Math.max(1,Math.min(z,8));
 }
 var fw=dw*z, fh=dh*z;
 var vw=Math.min(W,Math.round(fw)), vh=Math.min(H,Math.round(fh));
 var tx,ty;
 if(fw<=vw+.5) tx=(vw-fw)/2;
 else { var cx=(r?(r.x+r.w/2)/100:.5)*fw; tx=Math.max(vw-fw,Math.min(0,vw/2-cx)); }
 if(fh<=vh+.5) ty=(vh-fh)/2;
 else { var cy=(r?(r.y+r.h/2)/100:.5)*fh; ty=Math.max(vh-fh,Math.min(0,vh/2-cy)); }
 return {vw:vw,vh:vh,fw:fw,fh:fh,tx:tx,ty:ty,z:z};
}
function fit(){
 var g=geom();
 VP.style.width=g.vw+'px'; VP.style.height=g.vh+'px';
 F.style.width=g.fw+'px'; F.style.left=g.tx+'px'; F.style.top=g.ty+'px';
 return g;
}
var focusBox=null; /* 다음 장면 진입 시 이 박스 하나만 보여줄지 (같은 화면 안 순차 강조용) */
function tgtOf(next){
 if(next==='end')return {scene:-1};
 if(!next||next==='auto')return {scene:(i+1<D.scenes.length?i+1:-1)};
 var k=D.ids.indexOf(next);
 if(k>=0) return {scene:k};
 var loc=boxLoc(next);
 if(loc) return {scene:loc.scene, focus:next};
 return {scene:-1};
}
function go(t,push){
 var scn=(typeof t==='object')?t.scene:t;
 var foc=(typeof t==='object')?(t.focus||null):null;
 if(push)H.push(i);
 i=scn; focusBox=foc; draw();
}

 '</div>';

 VE.onended=function(){ var t=tgtOf(s.next); if(t.scene<0){fin();}else{go(t,1);} };
 /* 보는 사람의 브라우저가 이 영상 코덱을 재생하지 못할 때(예: HEVC/.mov)
    까맣게 멈춰 있는 대신 이유를 알려주고, 그래도 다음으로는 넘어갈 수 있게 한다 */

 var skip=document.getElementById('vidSkip');

 skip.onclick=function(){ var t=tgtOf(s.next); if(t.scene<0){fin();}else{go(t,1);} };
 if(isNew && started) VE.play().catch(function(){});

function draw(){
 var s=D.scenes[i];
 document.getElementById('cap').textContent=s.cap||'';
 document.getElementById('bk').disabled=!H.length;
 var pg=document.getElementById('pg'),h='';
 for(var k=0;k<D.scenes.length;k++){
  var cls=D.scenes[k].type==='emph'?' em':D.scenes[k].type==='video'?' vid':'';
  h+='<i class="'+(k===i?'on':'')+cls+'"></i>';
 }
 pg.innerHTML=h;
 document.getElementById('st').textContent=(i+1)+' / '+D.scenes.length;
 trackProgress(i,false);
 if(s.type==='emph'){ VID.style.display='none'; VE.pause(); drawEmph(s); sync(); speak(); return; }
 if(s.type==='video'){ EM.style.display='none'; drawVideo(s); sync(); return; }
 EM.style.display='none'; VID.style.display='none'; VE.pause();
 F.style.display='';
 I.src=s.src;
 var g=fit();
 O.innerHTML='';
 activeBoxes(s).forEach(function(b){
  var n=s.boxes.indexOf(b);
  var d=document.createElement('div');
  d.className='hl';
  d.style.cssText='left:'+b.x+'%;top:'+b.y+'%;width:'+b.w+'%;height:'+b.h+'%;'+
   '--c:'+b.color+';--g:'+rgba(b.color,.55)+';--f:'+rgba(b.color,.13)+';--f2:'+rgba(b.color,.26);
  d.title=b.text||'클릭';
  d.onclick=function(){
   var t;
   /* '자동'이면서 같은 장면에 다음 박스가 남아 있으면, 그 박스를 순서대로 보여준다 */
   if(!b.next||b.next==='auto'){
    var idx=s.boxes.indexOf(b);
    if(idx>=0 && idx<s.boxes.length-1){ t={scene:i,focus:s.boxes[idx+1].id}; }
    else t=tgtOf(b.next);
   } else t=tgtOf(b.next);
   if(t.scene<0){fin();}else{go(t,1);}
  };
  O.appendChild(d);
  if(b.text){
   var p=document.createElement('div');p.className='tip';p.style.setProperty('--c',b.color);
   p.innerHTML='<b>STEP '+(i+1)+(s.boxes.length>1?'-'+(n+1):'')+
     '<span class="sp">🔊</span></b>'+b.text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
   /* 말풍선 클릭은 원래 자동재생이 막혔을 때(모바일 등) 수동으로 소리를 틀어주기 위한 것.
      이미 한 번 재생된 문장이면 다시 재생하지 않도록 force 없이 speak()를 부른다(내부에서 중복 재생을 막아준다).
      음소거 상태였다면 그때만 명시적으로 음소거를 풀고 새로 재생한다 */
   p.onclick=function(ev){
    ev.stopPropagation(); started=true;
    if(muted){ muted=false; sync(); speak(1); } else { sync(); speak(); }
   };
   O.appendChild(p);place(p,b,g);
  }
 });
 sync(); speak();
}
function sync(){
 var c = window.innerWidth<820;   /* 노션 임베드처럼 좁을 때는 아이콘만 */
 var ty = D.scenes[i].type, isE = ty==='emph', isV = ty==='video';
 var ft=document.getElementById('ft');
 if(ft) ft.textContent = isE?'버튼을 눌러 다음으로 진행하세요':isV?'영상이 끝나면 자동으로 다음으로 넘어가요 · 아래 버튼으로 바로 넘어갈 수도 있어요':'깜빡이는 박스를 클릭하면 다음 화면으로 넘어갑니다';
 sb.style.display = (!isV&&voiceOn&&hasVoice())?'':'none';
 sb.textContent = muted?'🔇':(c?'🔊':(started?'🔊 소리 켜짐':'🔊 소리로 듣기'));
 sb.title = muted?'소리 켜기':'소리 끄기 / 다시 듣기';
 zb.style.display = (isE||isV)?'none':'';
 zb.textContent = c?(zoom?'🔍':'🔎'):(zoom?'🔍 전체 보기':'🔍 확대 보기');
 document.getElementById('bk').textContent = c?'←':'← 이전';
 document.getElementById('hm').textContent = c?'↻':'↻ 처음부터';
}
function rgba(h,a){var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#ff3b30');
 return m?'rgba('+parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16)+','+a+')':'rgba(255,59,48,'+a+')';}
/* 말풍선 위치. 좌표는 이미지(확대된 크기) 기준이며 보이는 영역 안으로 가둔다 */
function place(p,b,g){
 var pw=p.offsetWidth,ph=p.offsetHeight,gap=13;
 var bx=b.x/100*g.fw,by=b.y/100*g.fh,bw=b.w/100*g.fw,bh=b.h/100*g.fh;
 var vL=-g.tx, vT=-g.ty, vR=vL+g.vw, vB=vT+g.vh;   /* 보이는 창(이미지 좌표계) */
 var pos=b.pos&&b.pos!=='auto'?b.pos:
   (by-vT>ph+gap+8?'top':(by+bh+ph+gap<vB?'bottom':(bx-vL>pw+gap?'left':'right')));
 var L,T,cls;
 if(pos==='top'){T=by-ph-gap;L=bx+bw/2-pw/2;cls='tp';}
 else if(pos==='bottom'){T=by+bh+gap;L=bx+bw/2-pw/2;cls='bt';}
 else if(pos==='left'){L=bx-pw-gap;T=by+bh/2-ph/2;cls='lf';}
 else{L=bx+bw+gap;T=by+bh/2-ph/2;cls='rt';}
 var L2=Math.max(vL+6,Math.min(vR-pw-6,L));
 if(cls==='tp'||cls==='bt')p.style.setProperty('--ax',(bx+bw/2-L2)+'px');
 T=Math.max(vT+6,Math.min(vB-ph-6,T));
 p.className='tip '+cls;p.style.left=L2+'px';p.style.top=T+'px';
}
/* 주소창에 http(s):// 를 빠뜨리고 입력해도(예: www.naver.com) 실제 인터넷 주소로 이동하도록 보정.
   './' 나 '/' 로 시작하면 (같은 폴더의 상대 경로) 그대로 두고, 그 외 스킴 없는 문자열에는 https://를 붙인다 */
function normUrl(u){
 u=(u||'').trim(); if(!u) return '';
 if(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(u)) return u; /* 이미 https:// 등 스킴 포함 */
 if(/^[./]/.test(u)) return u; /* 같은 폴더 상대 경로 (./, ../, /) */
 return 'https://'+u;
}

/* 예상 소요 시간 — 장면 수와 설명 길이로 자동 계산 */

 });

/* '모바일로 보기'(확대 추천)를 태블릿에도 잘못 추천하던 문제 수정.
   예전에는 터치 화면이면 화면 크기와 상관없이 곧바로 모바일로 판단해서,
   화면이 넓은 아이패드·갤럭시탭 같은 태블릿도 '모바일로 보기(확대)'가 추천되고,
   그걸 누르면 확대가 켜져서 '전체보기' 기본값이 무색해졌다.
   이제는 화면 폭을 기준으로 판단해서, 터치 여부와 상관없이 실제로 좁은 화면(휴대폰)일 때만
   모바일로 추천한다 — 태블릿·PC는 화면이 넓으니 확대 없이 전체보기가 그대로 유지된다 */

/* 시작 화면. 시작 버튼 클릭이 브라우저의 자동재생 제한도 함께 풀어준다 */
function playCurrentVideoIfAny(){ if(D.scenes[i]&&D.scenes[i].type==='video') VE.play().catch(function(){}); }
