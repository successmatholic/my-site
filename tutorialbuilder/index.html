<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인터랙티브 튜토리얼 빌더</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b3140;
    --tx:#e7ebf2; --tx2:#9aa4b6; --acc:#4f8cff; --acc2:#ff3b30; --ok:#22c55e;
  }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--tx);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
    font-size:13px;overflow:hidden;
  }
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--tx);padding:7px 11px;transition:.12s}
  button:hover{background:#28303d;border-color:#3a4356}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.pri:hover{background:#3d78e8}
  button.ok{background:var(--ok);border-color:var(--ok);color:#04240f;font-weight:600}
  button.dgr{background:#3a1d1d;border-color:#5b2b2b;color:#ffb4ae}
  button.dgr:hover{background:#4c2424}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,textarea,select{font-family:inherit;font-size:12px;background:#0d1015;color:var(--tx);
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
  textarea{resize:vertical;line-height:1.5}
  label{display:block;font-size:11px;color:var(--tx2);margin:12px 0 5px;font-weight:600;letter-spacing:.02em}

  #app{display:grid;grid-template-rows:52px 1fr;height:100%}

  /* ── toolbar ── */
  #bar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  #bar .logo{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
  #bar .logo span{color:var(--acc)}
  #title{width:230px}
  #bar .sp{flex:1}

  /* ── body ── */
  #main{display:grid;grid-template-columns:184px 1fr 292px;min-height:0}
  .col{min-height:0;overflow:auto}
  #left{background:var(--panel);border-right:1px solid var(--line);padding:10px}
  #right{background:var(--panel);border-left:1px solid var(--line);padding:0 14px 40px}
  #center{background:#0a0c10;display:grid;grid-template-rows:auto 1fr;padding:0;overflow:hidden}
  #scroll{overflow:auto;display:flex;padding:14px;min-height:0}
  #stage{margin:auto}
  #ezbar{display:flex;gap:5px;align-items:center;padding:9px 14px;background:#0d1117;
    border-bottom:1px solid var(--line)}
  #ezbar button{padding:4px 9px;font-size:11px}
  #ezbar button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  #ezbar .lb{color:var(--tx2);font-size:11px;margin-right:auto}

  .sect{font-size:11px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
  .sect:first-child{border-top:none;padding-top:2px;margin-top:8px}

  /* scene list */
  .scn{position:relative;border:2px solid transparent;border-radius:9px;overflow:hidden;margin-bottom:8px;
    background:var(--panel2);cursor:pointer}
  .scn.on{border-color:var(--acc)}
  .scn img{display:block;width:100%;height:82px;object-fit:cover;object-position:top;background:#000;
    -webkit-user-drag:none;user-drag:none}
  .scn.dragging{opacity:.35}
  .scn.dragover{border-color:var(--acc);box-shadow:0 0 0 2px rgba(79,140,255,.4) inset}
  .scn .cap{display:flex;align-items:center;gap:5px;padding:5px 6px;font-size:11px;color:var(--tx2)}
  .scn .no{background:var(--acc);color:#fff;font-weight:700;border-radius:5px;padding:1px 5px;font-size:10px}
  .scn .cnt{margin-left:auto;color:var(--tx2)}
  .scn .mv{position:absolute;top:4px;right:4px;display:none;gap:3px}
  .scn:hover .mv{display:flex}
  .scn .mv button{padding:2px 6px;font-size:10px;background:rgba(0,0,0,.72)}
  .scn .ck{position:absolute;top:4px;left:4px;width:19px;height:19px;border-radius:5px;z-index:2;
    border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.4);display:none;
    align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800}
  #scns.selmode .scn .ck{display:flex}
  #scns.selmode .scn .mv{display:none!important}
  .scn.selon{border-color:var(--ok)}
  .scn.selon .ck{background:var(--ok);border-color:var(--ok);color:#04240f}
  #selbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--tx2)}
  #selbar button{padding:3px 8px;font-size:10.5px}
  .sect .sr{float:right;padding:2px 8px;font-size:10px;font-weight:600;text-transform:none;letter-spacing:0}
  .sect .sr.on{background:var(--acc);border-color:var(--acc);color:#fff}
  #drop{border:2px dashed var(--line);border-radius:9px;padding:16px 8px;text-align:center;color:var(--tx2);
    font-size:11px;line-height:1.6;cursor:pointer}
  #drop:hover,#drop.hot{border-color:var(--acc);color:var(--tx);background:rgba(79,140,255,.08)}

  /* canvas */
  #wrap{position:relative;display:inline-block;line-height:0;box-shadow:0 8px 40px rgba(0,0,0,.6);
    border-radius:4px;overflow:hidden}
  #shot{display:block;max-width:100%;max-height:calc(100vh - 130px);width:auto;user-select:none}
  #ov{position:absolute;inset:0;cursor:crosshair}
  .box{position:absolute;border:3px solid var(--bc,#ff3b30);border-radius:7px;box-sizing:border-box;
    background:rgba(255,59,48,.10);cursor:move}
  .box.on{box-shadow:0 0 0 1px #fff,0 0 14px rgba(79,140,255,.7)}
  .box .lb{position:absolute;top:-9px;left:-9px;min-width:19px;height:19px;border-radius:50%;
    background:var(--bc,#ff3b30);color:#fff;font-size:11px;font-weight:800;display:flex;
    align-items:center;justify-content:center;line-height:1;padding:0 4px}
  .box .h{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--acc);
    border-radius:3px;display:none}
  .box.on .h{display:block}
  .h[data-h=nw]{left:-6px;top:-6px;cursor:nwse-resize}
  .h[data-h=ne]{right:-6px;top:-6px;cursor:nesw-resize}
  .h[data-h=sw]{left:-6px;bottom:-6px;cursor:nesw-resize}
  .h[data-h=se]{right:-6px;bottom:-6px;cursor:nwse-resize}
  .h[data-h=n]{left:50%;top:-6px;margin-left:-5.5px;cursor:ns-resize}
  .h[data-h=s]{left:50%;bottom:-6px;margin-left:-5.5px;cursor:ns-resize}
  .h[data-h=w]{left:-6px;top:50%;margin-top:-5.5px;cursor:ew-resize}
  .h[data-h=e]{right:-6px;top:50%;margin-top:-5.5px;cursor:ew-resize}
  #tmp{position:absolute;border:2px dashed #4f8cff;background:rgba(79,140,255,.16);display:none;
    pointer-events:none;border-radius:6px}
  #hint{color:var(--tx2);font-size:12px;margin-top:10px;text-align:center;line-height:1.7}
  #empty{margin:auto;text-align:center;color:var(--tx2);max-width:420px;line-height:1.9}
  #empty h2{color:var(--tx);font-size:19px;margin:0 0 10px}
  #empty kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}

  /* box list */
  .bl{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--line);
    border-radius:7px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
  .bl.on{border-color:var(--acc);background:rgba(79,140,255,.12)}
  .bl .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .bl .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
  .bl .t.no{color:var(--tx2);font-style:italic}

  .row{display:flex;gap:7px}
  .row>*{flex:1;min-width:0}
  .sw{display:flex;gap:6px;flex-wrap:wrap}
  .sw i{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
  .sw i.on{border-color:#fff}
  .none{color:var(--tx2);font-size:12px;line-height:1.8;padding:10px 0}

  /* 강조 장면 (스크린샷 없이 큰 문구로 보여주는 장면) */
  .scn .emThumb{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:0 8px}
  .scn .emThumb .ic{font-size:22px;line-height:1}
  .scn .emThumb .tt{font-size:10px;color:var(--tx2);text-align:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  #emphStage{display:none;margin:auto;flex-direction:column;align-items:center;text-align:center;
    max-width:420px}
  .ecard{border:2px solid var(--c,#4f8cff);border-radius:16px;padding:34px 28px;width:380px;
    background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,0)) ,var(--panel2);
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .ecard .eic{font-size:44px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 0 18px var(--c,#4f8cff))}
  .ecard h2{margin:0 0 10px;font-size:19px;color:var(--tx);line-height:1.4;white-space:pre-wrap}
  .ecard p{margin:0 0 18px;color:var(--tx2);font-size:14.5px;line-height:1.6;white-space:pre-wrap}
  .ecard .ebtn{background:var(--c,#4f8cff);border-color:var(--c,#4f8cff);color:#fff;font-weight:700;
    padding:9px 20px;opacity:.9;cursor:default}
  /* 강조 장면 안의 "특장점" · "이렇게 활용하세요" 하이라이트 박스 */
  .ecard .exsec{width:100%;text-align:left;border-radius:12px;padding:13px 15px;margin-bottom:14px;
    border:1px solid var(--xc);background:linear-gradient(135deg,var(--xc2),rgba(255,255,255,.02))}
  .ecard .exsec:last-of-type{margin-bottom:18px}
  .ecard .exsec .xh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;
    color:var(--xc);margin-bottom:6px;letter-spacing:.01em}
  .ecard .exsec p{margin:0;color:var(--tx);font-size:13px;line-height:1.7;white-space:pre-wrap}
  .ecard .exsec.feat{--xc:#f59e0b;--xc2:rgba(245,158,11,.16)}
  .ecard .exsec.usage{--xc:#22c55e;--xc2:rgba(34,197,94,.16)}

  /* 서식 도구 (강조 장면 제목·설명 입력 위에 표시) */
  .fmtbar{display:flex;gap:5px;margin:4px 0 -4px}
  .fmtbar button{padding:3px 10px;font-size:11px;line-height:1.4}
  .fmtbar button.fb{font-weight:800}
  .fmtbar button.fu{text-decoration:underline}
  .fmthint{color:var(--tx2);font-size:10.5px;margin:4px 0 0;line-height:1.5}

  /* 영상 장면 */
  .scn .vidThumb{height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:0 8px;background:linear-gradient(135deg,#2a2f3a,#1a1d24)}
  .scn .vidThumb .ic{font-size:22px;line-height:1}
  .scn .vidThumb .tt{font-size:10px;color:var(--tx2);text-align:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  #vidStage{display:none;margin:auto;flex-direction:column;align-items:center;max-width:640px;width:100%}
  #vidStage video{width:100%;max-height:calc(100vh - 230px);border-radius:10px;background:#000;
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
  #vidStage .vname{color:var(--tx2);font-size:11.5px;margin-top:10px;text-align:center}

  /* 시작 화면 카드 (좌측 목록 상단 · 프로젝트 전역 설정 진입점) */
  #startCard{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:11.5px;color:var(--tx2)}
  #startCard .ic{font-size:18px}
  #startCard .tt{flex:1;color:var(--tx);font-weight:600}
  #startStage{display:none;margin:auto;flex-direction:column;align-items:center;text-align:center;
    max-width:460px}
  .startCardP{border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:400px;
    background:var(--panel2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .startCardP .se{font-size:32px;margin-bottom:8px}
  .startCardP h2{margin:0 0 8px;font-size:18px;color:var(--tx)}
  .startCardP p{margin:0 0 12px;color:var(--tx2);font-size:12.5px;line-height:1.6}
  .startCardP .meta{color:var(--tx2);font-size:11.5px;margin-bottom:14px}
  .startCardP .devs{display:flex;gap:8px;justify-content:center}
  .startCardP .dev{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-size:11px;
    color:var(--tx2)}
  .startCardP .dev b{display:block;color:var(--tx);font-size:12px;margin-bottom:2px}

  /* preview modal */
  #pv{position:fixed;inset:0;background:rgba(4,6,10,.9);z-index:50;display:none;
    flex-direction:column;padding:14px;gap:10px;backdrop-filter:blur(3px)}
  #pv.on{display:flex}
  #pv .top{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px}
  #pv iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:11px;background:#fff}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12161d;
    border:1px solid var(--line);border-left:3px solid var(--ok);padding:11px 16px;border-radius:9px;
    z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="logo">튜토리얼 <span>빌더</span></div>
    <input id="title" placeholder="튜토리얼 제목">
    <button id="bUndo" title="실행 취소 (Ctrl+Z)">↩</button>
    <button id="bRedo" title="다시 실행 (Ctrl+Shift+Z)">↪</button>
    <span id="asInd" title="이 브라우저에 편집 내용을 주기적으로 몰래 저장해 둬요. 오류·실수로 창을 닫아도 다시 열면 복구할 수 있어요." style="color:var(--tx2);font-size:11px;margin-left:2px;white-space:nowrap"></span>
    <div class="sp"></div>
    <button id="bLoad">📂 불러오기</button>
    <button id="bSave">💾 저장</button>
    <button class="pri" id="bPv">▶ 미리보기</button>
    <button class="ok" id="bEx">⬇ HTML 내보내기</button>
  </div>

  <div id="main">
    <div class="col" id="left">
      <div class="sect">프로젝트</div>
      <div id="startCard" class="scn"></div>
      <div class="sect">장면 목록<button id="bSelMode" class="sr">선택 삭제</button></div>
      <div id="scns"></div>
      <div id="drop">＋ 스크린샷 추가<br><span style="opacity:.7">클릭 · 드래그 · Ctrl+V</span></div>
      <button id="bAddEmph" style="width:100%;margin-top:8px">✨ 강조 장면 추가</button>
      <button id="bAddVideo" style="width:100%;margin-top:6px">🎬 영상 장면 추가</button>
    </div>

    <div class="col" id="center">
      <div id="ezbar" style="display:none">
        <span class="lb" id="ezinfo"></span>
        <span style="color:#9aa4b6;font-size:11px">편집 화면 확대</span>
        <button data-z="fit">화면 맞춤</button><button data-z="1">100%</button>
        <button data-z="1.5">150%</button><button data-z="2">200%</button>
        <button data-z="3">300%</button>
      </div>
      <div id="scroll">
      <div id="empty">
        <h2>시작해 볼까요</h2>
        <div>화면을 캡쳐한 뒤 <kbd>Ctrl</kbd>+<kbd>V</kbd> 로 바로 붙여넣거나,<br>
        왼쪽의 <b>스크린샷 추가</b>로 이미지를 올려주세요.<br><br>
        이미지 위에서 <b>마우스를 드래그</b>하면 네모 박스가 생기고,<br>
        오른쪽에 설명을 적으면 완성입니다.</div>
      </div>
      <div id="stage" style="display:none">
        <div id="wrap">
          <img id="shot" alt="">
          <div id="ov"><div id="tmp"></div></div>
        </div>
        <div id="hint"></div>
      </div>
      <div id="emphStage"></div>
      <div id="vidStage"></div>
      <div id="startStage"></div>
      </div>
    </div>

    <div class="col" id="right"></div>
  </div>
</div>

<div id="pv">
  <div class="top">
    <b style="color:#e7ebf2;font-size:13px">미리보기</b>
    <span>— 깜빡이는 박스를 클릭해 보세요</span>
    <div style="flex:1"></div>
    <button id="pvR">↻ 다시 시작</button>
    <button id="pvX">✕ 닫기</button>
  </div>
  <iframe id="pvF"></iframe>
</div>

<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fPrj" accept=".json,application/json" hidden>
<input type="file" id="fAud" accept="audio/*" hidden>
<input type="file" id="fVid" accept="video/*" hidden>

<script>
/* ═══════════════ 상태 ═══════════════ */
const PAL = ['#ff3b30','#4f8cff','#22c55e','#f59e0b','#a855f7','#ec4899'];
let S = { title:'', scenes:[] };
let cur = 0, sel = null, uid = 1, view = 'scene'; /* view: 'scene' (선택한 장면 편집) | 'start' (시작 화면 설정) */
let selMode = false, selIds = new Set(); /* 장면 목록 다중 선택 삭제 */
let dragSceneIdx = null; /* 장면 목록 드래그로 순서 옮기기 */
const $ = id => document.getElementById(id);
const nid = () => 'i' + (uid++) + Date.now().toString(36).slice(-3);
const scene = () => S.scenes[cur] || null;
const box = () => { const s = scene(); return s ? s.boxes.find(b=>b.id===sel) : null; };
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* 강조 장면 제목·설명에서 **굵게**, __밑줄__, Enter 줄바꿈을 실제 서식으로 바꿔준다 */
const mdLite = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/__([^_]+)__/g,'<u>$1</u>');
/* 텍스트 영역에서 선택한 글자를 marker로 감싸기 (서식 버튼용) */
function wrapSel(id, marker){
  const ta=$(id); if(!ta) return;
  const s=ta.selectionStart??ta.value.length, e=ta.selectionEnd??ta.value.length;
  const v=ta.value, sel=v.slice(s,e)||'텍스트';
  ta.value=v.slice(0,s)+marker+sel+marker+v.slice(e);
  ta.dispatchEvent(new Event('input'));
  ta.focus(); ta.selectionStart=s+marker.length; ta.selectionEnd=s+marker.length+sel.length;
}

function toast(m){
  const d=document.createElement('div'); d.className='toast'; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}

/* ═══════════════ 실행 취소 / 다시 실행 ═══════════════ */
/* 장면·박스 추가/삭제/이동/그리기 같은 굵직한 변경 전에 snapshot()으로 상태를 저장해 둔다.
   글자 입력 중에는 필드에 포커스가 들어올 때 한 번만 저장해서, 한 글자씩 되돌리지 않고
   그 칸에서 입력한 내용 전체가 한 번의 되돌리기로 묶이도록 한다. */
let H_past=[], H_future=[], H_MAX=80, H_typingEl=null;
/* 마지막 저장/내보내기 이후 편집이 있었는지 여부. true면 새로고침·탭 닫기 시 브라우저 기본 확인창을 띄운다. */
let dirty=false;
function snapshot(){
  H_past.push(JSON.stringify(S));
  if(H_past.length>H_MAX) H_past.shift();
  H_future=[]; H_typingEl=null;
  dirty=true;
  markAutosaveDirty();
  syncHistBtns();
}
/* 계속 입력 중인 같은 입력칸이면 한 번만 snapshot, 다른 칸으로 넘어가면 다시 snapshot */
function trackEdit(el){
  if(H_typingEl!==el){ H_past.push(JSON.stringify(S)); if(H_past.length>H_MAX)H_past.shift();
    H_future=[]; H_typingEl=el; dirty=true; markAutosaveDirty(); syncHistBtns(); }
}
function restoreSnapshot(json){
  S=JSON.parse(json);
  S.scenes.forEach(s=>{s.boxes=s.boxes||[];});
  cur=Math.min(cur,S.scenes.length-1); if(cur<0)cur=0;
  sel=null; selMode=false; selIds.clear(); H_typingEl=null;
  view = (view==='start') ? 'start' : 'scene';
  markAutosaveDirty();
  render(); syncHistBtns();
}
function undo(){
  if(!H_past.length) return;
  H_future.push(JSON.stringify(S));
  const j=H_past.pop();
  restoreSnapshot(j);
  toast('되돌렸어요');
}
function redo(){
  if(!H_future.length) return;
  H_past.push(JSON.stringify(S));
  const j=H_future.pop();
  restoreSnapshot(j);
  toast('다시 실행했어요');
}
function syncHistBtns(){
  const u=$('bUndo'), r=$('bRedo');
  if(u) u.disabled=!H_past.length;
  if(r) r.disabled=!H_future.length;
}
$('bUndo').onclick=undo;
$('bRedo').onclick=redo;
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); redo(); }
});

/* ═══════════════ 자동 저장 (IndexedDB) ═══════════════ */
/* 브라우저가 갑자기 닫히거나(오류·실수로 새로고침 등) 저장을 깜빡했을 때를 대비해,
   편집 중인 내용을 이 브라우저 안에(IndexedDB) 주기적으로 몰래 저장해 둔다.
   용량이 큰 영상도 다룰 수 있도록 localStorage 대신 IndexedDB를 쓴다. */
const AS_DB='tutorialBuilderAutosave', AS_STORE='snap', AS_KEY='last';
let asDirty=false, asBusy=false;
function markAutosaveDirty(){ asDirty=true; }
function asOpen(){
  return new Promise((res,rej)=>{
    let req;
    try{ req=indexedDB.open(AS_DB,1); }catch(e){ return rej(e); }
    req.onupgradeneeded=()=>{ try{ req.result.createObjectStore(AS_STORE); }catch(e){} };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function asSet(val){
  const db=await asOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(AS_STORE,'readwrite');
    tx.objectStore(AS_STORE).put(val,AS_KEY);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function asGet(){
  const db=await asOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(AS_STORE,'readonly');
    const req=tx.objectStore(AS_STORE).get(AS_KEY);
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
async function saveAutosaveNow(){
  if(asBusy || !S.scenes || !S.scenes.length) return;
  asBusy=true;
  try{
    await asSet({t:Date.now(), title:S.title||'', json:JSON.stringify(S)});
    asDirty=false;
    showAsIndicator();
  }catch(e){ /* 용량 초과 등은 조용히 무시 — 자동저장은 부가 기능일 뿐 편집을 막으면 안 됨 */ }
  asBusy=false;
}
setInterval(()=>{ if(asDirty) saveAutosaveNow(); }, 3000);
function showAsIndicator(){
  const el=$('asInd'); if(!el) return;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  el.textContent='🔄 자동저장됨 · '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function showAsRestoreBar(saved){
  if($('asBar')) return;
  const d=document.createElement('div');
  d.id='asBar';
  d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:200;'+
    'background:#12161d;border:1px solid var(--line);border-left:3px solid var(--acc);'+
    'padding:10px 12px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.55);font-size:12.5px;'+
    'display:flex;align-items:center;gap:9px;max-width:min(92vw,560px)';
  const mins=Math.max(0,Math.round((Date.now()-(saved.t||0))/60000));
  const when = mins<1?'방금 전':mins+'분 전';
  d.innerHTML='<span>🗂 <b>'+esc(saved.title||'튜토리얼')+'</b> 자동저장된 작업이 있어요 ('+when+')</span>'+
    '<button class="pri" id="asRestore" style="padding:5px 11px;white-space:nowrap">복구하기</button>'+
    '<button id="asDismiss" style="padding:5px 11px;white-space:nowrap">새로 시작</button>';
  document.body.appendChild(d);
  $('asRestore').onclick=()=>{
    try{
      const parsed=JSON.parse(saved.json);
      parsed.scenes=parsed.scenes||[];
      parsed.scenes.forEach(s=>{s.id=s.id||nid();s.boxes=s.boxes||[];s.boxes.forEach(b=>b.id=b.id||nid());});
      S=parsed; cur=0; sel=null; $('title').value=S.title||'';
      H_past=[]; H_future=[]; H_typingEl=null; dirty=false; syncHistBtns();
      render(); toast('자동저장된 작업을 복구했어요');
    }catch(e){ toast('복구에 실패했어요'); }
    d.remove();
  };
  $('asDismiss').onclick=()=>d.remove();
}
(async function checkAutosaveOnLoad(){
  try{
    const saved=await asGet();
    if(saved && saved.json && (!S.scenes || !S.scenes.length)){
      const parsed=JSON.parse(saved.json);
      if(parsed && parsed.scenes && parsed.scenes.length) showAsRestoreBar(saved);
    }
  }catch(e){}
})();

/* ═══════════════ 성우(음성) 목록 ═══════════════ */
/* 브라우저/OS에 설치된 한국어 TTS 음성들 중에서 고를 수 있게 함 (파일 아님, 시스템 음성) */
let koVoices = [];
function refreshVoices(){
  const l=(window.speechSynthesis && speechSynthesis.getVoices()) || [];
  koVoices = l.filter(v=>/^ko/i.test(v.lang));
}
if(window.speechSynthesis){
  speechSynthesis.onvoiceschanged=()=>{ refreshVoices(); if(view!=='start') renderPanel(); };
  refreshVoices();
}
function pickVoice(){
  if(!koVoices.length) return null;
  if(S.voiceName){ const m=koVoices.find(v=>v.name===S.voiceName); if(m) return m; }
  return koVoices[0];
}

/* ═══════════════ 이미지 추가 ═══════════════ */
function addFiles(files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/'));
  if(!imgs.length) return;
  const slot=new Array(imgs.length); let done=0;
  imgs.forEach((f,i)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        slot[i]={src:r.result,w:im.naturalWidth,h:im.naturalHeight};
        if(++done===imgs.length) flush();
      };
      im.onerror=()=>{ if(++done===imgs.length) flush(); };
      im.src=r.result;
    };
    r.readAsDataURL(f);
  });
  function flush(){
    snapshot();
    slot.filter(Boolean).forEach(o=>{
      S.scenes.push({id:nid(),name:'장면 '+(S.scenes.length+1),src:o.src,w:o.w,h:o.h,boxes:[]});
    });
    cur=S.scenes.length-1; sel=null; render();
    toast(imgs.length+'개 장면을 추가했어요');
  }
}
$('drop').onclick=()=>$('fImg').click();
$('fImg').onchange=e=>{addFiles(e.target.files);e.target.value='';};

/* ═══════════════ 영상 장면 추가 · 교체 ═══════════════ */
let videoReplaceFor=null;
$('bAddVideo').onclick=()=>{ videoReplaceFor=null; $('fVid').click(); };
$('fVid').onchange=e=>{
  const f=e.target.files[0]; e.target.value='';
  const replTarget=videoReplaceFor; videoReplaceFor=null;
  if(!f) return;
  if(f.size>300*1024*1024) return toast('영상이 너무 커요 (300MB 이하로 올려주세요)');
  if(f.size>50*1024*1024) toast('영상이 커서 내보낸 HTML 파일도 커질 수 있어요');
  const r=new FileReader();
  r.onload=()=>{
    snapshot();
    /* 영상을 끼워 넣는 지금 이 순간이 브라우저에 가장 부담이 큰 작업이라 오류가 나기 쉽다.
       무거운 영상을 화면에 반영하기 전에, 영상을 넣기 '직전' 상태를 즉시 저장해 둬서
       혹시 이후 렌더링 중 오류가 나도 지금까지 만든 작업까지는 복구할 수 있게 한다 */
    saveAutosaveNow();
    if(replTarget){
      replTarget.src=r.result; replTarget.mime=f.type||'video/mp4'; replTarget.dur=null;
      render(); toast('영상을 교체했어요 (약 '+Math.round(f.size/1048576*10)/10+'MB)');
      return;
    }
    const vs={id:nid(), type:'video', name:'영상 '+(S.scenes.length+1),
      src:r.result, mime:f.type||'video/mp4', cap:'', btn:'다음으로 →', next:'auto', boxes:[]};
    const at=S.scenes.length?cur+1:0;
    S.scenes.splice(at,0,vs);
    cur=at; sel=null; render();
    toast('영상 장면을 추가했어요 (약 '+Math.round(f.size/1048576*10)/10+'MB)');
  };
  r.onerror=()=>toast('영상 파일을 읽을 수 없어요');
  r.readAsDataURL(f);
};

['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault(); $('drop').classList.add('hot');
}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault(); if(ev==='drop'&&e.dataTransfer) addFiles(e.dataTransfer.files);
  $('drop').classList.remove('hot');
}));
document.addEventListener('paste',e=>{
  const it=[...(e.clipboardData?.items||[])].filter(x=>x.type.startsWith('image/'));
  if(!it.length) return;
  e.preventDefault(); addFiles(it.map(x=>x.getAsFile()).filter(Boolean));
});

/* ═══════════════ 렌더 ═══════════════ */
function render(){ renderStartCard(); renderScenes(); renderCanvas(); renderPanel(); }

function renderStartCard(){
  const d=$('startCard');
  d.className='scn'+(view==='start'?' on':'');
  d.innerHTML='<span class="ic">'+esc(S.icon||'📘')+'</span><span class="tt">시작 화면 설정</span>';
  d.onclick=()=>{ view='start'; sel=null; render(); };
}

function renderScenes(){
  const c=$('scns'); c.innerHTML='';
  c.classList.toggle('selmode',selMode);

  if(selMode){
    const bar=document.createElement('div');
    bar.id='selbar';
    bar.innerHTML='<span>'+selIds.size+'개 선택</span><div style="flex:1"></div>'+
      '<button id="bSelAll">전체</button><button id="bSelNone">해제</button>';
    c.appendChild(bar);
    $('bSelAll').onclick=()=>{ S.scenes.forEach(s=>selIds.add(s.id)); renderScenes(); };
    $('bSelNone').onclick=()=>{ selIds.clear(); renderScenes(); };
  }

  S.scenes.forEach((s,i)=>{
    const d=document.createElement('div');
    const isEmph=s.type==='emph', isVideo=s.type==='video';
    const tag = isEmph?'✨ ':isVideo?'🎬 ':'';
    const isSel=selIds.has(s.id);
    d.className='scn'+(view==='scene'&&i===cur?' on':'')+(selMode&&isSel?' selon':'');
    d.innerHTML='<div class="ck">'+(isSel?'✓':'')+'</div>'+
      (isEmph
        ? '<div class="emThumb" style="background:linear-gradient(135deg,'+hexa(s.color||'#4f8cff',.32)+','+hexa(s.color||'#4f8cff',.12)+')">'+
          '<span class="ic">'+esc(s.icon||'⭐')+'</span>'+
          '<span class="tt">'+esc(s.headline||'강조 장면')+'</span></div>'
        : isVideo
        ? '<div class="vidThumb"><span class="ic">🎬</span><span class="tt">'+esc(s.name)+'</span></div>'
        : '<img src="'+s.src+'" draggable="false">')+
      '<div class="cap"><span class="no" style="'+((isEmph||isVideo)?'background:'+(s.color||'#4f8cff'):'')+'">'+(i+1)+'</span>'+
      '<span>'+tag+esc(s.name)+'</span>'+
      '<span class="cnt">'+((isEmph||isVideo)?'':s.boxes.length+'📦')+'</span></div>'+
      '<div class="mv" draggable="false"><button data-a="up">▲</button><button data-a="dn">▼</button>'+
      '<button data-a="dup" title="복제">⧉</button><button data-a="rm">✕</button></div>';
    d.onclick=e=>{
      if(selMode){
        if(selIds.has(s.id)) selIds.delete(s.id); else selIds.add(s.id);
        renderScenes();
        return;
      }
      const a=e.target.dataset.a;
      if(a==='up'&&i>0){snapshot();[S.scenes[i-1],S.scenes[i]]=[S.scenes[i],S.scenes[i-1]];cur=i-1;}
      else if(a==='dn'&&i<S.scenes.length-1){snapshot();[S.scenes[i+1],S.scenes[i]]=[S.scenes[i],S.scenes[i+1]];cur=i+1;}
      else if(a==='dup'){
        snapshot();
        const clone=JSON.parse(JSON.stringify(s));
        clone.id=nid();
        clone.name=(s.name||'장면')+' 복사본';
        const idMap={};
        (clone.boxes||[]).forEach(cb=>{ const old=cb.id; cb.id=nid(); idMap[old]=cb.id; });
        (clone.boxes||[]).forEach(cb=>{ if(idMap[cb.next]) cb.next=idMap[cb.next]; });
        S.scenes.splice(i+1,0,clone);
        cur=i+1;
        toast('장면을 복제했어요');
      }
      else if(a==='rm'){
        if(!confirm((isEmph?'강조 장면 ':isVideo?'영상 장면 ':'장면 ')+(i+1)+'을 삭제할까요?'))return;
        snapshot();
        const gone=S.scenes[i].id; S.scenes.splice(i,1);
        S.scenes.forEach(x=>{
          (x.boxes||[]).forEach(b=>{if(b.next===gone)b.next='auto';});
          if(x.next===gone) x.next='auto';
        });
        cur=Math.min(cur,S.scenes.length-1);
      } else { cur=i; }
      view='scene'; sel=null; render();
    };

    /* 마우스로 끌어서 순서 옮기기 (썸네일 이미지 자체는 draggable=false로 막아,
       브라우저가 이미지를 '파일'로 인식해 새 장면이 복사 생성되는 문제를 방지) */
    d.draggable = !selMode;
    d.ondragstart=e=>{
      if(selMode){ e.preventDefault(); return; }
      dragSceneIdx=i;
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', String(i)); }catch(_){}
      setTimeout(()=>d.classList.add('dragging'),0);
    };
    d.ondragend=()=>{
      d.classList.remove('dragging');
      c.querySelectorAll('.scn.dragover').forEach(x=>x.classList.remove('dragover'));
      dragSceneIdx=null;
    };
    d.ondragover=e=>{
      if(dragSceneIdx===null) return; /* 외부 파일 드래그일 때는 기존 드롭존 동작을 그대로 둠 */
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect='move';
      if(dragSceneIdx!==i) d.classList.add('dragover');
    };
    d.ondragleave=()=>{ d.classList.remove('dragover'); };
    d.ondrop=e=>{
      e.preventDefault(); e.stopPropagation();
      d.classList.remove('dragover');
      const from=dragSceneIdx; dragSceneIdx=null;
      if(from===null||from===i) return;
      snapshot();
      const [moved]=S.scenes.splice(from,1);
      S.scenes.splice(i,0,moved);
      if(view==='scene'&&cur===from) cur=i;
      render();
    };
    c.appendChild(d);
  });

  if(selMode && S.scenes.length){
    const delBtn=document.createElement('button');
    delBtn.className='dgr'; delBtn.style.cssText='width:100%;margin-top:6px';
    delBtn.textContent='🗑 선택한 '+selIds.size+'개 삭제';
    delBtn.disabled=selIds.size===0;
    delBtn.onclick=()=>{
      if(!selIds.size) return;
      if(!confirm(selIds.size+'개 장면을 삭제할까요?')) return;
      snapshot();
      const goneIds=new Set(selIds);
      S.scenes=S.scenes.filter(s=>!goneIds.has(s.id));
      S.scenes.forEach(x=>{
        (x.boxes||[]).forEach(b=>{if(goneIds.has(b.next))b.next='auto';});
        if(goneIds.has(x.next)) x.next='auto';
      });
      selIds.clear(); selMode=false;
      cur=Math.min(cur,S.scenes.length-1); sel=null;
      render();
      toast(goneIds.size+'개 장면을 삭제했어요');
    };
    c.appendChild(delBtn);
  }
}
$('bSelMode').onclick=()=>{
  selMode=!selMode; selIds.clear();
  $('bSelMode').classList.toggle('on',selMode);
  $('bSelMode').textContent=selMode?'선택 취소':'선택 삭제';
  renderScenes();
};

function renderCanvas(){
  const s = view==='start' ? null : scene();
  const isEmph = s && s.type==='emph';
  const isVideo = s && s.type==='video';
  const isShot = s && !isEmph && !isVideo;
  $('empty').style.display=(view==='scene'&&!s)?'block':'none';
  $('stage').style.display=isShot?'block':'none';
  $('ezbar').style.display=isShot?'flex':'none';
  $('emphStage').style.display=isEmph?'flex':'none';
  $('vidStage').style.display=isVideo?'flex':'none';
  $('startStage').style.display=view==='start'?'flex':'none';
  if(view==='start'){ renderStartPreview(); return; }
  if(!s) return;
  if(isEmph){ renderEmphPreview(s); return; }
  if(isVideo){ renderVideoPreview(s); return; }
  $('shot').src=s.src;
  const ov=$('ov');
  [...ov.querySelectorAll('.box')].forEach(n=>n.remove());
  s.boxes.forEach((b,i)=>{
    const d=document.createElement('div');
    d.className='box'+(b.id===sel?' on':'');
    d.dataset.id=b.id;
    d.style.cssText='left:'+b.x+'%;top:'+b.y+'%;width:'+b.w+'%;height:'+b.h+'%;--bc:'+b.color+
      ';background:'+hexa(b.color,.10);
    d.innerHTML='<span class="lb">'+(i+1)+'</span>'+
      ['nw','ne','sw','se','n','s','w','e'].map(h=>'<i class="h" data-h="'+h+'"></i>').join('');
    ov.appendChild(d);
  });
  applyEz();
  $('hint').textContent = s.boxes.length
    ? '박스를 드래그해 옮기고, 모서리를 잡아 크기를 조절하세요. (Delete 키로 삭제)'
    : '👉 클릭할 버튼 위에서 마우스를 드래그해 네모 박스를 그려주세요.';
}

function renderEmphPreview(s){
  const c=s.color||'#4f8cff';
  $('emphStage').innerHTML=
   '<div class="ecard" style="--c:'+c+';border-color:'+c+';'+
     'background:radial-gradient(circle at 50% 0%,'+hexa(c,.34)+' 0%,'+hexa(c,.14)+' 60%,var(--panel2) 100%)">'+
     '<div class="eic">'+esc(s.icon||'⭐')+'</div>'+
     '<h2>'+mdLite(s.headline||'제목을 입력하세요')+'</h2>'+

/* 편집 화면 확대 — 캡쳐가 클 때 작은 버튼에 박스를 정확히 그리기 위함 */
let ez='fit';
function applyEz(){
  const s=scene(); if(!s) return;
  const im=$('shot');
  if(ez==='fit'){ im.style.width=''; im.style.maxWidth='100%'; im.style.maxHeight='calc(100vh - 210px)'; }
  else { im.style.maxWidth='none'; im.style.maxHeight='none'; im.style.width=(s.w*ez)+'px'; }
  $('ezinfo').textContent='원본 '+s.w+' × '+s.h+' px';
  [...$('ezbar').querySelectorAll('button')].forEach(b=>
    b.classList.toggle('on',String(b.dataset.z)===String(ez)));
}
$('ezbar').onclick=e=>{
  const z=e.target.dataset.z; if(!z) return;
  ez = z==='fit'?'fit':parseFloat(z); applyEz();
};

function hexa(h,a){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#ff3b30');
  if(!m) return 'rgba(255,59,48,'+a+')';
  return 'rgba('+parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16)+','+a+')';
}

/* 예상 소요 시간 (플레이어와 같은 계산식) */
function estMin(){
  let t=0;
  S.scenes.forEach(s=>{
    if(s.type==='video'){ t += s.dur||180; return; } /* 영상 길이를 모르면 3분으로 가정 */
    let txt;
    if(s.type==='emph') txt=(s.say&&s.say.trim())?s.say.trim():((s.headline||'')+'. '+(s.text||''));
    else{
      const boxTxt=s.boxes.map(b=>(b.say&&b.say.trim())?b.say.trim():b.text).filter(Boolean).join('. ');
      txt = boxTxt || ((s.say&&s.say.trim())?s.say.trim():'');
    }
    t += 5 + txt.length/6.5;
  });
  const lo=Math.max(1,Math.round(t/60*.85)), hi=Math.max(lo+1,Math.round(t/60*1.3));
  return lo+'~'+hi;
}

/* ═══════════════ 우측 패널 ═══════════════ */
function optsFor(v, excludeId, autoLabel){
  let h='<option value="auto"'+(v==='auto'?' selected':'')+'>'+(autoLabel||'▶ 바로 다음 장면 (자동)')+'</option>';
  S.scenes.forEach((x,i)=>{
    h += '<option value="'+x.id+'"'+(v===x.id?' selected':'')+'>'+(i+1)+'. '+esc(x.name)+'</option>';
    (x.boxes||[]).forEach((bx,bi)=>{
      if(bx.id===excludeId) return;
      h += '<option value="'+bx.id+'"'+(v===bx.id?' selected':'')+'>&nbsp;&nbsp;↳ '+(i+1)+'-'+(bi+1)+'번 클릭 지점: '+esc(bx.text||'설명 없음')+'</option>';
    });
  });
  h += '<option value="end"'+(v==='end'?' selected':'')+'>🏁 튜토리얼 종료</option>';
  return h;
}

function bindShotPanel(r,s,b){
  $('pSzk').onchange=e=>{snapshot();const v=e.target.value; s.zk = v===''?null:(v==='off'?'off':parseFloat(v));};
  $('pName').oninput=e=>{trackEdit(e.target);s.name=e.target.value;renderScenes();};
  $('pCap').oninput=e=>{trackEdit(e.target);s.cap=e.target.value;};
  r.querySelectorAll('.bl').forEach(el=>el.onclick=(e)=>{
    const mv=e.target.dataset.mv;
    if(mv){
      const bid=e.target.dataset.bid;
      const idx=s.boxes.findIndex(x=>x.id===bid);
      if((mv==='up'&&idx>0)||(mv==='dn'&&idx>=0&&idx<s.boxes.length-1)) snapshot();
      if(mv==='up'&&idx>0){[s.boxes[idx-1],s.boxes[idx]]=[s.boxes[idx],s.boxes[idx-1]];}
      else if(mv==='dn'&&idx>=0&&idx<s.boxes.length-1){[s.boxes[idx+1],s.boxes[idx]]=[s.boxes[idx],s.boxes[idx+1]];}
      render();
      return;
    }
    sel=el.dataset.id;render();
  });
  if(b){
    $('pTxt').oninput=e=>{trackEdit(e.target);b.text=e.target.value;
      const t=r.querySelector('.bl[data-id="'+b.id+'"] .t');
      const i=s.boxes.indexOf(b);
      if(t){t.textContent=(i+1)+'. '+(b.text||'설명 없음');t.className='t'+(b.text?'':' no');}};
    $('pNext').onchange=e=>{snapshot();b.next=e.target.value;};
    $('pPos').onchange=e=>{snapshot();b.pos=e.target.value;};
    $('pCol').onclick=e=>{const c=e.target.dataset.c; if(c){snapshot();b.color=c;render();}};
    ['X','Y','W','H'].forEach(k=>{
      $('p'+k).oninput=e=>{
        trackEdit(e.target);
        const v=parseFloat(e.target.value); if(isNaN(v))return;
        b[k.toLowerCase()]=Math.max(k==='W'||k==='H'?.5:0,v); renderCanvas();};
    });
    $('pDel').onclick=()=>{snapshot();s.boxes=s.boxes.filter(x=>x.id!==b.id);sel=null;render();};

    /* 이 박스만의 음성 문구 — 다른 박스의 pBSay와는 완전히 독립된 값(b.say)이라 서로 영향 없음 */
    $('pBSay').oninput=e=>{trackEdit(e.target);b.say=e.target.value;};
    $('pBSayT').onclick=()=>{
      const t=(b.say||'').trim()||b.text||'';
      if(!t) return toast('읽을 문장이 없어요');
      if(!window.speechSynthesis) return toast('이 브라우저는 음성 읽기를 지원하지 않아요');
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=S.rate||1;
      const v=pickVoice();
      if(v) u.voice=v; else toast('한국어 음성이 설치돼 있지 않을 수 있어요');
      speechSynthesis.speak(u);
    };
    $('pBSayC').onclick=()=>{
      snapshot();
      b.say=b.text||''; renderPanel();
    };
  }
  /* 박스가 없는 장면일 때만 보이는 장면 전체 음성 문구 */
  if($('pSay')) $('pSay').oninput=e=>{trackEdit(e.target);s.say=e.target.value;};
  if($('pSayT')) $('pSayT').onclick=()=>{
    const t=(s.say||'').trim()||(s.cap||'');
    if(!t) return toast('읽을 문장이 없어요');
    if(s.audio){ const a=new Audio(s.audio); a.playbackRate=S.rate||1; a.play(); return; }
    if(!window.speechSynthesis) return toast('이 브라우저는 음성 읽기를 지원하지 않아요');
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=S.rate||1;
    const v=pickVoice();
    if(v) u.voice=v; else toast('한국어 음성이 설치돼 있지 않을 수 있어요');
    speechSynthesis.speak(u);
  };
  if($('pAudB')) $('pAudB').onclick=()=>{ audFor=s; $('fAud').click(); };
  if($('pAudX')) $('pAudX').onclick=()=>{ snapshot(); s.audio=''; renderPanel(); };
}

/* ═══════════════ 박스 드래그 편집 ═══════════════ */
const ov=$('ov'), tmp=$('tmp');
let drag=null;

ov.addEventListener('mousedown',e=>{
  const s=scene(); if(!s) return;
  const R=ov.getBoundingClientRect();
  const bx=e.target.closest('.box');
  if(bx){
    const b=s.boxes.find(x=>x.id===bx.dataset.id);
    sel=b.id; render();
    const h=e.target.dataset.h;
    /* 실제로 드래그가 시작될 때(첫 mousemove)만 되돌리기 기록을 남긴다 — 그냥 클릭만 해서
       선택하는 경우까지 매번 전체 상태를 저장하면 무거워지므로 snapped 플래그로 구분 */
    drag={mode:h?'resize':'move',h,b,R,sx:e.clientX,sy:e.clientY,o:{x:b.x,y:b.y,w:b.w,h:b.h},snapped:false};
  }else{
    sel=null; render();
    drag={mode:'new',R,sx:e.clientX,sy:e.clientY};
  }
  e.preventDefault();
});

document.addEventListener('mousemove',e=>{
  if(!drag) return;
  const R=drag.R, px=v=>v/R.width*100, py=v=>v/R.height*100;
  if(drag.mode==='new'){
    const x=Math.min(drag.sx,e.clientX)-R.left, y=Math.min(drag.sy,e.clientY)-R.top;
    tmp.style.display='block';
    tmp.style.cssText='display:block;left:'+x+'px;top:'+y+'px;width:'+Math.abs(e.clientX-drag.sx)+
      'px;height:'+Math.abs(e.clientY-drag.sy)+'px';
    return;
  }
  const dx=px(e.clientX-drag.sx), dy=py(e.clientY-drag.sy), o=drag.o, b=drag.b;
  if(!drag.snapped){
    drag.snapped=true;
    H_past.push(JSON.stringify(S)); if(H_past.length>H_MAX)H_past.shift();
    H_future=[]; H_typingEl=null; dirty=true; syncHistBtns();
  }
  if(drag.mode==='move'){
    b.x=Math.max(0,Math.min(100-o.w,o.x+dx));
    b.y=Math.max(0,Math.min(100-o.h,o.y+dy));
  }else{
    const h=drag.h;
    if(h.includes('e')) b.w=Math.max(.5,Math.min(100-o.x,o.w+dx));
    if(h.includes('s')) b.h=Math.max(.5,Math.min(100-o.y,o.h+dy));
    if(h.includes('w')){const nx=Math.max(0,Math.min(o.x+o.w-.5,o.x+dx));b.w=o.w+(o.x-nx);b.x=nx;}
    if(h.includes('n')){const ny=Math.max(0,Math.min(o.y+o.h-.5,o.y+dy));b.h=o.h+(o.y-ny);b.y=ny;}
  }
  const el=ov.querySelector('.box[data-id="'+b.id+'"]');
  if(el){el.style.left=b.x+'%';el.style.top=b.y+'%';el.style.width=b.w+'%';el.style.height=b.h+'%';}
});

document.addEventListener('mouseup',e=>{
  if(!drag) return;
  const d=drag; drag=null; tmp.style.display='none';
  const s=scene(); if(!s) return;
  if(d.mode==='new'){
    const R=d.R;
    const w=Math.abs(e.clientX-d.sx), h=Math.abs(e.clientY-d.sy);
    if(w<8||h<8) return;
    snapshot();
    const b={id:nid(),
      x:(Math.min(d.sx,e.clientX)-R.left)/R.width*100,
      y:(Math.min(d.sy,e.clientY)-R.top)/R.height*100,
      w:w/R.width*100, h:h/R.height*100,
      text:'', say:'', next:'auto', pos:'auto', color:PAL[s.boxes.length%PAL.length]};
    s.boxes.push(b); sel=b.id; render();
    setTimeout(()=>{const t=$('pTxt'); if(t)t.focus();},30);
  } else { renderPanel(); }
});

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;

/* 말풍선 위치. 좌표는 이미지(확대된 크기) 기준이며 보이는 영역 안으로 가둔다 */
function place(p,b,g){
 var pw=p.offsetWidth,ph=p.offsetHeight,gap=13;
 var bx=b.x/100*g.fw,by=b.y/100*g.fh,bw=b.w/100*g.fw,bh=b.h/100*g.fh;
 var vL=-g.tx, vT=-g.ty, vR=vL+g.vw, vB=vT+g.vh;   /* 보이는 창(이미지 좌표계) */
 var pos=b.pos&&b.pos!=='auto'?b.pos:
   (by-vT>ph+gap+8?'top':(by+bh+ph+gap<vB?'bottom':(bx-vL>pw+gap?'left':'right')));
 var L,T,cls;
 if(pos==='top'){T=by-ph-gap;L=bx+bw/2-pw/2;cls='tp';}
 else if(pos==='bottom'){T=by+bh+gap;L=bx+bw/2-pw/2;cls='bt';}
 else if(pos==='left'){L=bx-pw-gap;T=by+bh/2-ph/2;cls='lf';}
 else{L=bx+bw+gap;T=by+bh/2-ph/2;cls='rt';}
 var L2=Math.max(vL+6,Math.min(vR-pw-6,L));
 if(cls==='tp'||cls==='bt')p.style.setProperty('--ax',(bx+bw/2-L2)+'px');
 T=Math.max(vT+6,Math.min(vB-ph-6,T));
 p.className='tip '+cls;p.style.left=L2+'px';p.style.top=T+'px';
}

function dl(name,text,type){

}
